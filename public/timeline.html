<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bug Ledger · Activity</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%98%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#f5f6fb; --ink:#12141c; --muted:#636879; --card:rgba(255,255,255,.72);
    --line:rgba(18,20,28,.09); --coral:#ff6a5a; --good:#12b886; --violet:#8b7bf0; --sky:#5b9dff;
    --shadow:0 16px 44px -24px rgba(30,25,60,.32);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0b0d15; --ink:#eef0f7; --muted:#9aa0b4; --card:rgba(255,255,255,.05);
      --line:rgba(255,255,255,.11); --shadow:0 24px 60px -24px rgba(0,0,0,.7); }
  }
  html,body{margin:0;min-height:100%}
  body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:var(--ink);
    background:var(--bg);overflow-x:hidden;position:relative;-webkit-font-smoothing:antialiased}
  .aurora{position:fixed;inset:-20vh -10vw;z-index:-1;filter:blur(72px) saturate(120%);opacity:.8;pointer-events:none}
  .aurora span{position:absolute;border-radius:50%;animation:drift 24s ease-in-out infinite}
  .aurora .a{width:50vw;height:50vw;left:-6vw;top:-8vh;background:radial-gradient(circle at 30% 30%,#ff9a7a,transparent 62%)}
  .aurora .b{width:46vw;height:46vw;right:-8vw;top:-6vh;background:radial-gradient(circle at 60% 40%,#8ab6ff,transparent 62%);animation-delay:-7s}
  .aurora .c{width:46vw;height:46vw;left:14vw;bottom:-16vh;background:radial-gradient(circle at 50% 50%,#7ff0cf,transparent 60%);animation-delay:-13s}
  .aurora .d{width:38vw;height:38vw;right:6vw;bottom:-12vh;background:radial-gradient(circle at 50% 50%,#c9a3ff,transparent 62%);animation-delay:-18s}
  @media (prefers-color-scheme:dark){.aurora{opacity:.5}}
  @keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(3vw,4vh) scale(1.07)}66%{transform:translate(-3vw,-2vh) scale(.96)}}
  @media (prefers-reduced-motion:reduce){.aurora span{animation:none}}

  .wrap{max-width:760px;margin:0 auto;padding:30px 20px 90px}
  header.top{display:flex;align-items:center;gap:12px;margin:6px 0 6px}
  .brand{font-weight:800;letter-spacing:-.02em;font-size:20px}
  .brand .dot{color:var(--coral)}
  .top .sub{color:var(--muted);font-size:13.5px;margin-left:auto;display:flex;align-items:center;gap:7px}
  .beat{width:8px;height:8px;border-radius:50%;background:var(--good);animation:beat 1.6s ease-out infinite}
  @keyframes beat{0%{box-shadow:0 0 0 0 rgba(18,184,134,.55)}70%{box-shadow:0 0 0 9px rgba(18,184,134,0)}100%{box-shadow:0 0 0 0 rgba(18,184,134,0)}}
  .lede{color:var(--muted);font-size:14px;margin:0 0 20px}
  .lede a{color:inherit}

  .day{font-weight:800;font-size:13px;letter-spacing:.02em;color:var(--muted);text-transform:uppercase;margin:26px 0 10px;padding-left:34px}
  .tl{position:relative;padding-left:34px}
  .tl::before{content:"";position:absolute;left:11px;top:4px;bottom:4px;width:2px;
    background:linear-gradient(var(--line),var(--line));border-radius:2px}
  .ev{position:relative;margin:0 0 14px;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .node{position:absolute;left:-27px;top:20px;width:14px;height:14px;border-radius:50%;
    border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
  .ev-session .node{background:var(--coral)}
  .ev-check .node{background:var(--good)}
  .ev-check.full .node{background:var(--violet)}
  .ev-check.sec .node{background:#e5484d}
  .ev.live .node{background:var(--coral);animation:beat2 1.4s ease-out infinite}
  @keyframes beat2{0%{box-shadow:0 0 0 0 rgba(255,106,90,.6)}70%{box-shadow:0 0 0 8px rgba(255,106,90,0)}100%{box-shadow:0 0 0 0 rgba(255,106,90,0)}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);padding:14px 16px}
  .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .kind{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px}
  .kind.session{color:var(--coral);background:color-mix(in srgb,var(--coral) 13%,transparent)}
  .kind.check{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
  .kind.full{color:var(--violet);background:color-mix(in srgb,var(--violet) 16%,transparent)}
  .kind.sec{color:#e5484d;background:color-mix(in srgb,#e5484d 14%,transparent)}
  .chip.sec{color:#e5484d;border-color:color-mix(in srgb,#e5484d 55%,transparent)}
  a.chip.report{text-decoration:none;color:var(--coral);border-color:color-mix(in srgb,var(--coral) 50%,transparent);font-weight:800}
  a.chip.report:hover{background:color-mix(in srgb,var(--coral) 12%,transparent)}
  .app{font-weight:700}.proj{color:var(--muted);font-weight:500}
  .when{margin-left:auto;color:var(--muted);font-size:12.5px;white-space:nowrap}
  .title{font-weight:650;margin:6px 0 2px}
  .cur{color:var(--muted);font-size:13.5px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .chip{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
  .chip.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 55%,transparent)}
  .chip.warn{color:var(--coral);border-color:color-mix(in srgb,var(--coral) 55%,transparent)}
  .chip.full{color:var(--violet);border-color:color-mix(in srgb,var(--violet) 55%,transparent)}
  .live-pill{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--coral)}
  .bar{height:7px;border-radius:99px;background:color-mix(in srgb,var(--muted) 18%,transparent);overflow:hidden;margin-top:9px}
  .bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--coral),#ff9270);transition:width .5s}
  .ev-check .bar>i{background:linear-gradient(90deg,var(--good),#4fd1a5)}
  .ev-check.full .bar>i{background:linear-gradient(90deg,var(--violet),#b3a3ff)}
  .empty{text-align:center;padding:16vh 20px;color:var(--muted)}
  .empty h1{font-size:24px;color:var(--ink);font-weight:800;margin:0 0 8px}
  .empty code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 7px}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:30px}
  .foot a{color:inherit}
</style>
</head>
<body>
<div class="aurora"><span class="a"></span><span class="b"></span><span class="c"></span><span class="d"></span></div>
<div class="wrap">
  <header class="top">
    <div class="brand">Bug Ledger<span class="dot">.</span> Activity</div>
    <div class="sub"><span class="beat"></span><span id="pollstate">live</span></div>
  </header>
  <p class="lede">Every work session and scan, saved and streamed. · <a href="/live">live board</a> · <a href="/">the ledger</a></p>
  <main id="feed"></main>
  <div class="foot">A permanent, append-only record of agent activity.</div>
</div>
<script>
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  function rel(ms){var s=Math.max(0,Math.floor(ms/1000));if(s<60)return s+'s ago';var m=Math.floor(s/60);if(m<60)return m+'m ago';var h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago';}
  function hhmm(ts){var d=new Date(ts);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fullts(ts){var d=new Date(ts),p=function(n){return ('0'+n).slice(-2)};
    return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()+', '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());}
  function dayKey(ts){var d=new Date(ts);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();}
  function dayLabel(ts){
    var d=new Date(ts), n=new Date(); var td=dayKey(n.getTime());
    var yd=new Date(n.getTime()-864e5);
    if(dayKey(ts)===td) return 'Today';
    if(dayKey(ts)===dayKey(yd.getTime())) return 'Yesterday';
    return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
  }

  function sessionCard(e){
    var live=e.live, done=e.status==='done';
    var pg=e.progress;
    var pct = pg&&pg.total ? Math.round(pg.done/pg.total*100) : (e.total?Math.round((e.done||0)/e.total*100):0);
    var countTxt = pg&&pg.total ? (pg.done+' / '+pg.total+' '+(pg.label||'')) : ((e.done||0)+' / '+(e.total||0)+' tasks');
    return '<div class="card">'+
      '<div class="row1"><span class="kind session">worklog</span>'+
        '<span class="app">'+esc(e.app||'')+'</span>'+(e.project?'<span class="proj">· '+esc(e.project)+'</span>':'')+
        (live?'<span class="live-pill">● LIVE</span>':'')+
        '<span class="when" title="'+fullts(e.ts)+'">'+(live?rel(Date.now()-e.ts):fullts(e.ts))+'</span></div>'+
      (e.title?'<div class="title">'+esc(e.title)+'</div>':'')+
      (e.current?'<div class="cur">'+esc(e.current)+'</div>':'')+
      '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
      '<div class="chips"><span class="chip">'+countTxt+'</span>'+(done?'<span class="chip ok">✓ complete</span>':'')+'</div>'+
    '</div>';
  }
  function checkCard(e){
    var full=e.scope==='all', sec=e.scope==='security', cov=e.coverage;
    var unit = sec?'security':'bugs';
    var covChip = cov ? '<span class="chip '+(sec?'sec':full?'full':(cov.complete?'ok':'warn'))+'">'+
      (cov.complete?'✓ ':'⚠ ')+cov.matched+'/'+cov.total+' '+unit+'</span>' :
      ((e.checkedBy||'').indexOf('scan')>=0?'<span class="chip">🔍 detector scan</span>':'');
    var secOk=e.securityStatus==='clean';
    var pct=cov?cov.pct:0;
    var kindLbl = sec?'full security sweep':full?'full-catalog scan':'bug + security check';
    return '<div class="card">'+
      '<div class="row1"><span class="kind '+(sec?'sec':full?'full':'check')+'">'+(sec?'🛡 ':'')+kindLbl+'</span>'+
        '<span class="app">'+esc(e.app||'')+'</span>'+(e.project?'<span class="proj">· '+esc(e.project)+'</span>':'')+
        '<span class="when" title="'+fullts(e.ts)+'">'+fullts(e.ts)+'</span></div>'+
      (cov?'<div class="bar"><i style="width:'+pct+'%"></i></div>':'')+
      '<div class="chips">'+covChip+
        '<span class="chip '+(secOk?'ok':(e.securityStatus==='issues'?'warn':''))+'">security: '+esc(e.securityStatus||'n/a')+'</span>'+
        (e.foundCount?'<span class="chip warn">'+e.foundCount+' present</span>':'')+
        (e.id?'<a class="chip report" href="/report?id='+esc(e.id)+'">📊 Full report →</a>':'')+
      '</div></div>';
  }

  var lastSig=null;
  function render(data){
    var feed=document.getElementById('feed');
    var evs=(data&&data.events)||[];
    document.getElementById('pollstate').textContent = !evs.length?'waiting…':(evs.some(function(e){return e.live;})?'live':'up to date');
    // only rebuild the DOM when the content actually changes — otherwise the entrance
    // animation replays every poll and the timeline flickers (stable fields only, no volatile ts)
    var sig=evs.map(function(e){ return e.kind==='session'
      ? 's'+e.started+e.status+(e.done||0)+'/'+(e.total||0)+(e.progress?e.progress.done+'/'+e.progress.total:'')+(e.live?'L':'')+(e.current||'')
      : 'c'+e.id+(e.foundCount||0)+(e.coverage?e.coverage.matched+'/'+e.coverage.total:''); }).join('|');
    if(sig===lastSig) return;
    lastSig=sig;
    if(!evs.length){
      feed.innerHTML='<div class="empty"><h1>No activity yet</h1><p>Run <code>/showwork</code> or <code>/bugcheck</code> in a project and it appears here — saved forever.</p></div>';
      return;
    }
    var html='', lastDay=null;
    evs.forEach(function(e){
      var dl=dayLabel(e.ts);
      if(dl!==lastDay){ if(lastDay!==null) html+='</div>'; html+='<div class="day">'+esc(dl)+'</div><div class="tl">'; lastDay=dl; }
      var cls='ev '+(e.kind==='session'?'ev-session':'ev-check')+(e.kind==='check'&&e.scope==='all'?' full':'')+(e.kind==='check'&&e.scope==='security'?' sec':'')+(e.live?' live':'');
      html+='<div class="'+cls+'"><span class="node"></span>'+(e.kind==='session'?sessionCard(e):checkCard(e))+'</div>';
    });
    html+='</div>';
    feed.innerHTML=html;
    document.getElementById('pollstate').textContent = evs.some(function(e){return e.live;})?'live':'up to date';
  }
  function poll(){ fetch('/api/activity?limit=120',{cache:'no-store'}).then(function(r){return r.json();}).then(render)
    .catch(function(){document.getElementById('pollstate').textContent='reconnecting…';}); }
  poll(); setInterval(poll, 4000);
</script>
</body>
</html>
