<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity · Breadledger</title>
<meta name="description" content="A permanent, append-only timeline of every scan, story and ledger addition across the portfolio.">
<meta property="og:type" content="website">
<meta property="og:title" content="Breadledger · Activity">
<meta property="og:description" content="A permanent, append-only timeline of every scan, story and ledger addition across the portfolio.">
<meta property="og:image" content="https://breadledger.coconvo.workers.dev/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/bread.css">
<script src="/bread-shell.js"></script>
<style>
  /* page-only styles, tokens only — candidates for bread.css: .poll, .ev .chips, .progress.info/.danger, .ev.live .ico */
  .poll{display:inline-flex;align-items:center;gap:8px;height:34px;font-size:13.5px;color:var(--ink-3);white-space:nowrap}
  .filters .seg{flex:0 0 auto}
  .ev .line .proj{color:var(--ink-3)}
  .ev .txt.t{font-weight:600;color:var(--ink)}
  .ev .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
  .ev .progress{margin:5px 0 3px;max-width:520px}
  .progress.info>i{background:var(--info)} .progress.danger>i{background:var(--danger)}
  .ev.live .ico{box-shadow:0 0 0 3px var(--accent-soft)}
  .ev .shots{margin-top:6px}
  .ev .cat{margin-left:2px}
  .badge svg.ico{width:13px;height:13px}
  .foot{margin-top:28px;text-align:center}
  #err{margin-bottom:14px}
  .clear-wrap{display:flex;justify-content:center;margin-top:-28px;padding-bottom:28px}
  @media (max-width:900px){ .filters .seg{grid-column:1/-1;display:flex} .filters .seg button{flex:1;justify-content:center;padding:0 6px} .filters .select{grid-column:1/-1;max-width:none} }
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="bl-app" id="app">
  <aside class="bl-side" id="side" aria-label="Sidebar"></aside>
  <div class="bl-main">
    <header class="bl-top" id="top"></header>
    <main class="bl-content" id="page">
      <div class="page-h">
        <div>
          <h1>Activity</h1>
          <p class="lead">Every work session and scan, saved and streamed.</p>
        </div>
        <div class="actions"><span class="poll" id="poll"><span class="pip off" id="pollpip"></span><span id="pollstate">live</span></span></div>
      </div>
      <div class="filters" id="filters">
        <div class="seg" role="group" aria-label="Kind" id="kindSeg">
          <button type="button" class="on" data-kind="all" aria-pressed="true">All</button>
          <button type="button" data-kind="session" aria-pressed="false">Worklogs</button>
          <button type="button" data-kind="check" aria-pressed="false">Checks</button>
          <button type="button" data-kind="addition" aria-pressed="false">Additions</button>
        </div>
        <select class="select" id="appSel" aria-label="App"><option value="">All apps</option></select>
        <span class="count" id="count"></span>
      </div>
      <div id="err" hidden></div>
      <section id="feed" aria-label="Activity feed"></section>
      <p class="meta foot">A permanent, append-only record of agent activity. · <a href="/admin">admin</a></p>
    </main>
  </div>
</div>
<script>
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  function rel(ms){var s=Math.max(0,Math.floor(ms/1000));if(s<60)return s+'s ago';var m=Math.floor(s/60);if(m<60)return m+'m ago';var h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago';}
  function hhmm(ts){var d=new Date(ts);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fullts(ts){var d=new Date(ts),p=function(n){return ('0'+n).slice(-2)};
    return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()+', '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());}
  function dayKey(ts){return Bread.dayKey(ts);}
  function dayLabel(ts){return Bread.dayLabel(Bread.dayKey(ts));}

  // D9 fix: every check scope has a name (scopeLabel vocabulary) — optimiser sweeps and per-category checks no longer read "bug + security check … bugs"
  function scopeLabel(sc){ sc=sc||'app'; if(sc==='app')return 'this app'; if(sc==='all')return 'all bugs (16 categories)'; if(sc==='security')return 'security sweep';
    if(sc==='optimisers')return 'optimiser sweep'; if(sc==='full')return 'grand total (everything)'; var m=/^category:(.+)$/.exec(sc); if(m)return m[1]+' bugs'; return sc; }
  function scopeUnit(sc){ sc=sc||'app'; if(sc==='security')return 'security'; if(sc==='optimisers')return 'optimisers'; if(sc==='full')return 'items'; var m=/^category:(.+)$/.exec(sc); if(m)return m[1]+' bugs'; return 'bugs'; }
  function kindLabel(sc){ sc=sc||'app'; if(sc==='security')return 'full security sweep'; if(sc==='all')return 'full-catalog scan'; if(sc==='app')return 'bug + security check'; return scopeLabel(sc); }

  function when(e){ return '<span class="when" title="'+esc(fullts(e.ts))+'">'+(e.live?rel(Date.now()-e.ts):Bread.ago(e.ts))+'</span>'; }
  function line(e, kindBadge){
    return '<div class="line">'+Bread.avatar(e.app||'','xs')+'<span class="who">'+esc(e.app||'')+'</span>'+(e.project?'<span class="proj">· '+esc(e.project)+'</span>':'')+kindBadge+
      (e.live?'<span class="badge accent"><span class="pip live"></span>Live</span>':'')+when(e)+'</div>';
  }
  function storyBtn(id, label){ return id?'<a class="btn sm" href="/story/'+encodeURIComponent(id)+'">'+Bread.icon('ledger')+esc(label||'Story')+'</a>':''; }

  function sessionCard(e){
    var live=e.live, done=e.status==='done';
    var pg=e.progress;
    var pct = pg&&pg.total ? Math.round(pg.done/pg.total*100) : (e.total?Math.round((e.done||0)/e.total*100):0);
    var countTxt = pg&&pg.total ? (pg.done+' / '+pg.total+' '+(pg.label||'')) : ((e.done||0)+' / '+(e.total||0)+' tasks');
    return '<div class="ev'+(live?' live':'')+'"><span class="ico accent">'+Bread.icon('live')+'</span><div class="body">'+
      line(e, '<span class="badge">worklog</span>')+
      (e.title?'<div class="txt t">'+esc(e.title)+'</div>':'')+
      (e.current?'<div class="txt">'+esc(e.current)+'</div>':'')+
      '<div class="progress sm'+(done?' ok':'')+'" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'" aria-label="Progress"><i style="width:'+pct+'%"></i></div>'+
      '<div class="chips"><span class="badge num">'+esc(countTxt)+'</span>'+(done?'<span class="badge ok">'+Bread.icon('check')+'complete</span>':'')+storyBtn(e.id)+'</div>'+
    '</div></div>';
  }
  function checkCard(e){
    var full=e.scope==='all', sec=e.scope==='security', cov=e.coverage, unit=scopeUnit(e.scope);
    var covChip = cov ? '<span class="badge '+(cov.complete?'ok':'warn')+' num">'+Bread.icon(cov.complete?'check':'alert')+cov.matched+'/'+cov.total+' '+esc(unit)+'</span>' :
      ((e.checkedBy||'').indexOf('scan')>=0?'<span class="badge">'+Bread.icon('scan')+'detector scan</span>':'');
    var secOk=e.securityStatus==='clean';
    var pct=cov?cov.pct:0;
    var ico = sec?'<span class="ico danger">'+Bread.icon('shieldcheck')+'</span>':full?'<span class="ico info">'+Bread.icon('ledger')+'</span>':'<span class="ico ok">'+Bread.icon('checkcircle')+'</span>';
    return '<div class="ev">'+ico+'<div class="body">'+
      line(e, '<span class="badge '+(sec?'danger':full?'info':'ok')+'">'+esc(kindLabel(e.scope))+'</span>')+
      (cov?'<div class="progress sm '+(sec?'danger':full?'info':'ok')+'" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'" aria-label="Coverage"><i style="width:'+pct+'%"></i></div>':'')+
      '<div class="chips">'+covChip+
        '<span class="badge '+(secOk?'ok':(e.securityStatus==='issues'?'warn':''))+'">security: '+esc(e.securityStatus||'n/a')+'</span>'+
        (e.foundCount?'<span class="badge warn num">'+e.foundCount+' present</span>':'')+
        storyBtn(e.sessionId)+
        (e.id?'<a class="btn sm" href="/report?id='+encodeURIComponent(e.id)+(e.sessionId?'&legacy=1':'')+'">'+Bread.icon('checkcircle')+'Coverage</a>':'')+
      '</div></div></div>';
  }

  var lastSig=null, EVS=[], F={kind:'all', app:''};
  function additionCard(e){
    var sk=e.subkind==='optimiser'?'optimiser':(e.subkind==='security'?'security':'bug');
    var ic=sk==='optimiser'?'sparkles':(sk==='security'?'shieldcheck':'bug');
    var sev=['critical','high','medium','low'].indexOf(e.severity)>=0?e.severity:'';
    return '<div class="ev"><span class="ico warn">'+Bread.icon('plus')+'</span><div class="body">'+
      line(e, '<span class="badge warn">'+Bread.icon(ic)+'added · '+sk+'</span>'+(sev?'<span class="badge '+sev+'">'+esc(sev)+'</span>':'')+(e.category?'<span class="cat '+esc(e.category)+'">'+esc(e.category)+'</span>':''))+
      '<div class="txt t">'+esc(e.title)+'</div>'+shotStrip(e.shots)+
      (e.sessionId?'<div class="chips">'+storyBtn(e.sessionId,'From this story')+'</div>':'')+'</div></div>';
  }
  // thumbnails for screenshots attached to a finding — each opens in the shared lightbox (←/→, Esc)
  function shotStrip(shots){
    if(!Array.isArray(shots)||!shots.length) return '';
    return Bread.shotStrip(shots.filter(function(s){ return s&&s.url; }).map(function(s){ return {url:s.url, caption:s.caption||''}; }));
  }

  function setPoll(state){
    var pip=document.getElementById('pollpip'), tx=document.getElementById('pollstate');
    pip.className='pip '+(state==='live'?'live':'off');
    tx.textContent=state==='live'?'live':state==='reconnecting'?'reconnecting…':state==='waiting'?'waiting…':'up to date';
  }
  function showErr(on){
    var el=document.getElementById('err');
    if(!on){ el.hidden=true; el.innerHTML=''; return; }
    if(el.hidden){ el.hidden=false; el.innerHTML='<div class="note danger" role="alert">'+Bread.icon('alert')+'<span class="grow">The timeline lost its connection — it keeps retrying every 4 s.</span><button class="btn sm" type="button" id="retry">'+Bread.icon('reset')+'Retry</button></div>';
      document.getElementById('retry').onclick=poll; }
  }

  // filters: a kind segment + an app select, mirrored in the hash (#kind=check&app=Abba) so a view is linkable
  function readHash(){ try{ var p=new URLSearchParams((location.hash||'').replace(/^#/,'')); F.kind=p.get('kind')||'all'; F.app=p.get('app')||''; }catch(e){} if(['all','session','check','addition'].indexOf(F.kind)<0) F.kind='all'; }
  function writeHash(){ var p=[]; if(F.kind!=='all') p.push('kind='+encodeURIComponent(F.kind)); if(F.app) p.push('app='+encodeURIComponent(F.app)); try{ history.replaceState(null,'',location.pathname+(p.length?'#'+p.join('&'):'')); }catch(e){} }
  var KNOWN={}, pollSeq=0;
  function paintFilters(){
    Bread.$$('#kindSeg button').forEach(function(b){ var on=b.getAttribute('data-kind')===F.kind; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on?'true':'false'); });
    var sel=document.getElementById('appSel'), apps=KNOWN; EVS.forEach(function(e){ if(e.app) apps[e.app]=1; }); if(F.app) apps[F.app]=1;   // the chosen app stays chosen, even before its events arrive
    var names=Object.keys(apps).sort(function(a,b){ return a.localeCompare(b); });
    var have=Bread.$$('option',sel).slice(1).map(function(o){ return o.value; });
    if(have.join('|')!==names.join('|')) sel.innerHTML='<option value="">All apps</option>'+names.map(function(n){ return '<option value="'+esc(n)+'">'+esc(n)+'</option>'; }).join('');
    sel.value=F.app;
  }
  function clearFilters(){ F.kind='all'; F.app=''; writeHash(); paintFilters(); draw(); poll(); }
  document.getElementById('kindSeg').addEventListener('click', function(ev){ var b=ev.target.closest('button[data-kind]'); if(!b) return; F.kind=b.getAttribute('data-kind'); writeHash(); paintFilters(); draw(); });
  document.getElementById('appSel').addEventListener('change', function(){ F.app=this.value; writeHash(); draw(); poll(); });
  window.addEventListener('hashchange', function(){ readHash(); paintFilters(); draw(); poll(); });

  function draw(){
    var feed=document.getElementById('feed');
    var evs=EVS.filter(function(e){ return (F.kind==='all'||e.kind===F.kind) && (!F.app||e.app===F.app); });
    var count=document.getElementById('count');
    count.textContent = EVS.length ? (evs.length===EVS.length ? EVS.length+' events' : evs.length+' of '+EVS.length+' events') : '';
    if(!EVS.length){
      feed.innerHTML=Bread.empty('No activity yet', 'Run <code>/showwork</code> or <code>/bugcheck</code> in a project and it appears here — saved forever.', 'activity', '/art/empty-desk.png');
      return;
    }
    if(!evs.length){
      var named=[]; if(F.kind!=='all') named.push({all:'',session:'Worklogs',check:'Checks',addition:'Additions'}[F.kind]); if(F.app) named.push(F.app);
      feed.innerHTML=Bread.empty('Nothing matches these filters', 'No events for '+named.map(function(n){ return '<span class="chip on">'+esc(n)+'</span>'; }).join(' ')+' yet.', 'filter')+
        '<div class="clear-wrap"><button class="btn" type="button" id="clearF">'+Bread.icon('x')+'Clear filters</button></div>';
      document.getElementById('clearF').onclick=clearFilters;
      return;
    }
    var html='', lastDay=null;
    evs.forEach(function(e){
      var dk=dayKey(e.ts);
      if(dk!==lastDay){ html+='<div class="day-h">'+esc(Bread.dayLabel(dk))+'</div>'; lastDay=dk; }
      html+= e.kind==='session'?sessionCard(e):e.kind==='addition'?additionCard(e):checkCard(e);
    });
    feed.innerHTML=html;
    Bread.$$('.shot img', feed).forEach(function(i){ i.setAttribute('data-framed',''); });   // screenshots are framed photos: their edges are the point
  }
  function render(data){
    var evs=(data&&data.events)||[];
    setPoll(!evs.length?'waiting':(evs.some(function(e){return e.live;})?'live':'uptodate'));
    // only rebuild the DOM when the content actually changes — otherwise the timeline flickers on every poll
    var sig=evs.map(function(e){ return e.kind==='session'
      ? 's'+e.started+e.status+(e.done||0)+'/'+(e.total||0)+(e.progress?e.progress.done+'/'+e.progress.total:'')+(e.live?'L':'')+(e.current||'')
      : e.kind==='addition' ? 'a'+e.id
      : 'c'+e.id+(e.foundCount||0)+(e.coverage?e.coverage.matched+'/'+e.coverage.total:''); }).join('|');
    if(sig===lastSig) return;
    lastSig=sig; EVS=evs;
    paintFilters(); draw();
    window.BREAD_SEARCH=function(q){ q=q.toLowerCase(); return EVS.filter(function(e){ return ((e.app||'')+' '+(e.project||'')+' '+(e.title||'')).toLowerCase().indexOf(q)>=0; }).slice(0,12).map(function(e){
      var id=e.kind==='session'?e.id:e.sessionId; return {group:'Activity', label:(e.app||'')+' · '+(e.title||kindLabel(e.scope)), icon:e.kind==='session'?'live':e.kind==='addition'?'plus':'checkcircle', href:id?'/story/'+encodeURIComponent(id):(e.kind==='check'?'/report?id='+encodeURIComponent(e.id):'/timeline'), sub:Bread.ago(e.ts)}; }); };
  }
  function poll(){ if(document.hidden) return; var seq=++pollSeq; fetch('/api/activity?limit=120'+(F.app?'&app='+encodeURIComponent(F.app):''),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){ if(seq!==pollSeq) return; showErr(false); render(d); })
    .catch(function(){ setPoll('reconnecting'); showErr(true); }); }
  readHash(); paintFilters();
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) poll(); });
  poll(); setInterval(poll, 4000);
  Bread.mount({ active: 'activity', title: 'Activity', crumbs: ['Activity'] });
</script>
</body>
</html>
