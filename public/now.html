<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now · Breadledger</title>
<meta name="description" content="Everything in progress right now, across every project — each step, its note, its timer, the screens and the features shipped, live.">
<meta property="og:type" content="website">
<meta property="og:title" content="Breadledger · Now">
<meta property="og:description" content="Everything in progress right now, across every project — live.">
<meta property="og:image" content="https://breadledger.coconvo.workers.dev/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/bread.css">
<script src="/bread-shell.js"></script>
<style>
  /* Now board — page styles on bread.css tokens only */
  .poll{display:inline-flex;align-items:center;gap:8px;height:34px;font-size:13.5px;color:var(--ink-3);white-space:nowrap}
  .now-stats{grid-template-columns:repeat(6,minmax(0,1fr))}
  @media (max-width:1180px){.now-stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (max-width:560px){.now-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .now-stats .stat .n small{font-size:15px;font-weight:600;color:var(--ink-3);letter-spacing:0;margin-left:2px}
  .now-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
  @media (max-width:1080px){.now-grid{grid-template-columns:minmax(0,1fr)}}
  #sessions{display:grid;gap:18px}

  /* ---- a session ---- */
  .sess{position:relative;overflow:hidden}
  .sess.enter{animation:rise .4s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .sess::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,hsl(var(--h) 70% 60%),var(--accent));opacity:.9}
  .sess.quiet::before{background:var(--line-2)} .sess.done::before{background:var(--ok)}
  .sess-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;padding:20px 20px 0}
  .sess-who{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-3);font-weight:500}
  .sess-who b{color:var(--ink-2);font-weight:650}
  .sess-title{font-size:20px;font-weight:680;letter-spacing:-.018em;line-height:1.28;margin-top:3px;text-wrap:pretty;overflow-wrap:anywhere}
  .sess-title a{color:inherit} .sess-title a:hover{text-decoration:none;color:var(--accent-text)}
  .sess-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .sess-meta .sep{opacity:.5}
  .state{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px 0 8px;border-radius:99px;font-size:12.5px;font-weight:650;letter-spacing:.01em;white-space:nowrap}
  .state.working{background:var(--ok-soft);color:var(--ok-ink)}
  .state.quiet{background:var(--warn-soft);color:var(--warn-ink)}
  .state.done{background:var(--bg-2);color:var(--ink-2);border:1px solid var(--line)}
  .state .pip{width:7px;height:7px;box-shadow:none} .state.quiet .pip{background:var(--warn)} .state.done .pip{background:var(--ok)}

  .ring{width:64px;height:64px;position:relative;flex:0 0 auto}
  .ring svg{width:64px;height:64px;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:6}
  .ring .trk{stroke:var(--bg-2)}
  .ring .val{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .8s var(--ease)}
  .sess.done .ring .val{stroke:var(--ok)}
  .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

  .doing{margin:16px 20px 0;padding:12px 14px;border-radius:var(--r-2);background:var(--accent-soft);color:var(--accent-soft-ink);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline}
  .sess.quiet .doing{background:var(--bg-2);color:var(--ink-2)} .sess.done .doing{background:var(--ok-soft);color:var(--ok-ink)}
  .doing .k{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.85}
  .doing .v{font-size:16.5px;font-weight:620;line-height:1.4;color:var(--ink);overflow-wrap:anywhere}
  .doing .car{display:inline-block;width:7px;height:1em;vertical-align:-2px;margin-left:4px;border-radius:2px;background:var(--accent);animation:blink 1.1s step-end infinite}
  .sess:not(.working) .doing .car{display:none}
  @keyframes blink{50%{opacity:0}}
  .doing .note2{grid-column:2;font-size:13.5px;color:var(--ink-2);line-height:1.5}

  /* wave track: one segment per wave, width ∝ its steps, fill = its progress */
  .waves{display:flex;gap:14px;margin:18px 20px 0}
  .wave{flex:calc(var(--n) + 1) 1 0;min-width:96px;display:grid;gap:7px;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
  .wave .bar{height:8px;border-radius:99px;background:var(--bg-2);border:1px solid var(--line);overflow:hidden}
  .wave .bar i{display:block;height:100%;width:var(--p);background:var(--accent);border-radius:99px;transition:width .7s var(--ease)}
  .wave.done .bar i{background:var(--ok)}
  .wave .wl{display:flex;gap:6px;align-items:baseline;font-size:12.5px;color:var(--ink-3);min-width:0}
  .wave .wl b{font-weight:650;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .wave .wl span{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
  .wave.on .wl b{color:var(--accent-text)} .wave.on .bar{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}

  /* steps, grouped by wave */
  .plan{padding:8px 20px 4px}
  .wgroup{border-top:1px solid var(--line);margin-top:12px;padding-top:4px}
  .wgroup:first-child{border-top:0;margin-top:6px}
  .wgh{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:8px 0;font:inherit;color:var(--ink-3);cursor:pointer;text-align:left}
  .wgh .t{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
  .wgh.on .t{color:var(--accent-text)}
  .wgh .c{font-size:12.5px;font-variant-numeric:tabular-nums}
  .wgh .chev{margin-left:auto;transition:transform var(--t)}
  .wgh .chev svg{width:15px;height:15px}
  .wgroup.shut .chev{transform:rotate(-90deg)}
  .wgroup.shut .steps2{display:none}
  .steps2{list-style:none;margin:0;padding:0}
  .st{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:0 10px;padding:7px 0;position:relative;align-items:start}
  .st+.st::before{content:"";position:absolute;left:11px;top:-7px;height:14px;border-left:2px solid var(--line)}
  .st .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);background:var(--panel);display:flex;align-items:center;justify-content:center;color:#fff;margin-top:-1px}
  .st .dot svg{width:13px;height:13px}
  .st.done .dot{background:var(--ok);border-color:var(--ok)}
  .st.active .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .st.active .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);animation:breathe 1.6s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(.6);opacity:.6}}
  .sess:not(.working) .st.active .dot::after{animation:none}
  .st.pop .dot{animation:pop .55s var(--spring)}
  @keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
  .st .lbl{font-size:15px;line-height:1.45;min-width:0;overflow-wrap:anywhere;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:default;display:block;width:100%}
  .st .lbl.has{cursor:pointer}
  .st .lbl .i{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line-2);font-size:11.5px;font-weight:700;color:var(--ink-3);margin-left:6px;vertical-align:1px;transition:background var(--t-fast),color var(--t-fast)}
  .st .lbl.has:hover .i,.st.open .lbl .i{background:var(--accent-soft);color:var(--accent-soft-ink);border-color:transparent}
  .st.pending .lbl{color:var(--ink-3)}
  .st.done .lbl{color:var(--ink-2)}
  .st.active .lbl{font-weight:650;color:var(--ink)}
  .st .tm{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
  .st.active .tm{color:var(--accent-text);font-weight:650}
  .st .desc{grid-column:2 / 4;font-size:14px;line-height:1.55;color:var(--ink-2);margin-top:5px;padding:9px 12px;border-radius:var(--r-1);background:var(--bg-2);border:1px solid var(--line);display:none;overflow-wrap:anywhere}
  .st.open .desc,.st.active .desc{display:block}
  .st.active .desc{background:var(--panel);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}

  /* shipped features + screens + story */
  .blk{padding:14px 20px 0}
  .blk-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
  .blk-h .n{font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:600;letter-spacing:0}
  .feats{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .feats li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;font-size:14.5px;line-height:1.45;color:var(--ink)}
  .feats li svg{width:16px;height:16px;color:var(--ok);margin-top:2px}
  .feats li .fd{grid-column:2;font-size:13.5px;color:var(--ink-3)}
  .feats li .up{font-size:12px;font-weight:700;color:var(--info-ink);background:var(--info-soft);padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:1px}
  .more{font:inherit;font-size:13.5px;font-weight:600;color:var(--accent-text);background:none;border:0;padding:4px 0;cursor:pointer}
  .strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .strip .shot img{height:96px}
  .compares{display:grid;gap:14px}
  .compares .cap{font-size:13.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px;display:flex;gap:8px;align-items:center}
  .tail{list-style:none;margin:0;padding:0}
  .tail .ev{padding:5px 0;grid-template-columns:22px minmax(0,1fr);gap:9px}
  .tail .ev+.ev::before{display:none}
  .tail .ev .ico{width:22px;height:22px} .tail .ev .ico svg{width:12px;height:12px}
  .tail .ev .txt{font-size:14px;color:var(--ink-2)}
  .tail .ev.phase .txt,.tail .ev.verdict .txt{font-weight:650;color:var(--ink)}
  .tail .ev .when{font-size:12.5px;color:var(--ink-3);margin-left:6px;white-space:nowrap}
  .sess .card-f{margin-top:18px}
  .sess .card-f .meta{margin-left:auto}

  /* pulse — every move, across every session */
  .pulse{position:sticky;top:calc(var(--topbar) + 16px)}
  .pulse .card-b{padding:6px 16px 12px;max-height:calc(100vh - var(--topbar) - 120px);overflow:auto}
  .pv{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;text-align:left;width:100%}
  .pv:first-child{border-top:0}
  .pv .txt{font-size:14px;line-height:1.45;color:var(--ink);overflow-wrap:anywhere}
  .pv .sub{font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;margin-top:2px}
  .pv:hover .txt{color:var(--accent-text)}
  .pv.fresh{animation:flash 1.4s var(--ease)}
  @keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}

  /* finished in the last day */
  .fin{display:grid;gap:8px}
  .finrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-2);background:var(--panel);color:inherit;transition:border-color var(--t-fast),transform var(--t)}
  .finrow:hover{text-decoration:none;border-color:var(--line-2);transform:translateY(-1px)}
  .finrow .t{font-weight:620;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .finrow .s{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}

  /* focus view */
  .back{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;margin-bottom:14px}
  .back svg{width:15px;height:15px}
  .focus-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start;margin-top:18px}
  @media (max-width:980px){.focus-grid{grid-template-columns:minmax(0,1fr)}}
  .focus .sess-title{font-size:26px}
  .focus .ring,.focus .ring svg{width:76px;height:76px}
  .focus .ring b{font-size:17px}
  .focus .tail .ev .txt{font-size:14.5px}
  .focus .tail .ev .det{font-size:13.5px;color:var(--ink-3);margin-top:2px;overflow-wrap:anywhere}
  .sevt{font-size:12px;font-weight:700;padding:1px 6px;border-radius:5px;margin-right:6px;vertical-align:1px}
  .sevt.critical{background:var(--sev-critical-soft);color:var(--sev-critical-ink)} .sevt.high{background:var(--sev-high-soft);color:var(--sev-high-ink)}
  .sevt.medium{background:var(--sev-medium-soft);color:var(--sev-medium-ink)} .sevt.low{background:var(--sev-low-soft);color:var(--sev-low-ink)} .sevt.info{background:var(--info-soft);color:var(--info-ink)}

  /* empty: the one prompt */
  .start{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;overflow:hidden}
  @media (max-width:820px){.start{grid-template-columns:minmax(0,1fr)}}
  .start .art{background:var(--bg-2);display:flex;align-items:center;justify-content:center;padding:20px;border-right:1px solid var(--line)}
  .start .art img{max-width:100%;height:auto;border-radius:var(--r-2)}
  .start .copy{padding:26px;display:grid;gap:14px;align-content:center}
  .start h2{font-size:21px;letter-spacing:-.015em}
  .prompt{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--panel);font-family:var(--mono);font-size:15px;font-weight:600}
  .prompt span{flex:1;min-width:0;overflow-wrap:anywhere}
  #err{margin-bottom:14px}
  @media (max-width:600px){
    .sess-top{grid-template-columns:minmax(0,1fr) auto;padding:16px 16px 0}
    .sess-top>.avatar{display:none}
    .sess-top .ring,.sess-top .ring svg{width:46px;height:46px} .sess-top .ring b{font-size:12.5px}
    .now-stats{gap:8px} .now-stats .stat{padding:12px 14px} .now-stats .stat .d{display:none} .now-stats .stat .n{font-size:22px}
    .doing,.waves{margin-left:16px;margin-right:16px} .plan,.blk{padding-left:16px;padding-right:16px}
    .waves{flex-wrap:wrap} .wave{flex:1 1 40%}
    .sess-title{font-size:18px}
  }
</style>
</head>
<body>
<div class="bl-app" id="app">
  <aside class="bl-side" id="side" aria-label="Sidebar"></aside>
  <div class="bl-main">
    <header class="bl-top" id="top"></header>
    <main class="bl-content" id="page">
      <div class="page-h" id="head">
        <div>
          <h1>Now</h1>
          <p class="lead">Everything in progress, across every project — each step with its note and its timer, the screens and the features shipped, live as the agents work.</p>
        </div>
        <div class="actions">
          <span class="poll"><span class="pip off" id="pollpip"></span><span id="pollstate">connecting…</span></span>
          <button class="btn sm" type="button" id="copyPrompt" title="Copy the one prompt that puts a session on this board"></button>
        </div>
      </div>
      <div id="err" hidden></div>
      <div id="root" aria-live="polite"></div>
    </main>
  </div>
</div>
<script>
(function(){
  var B = window.Bread, esc = B.esc, I = B.icon;
  var PROMPT = '/breadboard';
  var focusId = (location.pathname.match(/^\/now\/([^\/?#]+)/) || [])[1] || null;
  var root = document.getElementById('root');
  var skew = 0, data = null, prev = {}, pulseSeen = {}, firstLoad = true;
  var openSteps = {}, shutWaves = {}, openMore = {};

  B.mount({ active: 'now', title: 'Now', crumbs: focusId ? ['Now', 'Session'] : ['Now'] });
  if (focusId) document.querySelector('#head .lead').hidden = true;
  var cp = document.getElementById('copyPrompt');
  cp.innerHTML = I('copy') + 'Copy the one prompt';
  cp.onclick = function(){ B.copy(PROMPT, 'The one prompt'); };

  // ---------- small helpers ----------
  function now(){ return Date.now() + skew; }
  function dur(ms){ ms = Math.max(0, ms|0); var s = Math.floor(ms/1000); if (s < 60) return s + 's'; var m = Math.floor(s/60); if (m < 60) return m + 'm ' + ('0'+(s%60)).slice(-2) + 's'; var h = Math.floor(m/60); return h + 'h ' + ('0'+(m%60)).slice(-2) + 'm'; }
  function short(ms){ var m = Math.round(ms/60000); if (m < 1) return '<1 min'; if (m < 60) return m + ' min'; var h = Math.floor(m/60); return h + 'h ' + ('0'+(m%60)).slice(-2) + 'm'; }
  function clock(ts){ var d = new Date(ts); return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2); }
  function ring(pct){ var r = 26, c = 2*Math.PI*r; return '<div class="ring" role="img" aria-label="' + pct + '% done"><svg viewBox="0 0 64 64"><circle class="trk" cx="32" cy="32" r="' + r + '"/><circle class="val" cx="32" cy="32" r="' + r + '" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + (c*(1-pct/100)).toFixed(1) + '"/></svg><b>' + pct + '%</b></div>'; }
  function stateBadge(s){
    if (s.state === 'done') return '<span class="state done"><span class="pip"></span>Finished</span>';
    if (s.state === 'quiet') return '<span class="state quiet"><span class="pip"></span>Quiet ' + esc(short(now() - s.updated)) + '</span>';
    return '<span class="state working"><span class="pip live"></span>Working now</span>';
  }
  // waves in order of first appearance; steps with no wave share one unnamed wave
  function waves(s){
    var list = [], by = {};
    (s.tasks || []).forEach(function(t, i){ var k = t.wave || ''; if (!by[k]) { by[k] = { name: k, steps: [] }; list.push(by[k]); } by[k].steps.push({ t: t, i: i }); });
    list.forEach(function(w, n){ w.n = n; w.done = w.steps.filter(function(x){ return x.t.status === 'done'; }).length;
      w.on = w.steps.some(function(x){ return x.t.status === 'active'; }) || (w.done < w.steps.length && list.slice(0, n).every(function(p){ return p.done === p.steps.length; }));
      var starts = w.steps.map(function(x){ return x.t.startedAt; }).filter(Boolean), ends = w.steps.map(function(x){ return x.t.doneAt; }).filter(Boolean);
      w.started = starts.length ? Math.min.apply(null, starts) : null; w.ended = w.done === w.steps.length && ends.length ? Math.max.apply(null, ends) : null; });
    return list;
  }
  function stepTime(t){
    if (t.status === 'done' && t.startedAt && t.doneAt) return dur(t.doneAt - t.startedAt);
    if (t.status === 'active' && t.startedAt) return '<span data-since="' + t.startedAt + '">' + dur(now() - t.startedAt) + '</span>';
    return '';
  }
  // honest pace: the average of the finished steps that have real timings, times the steps left
  function eta(s){
    var d = (s.tasks || []).filter(function(t){ return t.status === 'done' && t.startedAt && t.doneAt; });
    var left = (s.tasks || []).filter(function(t){ return t.status !== 'done'; }).length;
    if (!d.length || !left || s.state === 'done') return '';
    var avg = d.reduce(function(a, t){ return a + (t.doneAt - t.startedAt); }, 0) / d.length;
    var m = avg * left; return (m < 60000 ? 'under a minute' : '~' + short(m)) + ' left at this pace';
  }
  var EVI = { phase: ['arrow', 'accent'], say: ['sparkles', ''], found: ['bug', 'warn'], fixed: ['check', 'ok'], clean: ['shieldcheck', 'ok'], metric: ['zap', 'info'], verdict: ['checkcircle', 'ok'], caveat: ['alert', 'warn'], note: ['info', ''] };
  function evIcon(e){ if (e.kind === 'note' && e.meta && e.meta.done) return ['check', 'ok']; if (e.kind === 'note' && e.meta && e.meta.added) return ['plus', 'accent']; return EVI[e.kind] || ['info', '']; }
  function evText(e){
    var t = String(e.title || '').replace(/^[✓＋]\s*/, '');
    if (e.kind === 'metric') t += ': ' + (e.before || '?') + ' → ' + (e.after || '?');
    return (e.kind === 'found' && e.severity ? '<span class="sevt ' + esc(e.severity) + '">' + esc(e.severity) + '</span>' : '') + esc(t);
  }
  function tail(list, full){
    return '<ul class="tail">' + list.map(function(e){ var ic = evIcon(e);
      var det = full ? [e.detail, e.impact && 'Impact: ' + e.impact, e.fix && 'Fix: ' + e.fix, e.file].filter(Boolean).map(esc).join(' · ') : '';
      return '<li class="ev ' + esc(e.kind) + '"><span class="ico ' + ic[1] + '">' + I(ic[0]) + '</span><div><div class="txt">' + evText(e) + '<span class="when">' + clock(e.ts) + '</span></div>' + (det ? '<div class="det">' + det + '</div>' : '') + '</div></li>'; }).join('') + '</ul>';
  }
  // before/after shots that share a label become sliders; the rest are thumbnails
  function shotsSplit(shots){
    var pairs = [], singles = [], by = {};
    shots.forEach(function(x){ var k = (x.label || '').toLowerCase(); if (x.stage && k) { by[k] = by[k] || {}; by[k][x.stage] = x; } });
    Object.keys(by).forEach(function(k){ if (by[k].before && by[k].after) pairs.push(by[k]); });
    var paired = {}; pairs.forEach(function(p){ paired[p.before.url] = paired[p.after.url] = 1; });
    shots.forEach(function(x){ if (!paired[x.url]) singles.push(x); });
    return { pairs: pairs, singles: singles };
  }
  function thumbs(list){
    return '<div class="strip">' + list.map(function(x){ return '<figure class="shot" data-shot="' + esc(x.url) + '" data-cap="' + esc(x.label || x.caption || '') + '"><img src="' + esc(x.url) + '" alt="' + esc(x.label || 'Screenshot') + '" loading="lazy"><figcaption>' + (x.stage ? '<span class="ba ' + esc(x.stage) + '">' + esc(x.stage) + '</span>' : '') + '<span class="truncate">' + esc(x.label || x.caption || 'Screen') + '</span></figcaption></figure>'; }).join('') + '</div>';
  }

  // ---------- one session ----------
  function sessionHTML(s, full){
    var ws = waves(s), total = (s.tasks || []).length, done = (s.tasks || []).filter(function(t){ return t.status === 'done'; }).length;
    var pct = total ? Math.round(done / total * 100) : (s.state === 'done' ? 100 : 0);
    var active = (s.tasks || []).filter(function(t){ return t.status === 'active'; })[0];
    var named = ws.some(function(w){ return w.name; });
    var h = '';
    h += '<div class="sess-top">' + B.avatar(s.app || s.project, 'lg') +
      '<div><div class="sess-who"><b>' + esc(s.app || s.project || 'Project') + '</b>' + (s.project && s.project !== s.app ? '<span>· ' + esc(s.project) + '</span>' : '') + '</div>' +
      '<h2 class="sess-title">' + (full ? esc(s.title) : '<a href="/now/' + encodeURIComponent(s.id) + '">' + esc(s.title) + '</a>') + '</h2>' +
      '<div class="sess-meta">' + stateBadge(s) + '<span>' + done + ' of ' + total + ' steps</span><span class="sep">·</span>' +
        (s.state === 'done' ? '<span>took ' + short(s.updated - s.started) + '</span>' : '<span><span data-since="' + s.started + '">' + dur(now() - s.started) + '</span> on the clock</span>') +
        (eta(s) ? '<span class="sep">·</span><span>' + esc(eta(s)) + '</span>' : '') +
        (s.progress ? '<span class="sep">·</span><span>' + B.fmtN(s.progress.done) + '/' + B.fmtN(s.progress.total) + ' ' + esc(s.progress.label || '') + '</span>' : '') +
        '<span class="sep">·</span><span>started ' + clock(s.started) + '</span></div></div>' + ring(pct) + '</div>';
    h += '<div class="doing"><span class="k">' + (s.state === 'done' ? 'Done' : 'Now') + '</span><span class="v">' + esc(s.current || (active && active.text) || 'Getting started') + '<span class="car"></span></span>' +
      (s.note ? '<span class="note2">' + esc(s.note) + '</span>' : '') + '</div>';
    if (named && ws.length > 1) h += '<div class="waves" role="list" aria-label="Waves">' + ws.map(function(w){ var p = Math.round(w.done / w.steps.length * 100);
      return '<button class="wave' + (w.on ? ' on' : '') + (p === 100 ? ' done' : '') + '" role="listitem" style="--n:' + w.steps.length + ';--p:' + p + '%" data-jump="' + esc(s.id) + '|' + w.n + '" title="' + esc(w.name || 'Steps') + ' — ' + w.done + ' of ' + w.steps.length + '"><span class="bar"><i></i></span><span class="wl"><b>' + esc(w.name || 'Steps') + '</b><span>' + w.done + '/' + w.steps.length + '</span></span></button>'; }).join('') + '</div>';
    h += '<div class="plan">' + ws.map(function(w){
      var key = s.id + '|' + w.n, complete = w.done === w.steps.length;
      var shut = key in shutWaves ? shutWaves[key] : (!full && complete && ws.length > 1);
      var wt = w.started ? (w.ended ? short(w.ended - w.started) : '<span data-since="' + w.started + '" data-short>' + short(now() - w.started) + '</span>') : '';
      return '<div class="wgroup' + (shut ? ' shut' : '') + '" id="w-' + esc(key) + '">' +
        (named ? '<button class="wgh' + (w.on ? ' on' : '') + '" type="button" data-wave="' + esc(key) + '" aria-expanded="' + !shut + '"><span class="t">' + esc(w.name || 'Steps') + '</span><span class="c">' + w.done + '/' + w.steps.length + (wt ? ' · ' + wt : '') + '</span><span class="chev">' + I('down') + '</span></button>' : '') +
        '<ol class="steps2">' + w.steps.map(function(x){ var t = x.t, sk = s.id + '|' + x.i, open = full || openSteps[sk];
          var popped = prev[s.id] && prev[s.id][x.i] && prev[s.id][x.i] !== 'done' && t.status === 'done';
          return '<li class="st ' + t.status + (open && t.desc ? ' open' : '') + (popped ? ' pop' : '') + '" data-i="' + x.i + '"><span class="dot">' + (t.status === 'done' ? I('check') : '') + '</span>' +
            (t.desc ? '<button class="lbl has" type="button" data-step="' + esc(sk) + '" aria-expanded="' + !!(open || t.status === 'active') + '">' + esc(t.text) + '<span class="i" aria-hidden="true">i</span></button>' : '<span class="lbl">' + esc(t.text) + '</span>') +
            '<span class="tm">' + stepTime(t) + '</span>' + (t.desc ? '<div class="desc">' + esc(t.desc) + '</div>' : '') + '</li>'; }).join('') + '</ol></div>'; }).join('') + '</div>';
    if (!full) {
      var feats = s.features || [], fk = s.id + '|f', fmax = openMore[fk] ? 99 : 4;
      if (feats.length) h += '<div class="blk"><div class="blk-h">Shipped in this session <span class="n">' + feats.length + '</span></div><ul class="feats">' + feats.slice(0, fmax).map(featLI).join('') + '</ul>' + (feats.length > fmax ? '<button class="more" type="button" data-more="' + esc(fk) + '">Show all ' + feats.length + '</button>' : '') + '</div>';
      if ((s.shots || []).length) h += '<div class="blk"><div class="blk-h">Screens <span class="n">' + s.shots.length + '</span></div>' + thumbs(s.shots.slice(-6)) + '</div>';
      if ((s.story || []).length) h += '<div class="blk"><div class="blk-h">Latest moves</div>' + tail(s.story.slice(0, 4), false) + '</div>';
      h += '<div class="card-f"><a class="btn sm" href="/now/' + encodeURIComponent(s.id) + '">' + I('eye') + 'Open</a><a class="btn sm ghost" href="/story/' + encodeURIComponent(s.id) + '">' + I('file') + 'Full story</a>' + (s.findings ? '<span class="badge warn">' + s.findings + ' finding' + (s.findings === 1 ? '' : 's') + '</span>' : '') + '<span class="meta">updated <span data-ago="' + s.updated + '">' + B.ago(s.updated - skew) + '</span></span></div>';
    }
    return h;
  }
  function featLI(f){ return '<li>' + I('checkcircle') + '<span>' + esc(f.title) + (f.status === 'applied' ? '<span class="up">upgraded</span>' : '') + '</span>' + (f.detail ? '<span class="fd">' + esc(f.detail) + '</span>' : '') + '</li>'; }

  // ---------- the board ----------
  function sig(s){ return JSON.stringify([s.updated, s.state, s.tasks, s.current, s.note, (s.story || []).length && s.story[0].id, (s.features || []).length, (s.shots || []).length, openMore[s.id + '|f']]); }
  var cardEls = {};
  function renderBoard(){
    var list = data.sessions, live = list.filter(function(s){ return s.state !== 'done'; }), fin = list.filter(function(s){ return s.state === 'done'; });
    document.title = (live.length ? '(' + live.length + ') ' : '') + 'Now · Breadledger';
    if (!live.length && !fin.length) { cardEls = {}; root.innerHTML = startHTML(); wireStart(); return; }
    if (!root.querySelector('#sessions')) {
      root.innerHTML = '<section class="stats now-stats" id="stats" aria-label="Summary"></section><div class="now-grid"><div><div class="section-h" id="liveH"><h2>In progress</h2><span class="meta" id="liveMeta"></span></div><div id="sessions"></div><div id="emptyLive" hidden></div><section id="finWrap" hidden><div class="section-h"><h2>Finished in the last day</h2><span class="meta" id="finMeta"></span></div><div class="fin" id="fin"></div></section></div><aside class="card pulse" aria-label="Every move, across every session"><div class="card-h">' + I('activity') + 'Pulse<span class="meta">every move, newest first</span></div><div class="card-b" id="pulse"></div></aside></div>';
      cardEls = {};
    }
    // summary
    var steps = 0, stepsDone = 0, clockMs = 0, feats = 0, shots = 0, projects = {};
    list.forEach(function(s){ (s.tasks || []).forEach(function(t){ steps++; if (t.status === 'done') stepsDone++; }); feats += (s.features || []).length; shots += (s.shots || []).length; projects[(s.app || s.project || '').toLowerCase()] = 1; });
    live.forEach(function(s){ clockMs += now() - s.started; });
    var working = live.filter(function(s){ return s.state === 'working'; }).length;
    document.getElementById('stats').innerHTML = [
      ['Working now', working + (live.length > working ? '<small>+' + (live.length - working) + ' quiet</small>' : ''), 'sessions'],
      ['Projects', Object.keys(projects).length, 'today'],
      ['Steps done', stepsDone + '<small>/ ' + steps + '</small>', 'across every session'],
      ['On the clock', '<span data-clock>' + short(clockMs) + '</span>', 'summed, in progress'],
      ['Features shipped', feats, 'named in full'],
      ['Screens', shots, 'before / after']
    ].map(function(x){ return '<div class="stat plain"><span class="l">' + x[0] + '</span><span class="n">' + x[1] + '</span><span class="d">' + x[2] + '</span></div>'; }).join('');
    document.getElementById('liveMeta').textContent = live.length ? live.length + ' session' + (live.length === 1 ? '' : 's') : '';
    // cards: keyed, re-rendered only when their data changed (keeps open notes, scroll and sliders steady)
    var host = document.getElementById('sessions'), keep = {};
    live.forEach(function(s, n){
      keep[s.id] = 1; var c = cardEls[s.id], sg = sig(s);
      if (!c) { c = { el: document.createElement('section') }; c.el.className = 'card sess' + (firstLoad ? '' : ' enter'); c.el.id = 's-' + s.id; cardEls[s.id] = c; }
      if (c.sig !== sg) { c.el.className = 'card sess ' + s.state + (c.el.classList.contains('enter') ? ' enter' : ''); c.el.style.setProperty('--h', B.hue(s.app || s.project)); c.el.innerHTML = sessionHTML(s, false); c.sig = sg; }
      if (host.children[n] !== c.el) host.insertBefore(c.el, host.children[n] || null);
      prev[s.id] = (s.tasks || []).map(function(t){ return t.status; });
    });
    Object.keys(cardEls).forEach(function(id){ if (!keep[id]) { cardEls[id].el.remove(); delete cardEls[id]; } });
    var el = document.getElementById('emptyLive'); el.hidden = !!live.length;
    if (!live.length) el.innerHTML = '<div class="card pad"><div class="row">' + I('checkcircle') + '<span class="grow">Nothing is running right now. Say <code>' + PROMPT + '</code> to a coding agent and its work appears here.</span></div></div>';
    // finished
    var fw = document.getElementById('finWrap'); fw.hidden = !fin.length;
    document.getElementById('finMeta').textContent = fin.length ? fin.length + ' session' + (fin.length === 1 ? '' : 's') : '';
    document.getElementById('fin').innerHTML = fin.map(function(s){ var done = (s.tasks || []).filter(function(t){ return t.status === 'done'; }).length;
      return '<a class="finrow" href="/now/' + encodeURIComponent(s.id) + '">' + B.avatar(s.app || s.project) + '<div style="min-width:0"><div class="t">' + esc(s.title) + '</div><div class="s">' + esc(s.app || s.project) + ' · ' + done + ' steps · took ' + short(s.updated - s.started) + ((s.features || []).length ? ' · ' + s.features.length + ' features' : '') + ((s.shots || []).length ? ' · ' + s.shots.length + ' screens' : '') + '</div></div><span class="s">' + clock(s.updated) + '</span></a>'; }).join('');
    renderPulse(list);
    firstLoad = false;
  }
  function renderPulse(list){
    var all = [];
    list.forEach(function(s){ (s.story || []).forEach(function(e){ all.push({ e: e, s: s }); }); (s.features || []).forEach(function(f){ all.push({ e: { id: 'f' + f.ts + f.title, ts: f.ts, kind: 'feature', title: f.title }, s: s }); }); });
    all.sort(function(a, b){ return b.e.ts - a.e.ts; });
    var p = document.getElementById('pulse');
    p.innerHTML = all.length ? all.slice(0, 40).map(function(x){ var e = x.e, fresh = !firstLoad && !pulseSeen[e.id]; pulseSeen[e.id] = 1;
      var ic = e.kind === 'feature' ? ['checkcircle', 'ok'] : evIcon(e);
      return '<button class="pv' + (fresh ? ' fresh' : '') + '" type="button" data-go="' + esc(x.s.id) + '">' + B.avatar(x.s.app || x.s.project, 'xs') + '<span><span class="txt">' + (e.kind === 'feature' ? 'Shipped: ' : '') + evText(e) + '</span><span class="sub"><span class="truncate">' + esc(x.s.app || x.s.project) + '</span><span>·</span><span data-ago="' + e.ts + '">' + B.ago(e.ts - skew) + '</span></span></span></button>'; }).join('')
      : '<p class="meta" style="padding:12px 0">Moves appear here as the agents work.</p>';
    if (firstLoad) all.forEach(function(x){ pulseSeen[x.e.id] = 1; });
  }

  // ---------- focus: one session, everything ----------
  var focusSig = '';
  function renderFocus(){
    var s = data.sessions[0]; if (!s) return;
    var sg = sig(s) + JSON.stringify(s.story.length);
    document.title = s.title + ' · Now · Breadledger';
    if (sg === focusSig) return; focusSig = sg;
    var sp = shotsSplit(s.shots || []);
    var right = '';
    if (sp.pairs.length) right += '<section class="card"><div class="card-h">' + I('image') + 'Before → after<span class="meta">drag to compare</span></div><div class="card-b compares">' + sp.pairs.map(function(p){ return '<div><div class="cap">' + esc(p.after.label) + '</div>' + B.compare(p.before.url, p.after.url) + '</div>'; }).join('') + '</div></section>';
    if (sp.singles.length) right += '<section class="card"><div class="card-h">' + I('image') + 'Screens<span class="meta">' + sp.singles.length + '</span></div><div class="card-b">' + thumbs(sp.singles) + '</div></section>';
    if ((s.features || []).length) right += '<section class="card"><div class="card-h">' + I('checkcircle') + 'Shipped in this session<span class="meta">' + s.features.length + '</span></div><div class="card-b"><ul class="feats">' + s.features.map(featLI).join('') + '</ul></div></section>';
    right += '<section class="card"><div class="card-h">' + I('activity') + 'Every move<span class="meta">' + s.story.length + '</span></div><div class="card-b">' + (s.story.length ? tail(s.story, true) : '<p class="meta">The story starts with the first step.</p>') + '</div><div class="card-f"><a class="btn sm" href="/story/' + encodeURIComponent(s.id) + '">' + I('file') + 'Open the full story</a></div></section>';
    root.innerHTML = '<a class="back" href="/now">' + I('left') + 'Everything in progress</a>' +
      '<section class="card sess focus ' + s.state + '" style="--h:' + B.hue(s.app || s.project) + '">' + sessionHTML(s, true).split('<div class="plan">')[0] + '<div style="height:20px"></div></section>' +
      '<div class="focus-grid"><section class="card sess ' + s.state + '" style="--h:' + B.hue(s.app || s.project) + '"><div class="card-h">' + I('check') + 'Every step<span class="meta">tap a step for its note</span></div><div class="plan">' + sessionHTML(s, true).split('<div class="plan">')[1] + '<div style="height:14px"></div></section><div class="stack">' + right + '</div></div>';
    prev[s.id] = (s.tasks || []).map(function(t){ return t.status; });
  }

  // ---------- empty: the one prompt ----------
  function startHTML(){
    return '<section class="card start"><div class="art"><img src="/art/empty-desk.png" alt="" width="520" height="300" loading="lazy" data-framed></div><div class="copy">' +
      '<span class="badge accent" style="justify-self:start">' + I('zap') + 'One prompt</span><h2>Nothing is running yet.</h2>' +
      '<p class="ink2">Say this to any coding agent on any project. It plans the work in waves, puts every step here with a note on what it does and why, ticks them off as it goes, adds the screens it checks and names every feature it ships — then closes with a report.</p>' +
      '<div class="prompt"><span>' + PROMPT + '</span><button class="btn sm" type="button" id="copy2">' + I('copy') + 'Copy</button></div>' +
      '<p class="meta">Or in plain words: “show my work on Breadledger”. Several agents at once each get their own card on this board.</p></div></section>';
  }
  function wireStart(){ var b = document.getElementById('copy2'); if (b) b.onclick = function(){ B.copy(PROMPT, 'The one prompt'); }; }

  // ---------- events ----------
  root.addEventListener('click', function(ev){
    var t = ev.target.closest('[data-step],[data-wave],[data-jump],[data-more],[data-go],[data-shot]'); if (!t) return;
    if (t.dataset.step) { var k = t.dataset.step, li = t.closest('.st'); if (li.classList.contains('active') || focusId) return; openSteps[k] = !openSteps[k]; li.classList.toggle('open', openSteps[k]); t.setAttribute('aria-expanded', openSteps[k]); var c = cardEls[k.split('|')[0]]; if (c) c.sig = ''; return; }
    if (t.dataset.wave) { var g = t.closest('.wgroup'), shut = !g.classList.contains('shut'); shutWaves[t.dataset.wave] = shut; g.classList.toggle('shut', shut); t.setAttribute('aria-expanded', !shut); var c2 = cardEls[t.dataset.wave.split('|')[0]]; if (c2) c2.sig = ''; return; }
    if (t.dataset.jump) { var w = document.getElementById('w-' + t.dataset.jump); if (w) { shutWaves[t.dataset.jump] = false; w.classList.remove('shut'); w.scrollIntoView({ behavior: B.reduceMotion() ? 'auto' : 'smooth', block: 'center' }); } return; }
    if (t.dataset.more) { openMore[t.dataset.more] = 1; render(); return; }
    if (t.dataset.go) { var el = document.getElementById('s-' + t.dataset.go); if (el) { el.scrollIntoView({ behavior: B.reduceMotion() ? 'auto' : 'smooth', block: 'start' }); } else location.href = '/now/' + encodeURIComponent(t.dataset.go); return; }
    if (t.dataset.shot) { var figs = Array.prototype.slice.call(t.closest('.strip').querySelectorAll('[data-shot]'));
      B.lightbox.open(figs.map(function(f){ return f.dataset.shot; }), figs.map(function(f){ return f.dataset.cap; }), figs.indexOf(t)); }
  });

  // ---------- live ----------
  function render(){ if (!data) return; if (focusId) renderFocus(); else renderBoard(); }
  function setPoll(st){ document.getElementById('pollpip').className = 'pip ' + (st === 'live' ? 'live' : 'off'); document.getElementById('pollstate').textContent = st === 'live' ? 'live' : st === 'retry' ? 'reconnecting…' : 'connecting…'; }
  function showErr(msg){ var el = document.getElementById('err'); if (!msg) { el.hidden = true; return; } el.hidden = false; el.innerHTML = '<div class="note danger" role="alert">' + I('alert') + '<span class="grow">' + esc(msg) + '</span></div>'; }
  var busy = false;
  function poll(){
    if (busy) return; busy = true;
    fetch('/api/now' + (focusId ? '?id=' + encodeURIComponent(focusId) : ''), { cache: 'no-store' }).then(function(r){ return r.json().then(function(j){ return { r: r, j: j }; }); }).then(function(x){
      busy = false;
      if (!x.j.ok) { if (x.r.status === 404 && focusId) { root.innerHTML = B.empty('No such session', 'It may have been started on another board. <a href="/now">See everything in progress</a>.', 'inbox'); setPoll('live'); return; } throw new Error(x.j.error || 'error'); }
      skew = x.j.now - Date.now(); data = x.j; setPoll('live'); showErr(''); render();
    }).catch(function(){ busy = false; setPoll('retry'); showErr('The board lost its connection — it keeps trying every few seconds.'); });
  }
  function tick(){
    document.querySelectorAll('[data-since]').forEach(function(el){ var ms = now() - +el.dataset.since; el.textContent = el.hasAttribute('data-short') ? short(ms) : dur(ms); });
    document.querySelectorAll('[data-ago]').forEach(function(el){ el.textContent = B.ago(+el.dataset.ago - skew); });
    if (data && !focusId) { var c = document.querySelector('[data-clock]'); if (c) c.textContent = short(data.sessions.filter(function(s){ return s.state !== 'done'; }).reduce(function(a, s){ return a + now() - s.started; }, 0)); }
  }
  poll(); setInterval(function(){ if (!document.hidden) poll(); }, 2500); setInterval(tick, 1000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) poll(); });
})();
</script>
</body>
