<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now · Breadledger</title>
<meta name="description" content="Everything in progress right now, across every project — each step, its note, its timer, the screens and the features shipped, live.">
<meta property="og:type" content="website">
<meta property="og:title" content="Breadledger · Now">
<meta property="og:description" content="Everything in progress right now, across every project — live.">
<meta property="og:image" content="https://breadledger.coconvo.workers.dev/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/bread.css">
<script src="/bread-shell.js"></script>
<style>
  /* Now board — page styles on bread.css tokens only */
  .poll{display:inline-flex;align-items:center;gap:8px;height:34px;font-size:13.5px;color:var(--ink-3);white-space:nowrap}
  .now-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
  @media (max-width:1080px){.now-grid{grid-template-columns:minmax(0,1fr)}}
  #sessions,#waiting{display:grid;gap:18px}
  /* tandem: several boards side by side, Pulse underneath (the Aprizely live grid) */
  .now-grid.tandem{grid-template-columns:minmax(0,1fr)}
  #sessions.tandem,#waiting.tandem{grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr));align-items:start}
  .tandem-pick{margin-left:auto} .tandem-pick[hidden]{display:none}

  .state{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px 0 8px;border-radius:99px;font-size:12.5px;font-weight:650;letter-spacing:.01em;white-space:nowrap}
  .state.working{background:var(--ok-soft);color:var(--ok-ink)}
  .state.quiet{background:var(--warn-soft);color:var(--warn-ink)}
  .state.done{background:var(--bg-2);color:var(--ink-2);border:1px solid var(--line)}
  .state .pip{width:7px;height:7px;box-shadow:none} .state.quiet .pip{background:var(--warn)} .state.done .pip{background:var(--ok)}

  /* shipped features + screens + story */
  .blk{padding:14px 20px 0}
  .blk-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
  .blk-h .n{font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:600;letter-spacing:0}
  .feats{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .feats li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;font-size:14.5px;line-height:1.45;color:var(--ink)}
  .feats li svg{width:16px;height:16px;color:var(--ok);margin-top:2px}
  .feats li .fd{grid-column:2;font-size:13.5px;color:var(--ink-3)}
  .feats li .up{font-size:12px;font-weight:700;color:var(--info-ink);background:var(--info-soft);padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:1px}
  .more{font:inherit;font-size:13.5px;font-weight:600;color:var(--accent-text);background:none;border:0;padding:4px 0;cursor:pointer}
  .strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .strip .shot img{height:96px}
  .compares{display:grid;gap:14px}
  .compares .cap{font-size:13.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px;display:flex;gap:8px;align-items:center}
  .tail{list-style:none;margin:0;padding:0}
  .tail .ev{padding:5px 0;grid-template-columns:22px minmax(0,1fr);gap:9px}
  .tail .ev+.ev::before{display:none}
  .tail .ev .ico{width:22px;height:22px} .tail .ev .ico svg{width:12px;height:12px}
  .tail .ev .txt{font-size:14px;color:var(--ink-2)}
  .tail .ev.phase .txt,.tail .ev.verdict .txt{font-weight:650;color:var(--ink)}
  .tail .ev .when{font-size:12.5px;color:var(--ink-3);margin-left:6px;white-space:nowrap}

  /* pulse — every move, across every session */
  .pulse{position:sticky;top:calc(var(--topbar) + 16px)}
  .pulse .card-b{padding:6px 16px 12px;max-height:calc(100vh - var(--topbar) - 120px);overflow:auto}
  .pv{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;text-align:left;width:100%}
  .pv:first-child{border-top:0}
  .pv .txt{font-size:14px;line-height:1.45;color:var(--ink);overflow-wrap:anywhere}
  .pv .sub{font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;margin-top:2px}
  .pv:hover .txt{color:var(--accent-text)}
  .pv.fresh{animation:flash 1.4s var(--ease)}
  @keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}

  /* finished in the last day */
  .fin{display:grid;gap:8px}
  .finrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-2);background:var(--panel);color:inherit;transition:border-color var(--t-fast),transform var(--t)}
  .finrow:hover{text-decoration:none;border-color:var(--line-2);transform:translateY(-1px)}
  .finrow .t{font-weight:620;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .finrow .s{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}

  /* focus view */
  .back{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;margin-bottom:14px}
  .back svg{width:15px;height:15px}
  .sevt{font-size:12.5px;font-weight:700;padding:1px 6px;border-radius:5px;margin-right:6px;vertical-align:1px}
  .sevt.critical{background:var(--sev-critical-soft);color:var(--sev-critical-ink)} .sevt.high{background:var(--sev-high-soft);color:var(--sev-high-ink)}
  .sevt.medium{background:var(--sev-medium-soft);color:var(--sev-medium-ink)} .sevt.low{background:var(--sev-low-soft);color:var(--sev-low-ink)} .sevt.info{background:var(--info-soft);color:var(--info-ink)}

  /* follow along: every action the agent takes, under the step it belongs to */
  .follow{margin:12px 20px 0;border:1px solid var(--line);border-radius:var(--r-2);background:var(--panel-2)}
  .follow-h{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
  .follow-h .in{text-transform:none;letter-spacing:0;font-weight:550;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .follow-h .n{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:550;white-space:nowrap}
  .acts{list-style:none;margin:0;padding:4px 12px 8px}
  .acts li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:9px;align-items:center;padding:5px 0;font-size:14px;color:var(--ink-2)}
  .acts li:first-child{color:var(--ink);font-weight:600}
  .acts li.new{animation:slidein .45s var(--ease)}
  @keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .acts li .ai{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--bg-2);color:var(--ink-2)}
  .acts li .ai svg{width:13px;height:13px}
  .acts li .ai.edit{background:var(--accent-soft);color:var(--accent-soft-ink)} .acts li .ai.run,.acts li .ai.test{background:var(--warn-soft);color:var(--warn-ink)}
  .acts li .ai.browser,.acts li .ai.eye{background:var(--info-soft);color:var(--info-ink)} .acts li .ai.ship{background:var(--ok-soft);color:var(--ok-ink)}
  .acts li.bad .ai{background:var(--danger-soft);color:var(--danger-ink)}
  .acts li .tx{overflow-wrap:anywhere;line-height:1.4}
  .acts li .tx em{font-style:normal;color:var(--ink-3);font-weight:500}
  .acts li .w{font-size:12.5px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
  .acts.empty-acts{padding:10px 12px;font-size:13.5px;color:var(--ink-3)}
  .st .ac{font-size:12.5px;color:var(--ink-3);font-weight:500;margin-right:8px}
  .st .sacts{grid-column:2 / 4;margin-top:6px;border:1px solid var(--line);border-radius:var(--r-1);background:var(--panel-2);display:none}
  .st.open .sacts{display:block}
  .st .sacts .acts{padding:2px 10px 6px}
  .st .sacts .acts li:first-child{color:var(--ink-2);font-weight:500}
  .stepno{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-right:6px;font-variant-numeric:tabular-nums}

  /* how to read this board */
  .guide{margin:-8px 0 18px}
  .guide summary{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--accent-text);cursor:pointer;list-style:none}
  .guide summary::-webkit-details-marker{display:none}
  .guide summary svg{width:15px;height:15px}
  .guide .gb{margin-top:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
  .guide .gi{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:12px;border:1px solid var(--line);border-radius:var(--r-2);background:var(--panel);font-size:14px;color:var(--ink-2);line-height:1.5}
  .guide .gi b{color:var(--ink);font-weight:650;display:block}
  .guide .gx{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--bg-2)}
  .guide .gx svg{width:15px;height:15px}
  .pulse .seg{margin-left:auto}

  /* empty: the one prompt */
  .start{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;overflow:hidden}
  @media (max-width:820px){.start{grid-template-columns:minmax(0,1fr)}}
  .start .art{background:var(--bg-2);display:flex;align-items:center;justify-content:center;padding:20px;border-right:1px solid var(--line)}
  .start .art img{max-width:100%;height:auto;border-radius:var(--r-2)}
  .start .copy{padding:26px;display:grid;gap:14px;align-content:center}
  .start h2{font-size:21px;letter-spacing:-.015em}
  .prompt{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--panel);font-family:var(--mono);font-size:15px;font-weight:600}
  .prompt span{flex:1;min-width:0;overflow-wrap:anywhere}
  #err{margin-bottom:14px}
  /* chats — every Claude chat on this Mac, on the owner's key only */
  .state.waiting{background:var(--info-soft);color:var(--info-ink)} .state.waiting .pip{background:var(--info);box-shadow:none}
  .state.needs{background:var(--danger-soft);color:var(--danger-ink)} .state.needs .pip{background:var(--danger);box-shadow:none}
  .state.ended{background:var(--bg-2);color:var(--ink-3);border:1px solid var(--line)} .state.ended .pip{background:var(--line-2);box-shadow:none}
  .chipk{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:99px;background:var(--bg-2);border:1px solid var(--line);font-size:12.5px;font-weight:650;color:var(--ink-2)}
  .chipk svg{width:13px;height:13px}
  .helpers{display:flex;flex-wrap:wrap;gap:8px;margin:12px 20px 0;align-items:center}
  .helpers .hl{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-right:2px}
  .helper{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:4px 11px 4px 9px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:13.5px;color:var(--ink-2);max-width:100%;min-width:0}
  .helper span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .helper.run{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--ink);font-weight:550}
  .helper .pip{flex:0 0 auto} .helper svg{width:14px;height:14px;color:var(--ok);flex:0 0 auto}
  .earlier{display:flex;align-items:center;gap:8px;width:100%;margin-top:6px;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;font-size:13.5px;color:var(--ink-3);cursor:pointer;text-align:left}
  .earlier b{color:var(--ink-2);font-weight:650} .earlier svg{width:15px;height:15px;color:var(--ok);flex:0 0 auto}
  .earlier:hover b{color:var(--accent-text)}
  @media (max-width:820px){.lane .who .lpc{display:inline;flex:0 0 auto;white-space:pre} .lane .state .bt{display:none}}
  .pv .txt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .keybar b{display:block;font-size:15px;color:var(--ink)} .keybar p{margin:2px 0 0;font-size:14px;color:var(--ink-2);line-height:1.5}
  .keybar form{display:flex;gap:8px;flex-wrap:wrap;align-items:center} .keybar .input{width:220px;max-width:100%}
  .keybar .keyacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .keybar form{grid-column:1/-1;justify-content:flex-end} .keybar form[hidden]{display:none}
  .keybar .bad{grid-column:1 / -1;font-size:13.5px;color:var(--danger-ink)}
  .group-gap{margin-top:26px}

  /* wave groups inside a steps ledger */
  .wgroup{border-top:1px solid var(--line);margin-top:12px;padding-top:4px}
  .wgroup:first-child{border-top:0;margin-top:6px}
  .wgh{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:8px 0;font:inherit;color:var(--ink-3);cursor:pointer;text-align:left}
  .wgh .t{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
  .wgh.on .t{color:var(--accent-text)}
  .wgh .c{font-size:12.5px;font-variant-numeric:tabular-nums}
  .wgh .chev{margin-left:auto;transition:transform var(--t)}
  .wgh .chev svg{width:15px;height:15px}
  .wgroup.shut .chev{transform:rotate(-90deg)}
  .wgroup.shut .steps2{display:none}
  @keyframes blink{50%{opacity:0}}

  /* ---- one session: an editorial spec sheet, hairlines not boxes (study: Awwwards Sites of the Day, Oct–Nov 2026) ---- */
  .fx{display:grid;gap:0;max-width:1120px}
  .fx-l{font-family:var(--mono);font-size:12.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);line-height:1.4}
  .fx-eye{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
  .fx-eye .an{font-size:15px;font-weight:600;color:var(--ink)}
  .fx-eye .pj{font-family:var(--mono);font-size:13px;color:var(--ink-3)}
  .fx-eye .state{margin-left:auto;gap:9px;padding-left:10px}
  .fx-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 40px;align-items:end;margin-top:30px}
  .fx-title{font-size:clamp(34px,4.5vw,60px);font-weight:500;letter-spacing:-.036em;line-height:1.05;text-wrap:balance;overflow-wrap:anywhere;margin:0}
  .fx-pct{font-size:clamp(60px,7.4vw,104px);font-weight:400;letter-spacing:-.05em;line-height:.9;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;justify-self:end;white-space:nowrap}
  .fx-pct small{font-size:.36em;font-weight:500;letter-spacing:-.02em;color:var(--ink-3);margin-left:.1em;align-self:flex-start;margin-top:.14em}
  .odo{display:inline-flex;justify-content:center;align-items:flex-start;height:1em;line-height:1;clip-path:inset(0 -.1em);width:.585em}
  .odo>span{display:block;text-align:center;transition:transform 1.1s var(--ease)}
  .odo>span>b{display:block;height:1em;font-weight:inherit}
  /* one mark per step, gathered by wave: the whole job at a glance */
  .fx-rail{display:flex;gap:10px;margin-top:30px}
  .fx-wv{flex:var(--n) 1 0;min-width:0;display:grid;gap:8px;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
  div.fx-wv{cursor:default}
  .fx-ticks{display:flex;gap:3px;height:12px}
  .fx-ticks i{flex:1 1 0;min-width:0;background:var(--line-2);transition:background .5s var(--ease)}
  .fx-ticks i.done{background:var(--ink)}
  .fx.done .fx-ticks i.done{background:var(--ok)}
  .fx-ticks i.active{background:var(--accent);animation:breathe2 1.6s ease-in-out infinite}
  .fx:not(.working) .fx-ticks i.active{animation:none}
  @keyframes breathe2{50%{opacity:.45}}
  .fx-wv .fx-l{display:flex;gap:8px;min-width:0}
  .fx-wv .fx-l b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .fx-wv .fx-l span{margin-left:auto;white-space:nowrap}
  .fx-wv.on .fx-l{color:var(--ink)}
  /* the facts, as a spec sheet */
  .fx-spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:30px 0 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
  .fx-spec>div{padding:14px 18px 16px 0;display:grid;gap:7px;align-content:start;min-width:0}
  .fx-spec>div+div{padding-left:18px;border-left:1px solid var(--line)}
  .fx-spec dt{margin:0} .fx-spec dd{margin:0;font-size:21px;font-weight:500;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .fx-spec dd small{font-size:14px;font-weight:500;letter-spacing:0;color:var(--ink-3);margin-left:3px}
  /* what it is doing, what you asked, what it said */
  .fx-say{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 20px;padding:18px 0;border-bottom:1px solid var(--line);align-items:baseline}
  .fx-say .v{font-size:20px;font-weight:500;letter-spacing:-.012em;line-height:1.35;overflow-wrap:anywhere}
  .fx-say.sm .v{font-size:15.5px;font-weight:400;letter-spacing:0;line-height:1.55;color:var(--ink-2)}
  .fx-say .note2{grid-column:2;font-size:14.5px;color:var(--ink-2);line-height:1.55}
  .fx-say .car{display:inline-block;width:8px;height:.95em;vertical-align:-2px;margin-left:5px;background:var(--accent);animation:blink 1.1s step-end infinite}
  .fx:not(.working) .fx-say .car{display:none}
  .fx.done .fx-say.now .fx-l{color:var(--ok-ink)} .fx.needs .fx-say.now .fx-l{color:var(--danger-ink)} .fx.waiting .fx-say.now .fx-l{color:var(--info-ink)}
  .fx-say .clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .fx-say.open .clamp{display:block}
  .fx-say .more{grid-column:2;justify-self:start}
  .fx-say .helpers{grid-column:2;margin:0}
  /* two columns of ruled sections */
  .fx-cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0 56px;align-items:start;margin-top:44px}
  .fx-sec+.fx-sec{margin-top:44px}
  .fx-h{display:flex;align-items:baseline;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--ink)}
  .fx-h h2{font-size:21px;font-weight:500;letter-spacing:-.02em;line-height:1.2}
  .fx-h .fx-l{margin-left:auto;text-align:right}
  .fx-h .more{margin-left:auto;padding:0;min-height:24px;white-space:nowrap} .fx-h .more+.fx-l{margin-left:0}
  .fx-cap{font-size:14px;line-height:1.5;color:var(--ink-3);padding:12px 0 2px}
  /* steps: a ledger, with where the time went */
  .fx .wgroup{border-top:0;margin:0;padding:0}
  .fx .wgh{padding:18px 0 8px;border-bottom:1px solid var(--line)}
  .fx .wgh .t,.fx .wgh .c{font-family:var(--mono);font-weight:500;letter-spacing:.06em;color:var(--ink-3);font-size:12.5px}
  .fx .wgh .c{letter-spacing:0} .fx .wgh.on .t{color:var(--ink)} .fx .wgh .t{text-transform:uppercase}
  .fx-steps{list-style:none;margin:0;padding:0}
  .fxs{border-bottom:1px solid var(--line)}
  .fxs-row{display:grid;grid-template-columns:18px 24px minmax(0,1fr) minmax(70px,120px) 62px 16px;gap:10px;align-items:center;width:100%;min-height:46px;padding:9px 0;background:none;border:0;font:inherit;color:inherit;text-align:left}
  button.fxs-row{cursor:pointer}
  button.fxs-row:hover .nm{color:var(--accent-text)}
  .fxs .mk{width:18px;height:18px;display:flex;align-items:center;justify-content:center}
  .fxs .mk svg{width:15px;height:15px}
  .fxs.done .mk{color:var(--ok)}
  .fxs.pending .mk::after{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid var(--line-2)}
  .fxs .no{font-family:var(--mono);font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .fxs .nm{font-size:15.5px;line-height:1.4;font-weight:450;overflow-wrap:anywhere;transition:color var(--t-fast)}
  .fxs.pending .nm{color:var(--ink-3)} .fxs.active .nm{font-weight:600}
  .fxs .gantt{position:relative;height:6px;background:var(--bg-2)}
  .fxs .gantt i{position:absolute;top:0;bottom:0;min-width:2px;background:var(--ink-3)}

<body>
<div class="bl-app" id="app">
  <aside class="bl-side" id="side" aria-label="Sidebar"></aside>
  <div class="bl-main">
    <header class="bl-top" id="top"></header>
    <main class="bl-content" id="page">
      <div class="page-h" id="head">
        <div>
          <h1>Now</h1>
          <p class="lead">Every chat you have open and every board in progress — what you asked, what it is doing this second, each step with its tick and timer, and how far through it is, live.</p>
        </div>
        <div class="actions">
          <span class="poll"><span class="pip off" id="pollpip"></span><span id="pollstate">connecting…</span></span>
          <button class="btn sm" type="button" id="copyPrompt" title="Copy the one prompt that puts a session on this board"></button>
        </div>
      </div>
      <details class="guide" id="guide"><summary></summary><div class="gb" id="guideBody"></div></details>
      <div id="err" hidden></div>
      <div id="keybar" hidden></div>
      <div id="root" aria-live="polite"></div>
    </main>
  </div>
</div>
<script>

  function dur(ms){ ms = Math.max(0, ms|0); var s = Math.floor(ms/1000); if (s < 60) return s + 's'; var m = Math.floor(s/60); if (m < 60) return m + 'm ' + ('0'+(s%60)).slice(-2) + 's'; var h = Math.floor(m/60); return h + 'h ' + ('0'+(m%60)).slice(-2) + 'm'; }

    if (t.status === 'done' && t.startedAt && t.doneAt) return dur(t.doneAt - t.startedAt);
    if (t.status === 'active' && t.startedAt) return '<span data-since="' + t.startedAt + '">' + dur(now() - t.startedAt) + '</span>';

  }

  function spec(k, v){ return '<div><dt class="fx-l">' + k + '</dt><dd>' + v + '</dd></div>'; }
  function fxHero(s, board){
    var ws = waves(s), tasks = s.tasks || [], total = tasks.length, done = tasks.filter(function(t){ return t.status === 'done'; }).length;
    var pct = total ? Math.round(done / total * 100) : (s.state === 'done' ? 100 : 0), active = tasks.filter(function(t){ return t.status === 'active'; })[0];
    var chat = s.kind === 'chat' ? (s.chat || {}) : null, ch = chat || {}, named = ws.some(function(w){ return w.name; });
    var h = '<div class="fx-eye">' + B.avatar(s.app || s.project, 'sm') + '<span class="an">' + esc(s.app || s.project || 'Project') + '</span>' +
      (chat ? '<span class="chipk">' + aIco('chat') + 'Chat</span>' : (s.project && s.project !== s.app ? '<span class="pj">' + esc(s.project) + '</span>' : '')) + stateBadge(s) + '</div>';
    h += '<div class="fx-hero">' + (board ? '<h3 class="fx-title"><a href="/now/' + encodeURIComponent(s.id) + '">' + esc(s.title) + '</a></h3>' : '<h1 class="fx-title">' + esc(s.title) + '</h1>') + (chat && !total ? '' : '<div class="fx-pct" role="img" aria-label="' + pct + '% done">' + odo(pct, board ? Math.min(pctSeen[s.id] || 0, pct) : Math.min(fxPct, pct)) + '<small>%</small></div>') + '</div>';
    if (board) pctSeen[s.id] = pct;
    if (total) h += '<div class="fx-rail" aria-hidden="' + (named && ws.length > 1 ? 'false' : 'true') + '">' + ws.map(function(w){

      if (!(named && ws.length > 1)) return '<div class="fx-wv" style="--n:' + w.steps.length + '">' + ticks + '</div>';
      return '<button class="fx-wv' + (w.on ? ' on' : '') + '" type="button" style="--n:' + w.steps.length + '" data-jump="' + esc(s.id) + '|' + w.n + '" title="' + esc(w.name) + ' — ' + w.done + ' of ' + w.steps.length + '">' + ticks + '<span class="fx-l"><b>' + (function(p){ return esc(p[0]) + (p[1] ? '<span class="wrest"> — ' + esc(p.slice(1).join(' — ')) + '</span>' : ''); })(String(w.name || 'Steps').split(' — ')) + '</b><span>' + w.done + '/' + w.steps.length + '</span></span></button>'; }).join('') + '</div>';
    var c = [];
    if (total) c.push(spec(active ? 'On step' : 'Steps', active ? stepNo(s, active) + '<small>of ' + total + '</small>' : done + '<small>of ' + total + '</small>'));
    if (chat) { if (s.state === 'working' || s.state === 'quiet' || s.state === 'needs') { if (ch.askAt) c.push(spec('This message', '<span data-since="' + ch.askAt + '">' + dur(now() - ch.askAt) + '</span>')); }
      else if (ch.askAt && ch.endAt && ch.endAt >= ch.askAt) c.push(spec('Worked on it', esc(short(ch.endAt - ch.askAt))));
      if (ch.turns) c.push(board ? spec('Messages', ch.turns) : spec('From you', ch.turns + '<small>message' + (ch.turns === 1 ? '' : 's') + '</small>')); }
    else c.push(s.state === 'done' ? spec('Took', esc(short(s.updated - s.started))) : spec('On the clock', '<span data-since="' + s.started + '">' + dur(now() - s.started) + '</span>'));
    if (eta(s)) c.push(board ? spec('Time left', esc(eta(s).replace(' left at this pace', ''))) : spec('At this pace', esc(eta(s).replace(' left at this pace', '')) + '<small>left</small>'));
    if (s.progress) c.push(spec(esc(s.progress.label || 'Progress'), B.fmtN(s.progress.done) + '<small>of ' + B.fmtN(s.progress.total) + '</small>'));

    if (chat && s.you) { var yk = s.id + '|y', long = s.you.text.length > 230;
      h += '<div class="fx-say sm' + (openMore[yk] ? ' open' : '') + '"><span class="fx-l">You asked</span><span class="v clamp">' + esc(s.you.text) + '</span>' + (long && !openMore[yk] ? '<button class="more" type="button" data-more="' + esc(yk) + '">Show all</button>' : '') + '</div>'; }
    var doingK = { done: 'Done', ended: 'Closed', waiting: 'Your turn', needs: 'Needs you' }[s.state] || 'Now';
    var doingV = chat && (s.state === 'working' || s.state === 'quiet') && s.acts && s.acts[0] ? s.acts[0].text
      : s.state === 'waiting' ? (ch.ask || s.current || 'Its reply is ready') : s.state === 'needs' ? (ch.need || s.current || 'It is waiting for your OK')
      : (s.current || (active && active.text) || (s.state === 'done' ? 'Finished' : s.state === 'ended' ? 'This chat is closed' : 'Getting started'));
    h += '<div class="fx-say now"><span class="fx-l">' + doingK + '</span><span class="v">' + esc(doingV) + '<span class="car"></span></span>' + (s.note ? '<span class="note2">' + esc(s.note) + '</span>' : '') + '</div>';
    if (chat && ch.recap && s.state !== 'working') h += '<div class="fx-say sm"><span class="fx-l">Last reply</span><span class="v">' + esc(ch.recap) + '</span></div>';
    if (chat && (ch.helpers || []).length) h += '<div class="fx-say sm"><span class="fx-l">Helpers</span><div class="helpers">' + ch.helpers.map(function(x){ return '<span class="helper' + (x.done ? '' : ' run') + '" title="' + esc(x.d) + '">' + (x.done ? I('check') : '<span class="pip live"></span>') + '<span>' + esc(x.d) + '</span></span>'; }).join('') + '</div></div>';

  }
  // the ledger of steps: each with its note, and a bar placed where it really happened in the session's time
  function fxSteps(s, board){
    var tasks = s.tasks || [], ws = waves(s), named = ws.some(function(w){ return w.name; });
    if (!tasks.length) return '';
    var ends = tasks.map(function(t){ return t.doneAt || 0; }), last = s.state === 'done' ? Math.max.apply(null, ends.concat([s.updated])) : now(), span = Math.max(1000, last - s.started);
    var timed = tasks.filter(function(t){ return t.status === 'done' && t.startedAt && t.doneAt; }), instant = timed.filter(function(t){ return t.doneAt - t.startedAt < 1000; });
    var hasNote = tasks.some(function(t, i){ return t.desc || (s.acts || []).some(function(a){ return a.step === t.text; }); });
    var hd = board ? 'h3' : 'h2', wk = s.id + '|w', fold = board && ws.length > 4 && !openMore[wk] ? ws.length - 3 : 0, early = ws.slice(0, fold);
    var h = '<section class="fx-sec" aria-label="Every step"><div class="fx-h"><' + hd + '>Every step</' + hd + '>' + (hasNote && !board ? '<button class="more" type="button" data-fxall="1">' + (fxAll ? 'Hide the notes' : 'Show every note') + '</button>' : '') + '<span class="fx-l tw">Where the time went</span></div>';
    if (timed.length > 2 && instant.length >= timed.length / 2) h += '<p class="fx-cap">' + instant.length + ' of ' + timed.length + ' steps were ticked off within a second, so the time shows on the others.</p>';
    if (fold) h += '<button class="earlier" type="button" data-more="' + esc(wk) + '">' + I('checkcircle') + '<span><b>' + fold + ' earlier waves</b> · ' + early.reduce(function(a, w){ return a + w.done; }, 0) + ' of ' + early.reduce(function(a, w){ return a + w.steps.length; }, 0) + ' steps done · show them</span></button>';
    h += ws.slice(fold).map(function(w){ var key = s.id + '|' + w.n, shut = key in shutWaves ? shutWaves[key] : (!!board && w.done === w.steps.length && ws.length > 1);
      var wt = w.started ? (w.ended ? short(w.ended - w.started) : '<span data-since="' + w.started + '" data-short>' + short(now() - w.started) + '</span>') : '';
      return '<div class="wgroup' + (shut ? ' shut' : '') + '" id="w-' + esc(key) + '">' + (named ? '<button class="wgh' + (w.on ? ' on' : '') + '" type="button" data-wave="' + esc(key) + '" aria-expanded="' + !shut + '"><span class="t">' + esc(w.name || 'Steps') + '</span><span class="c">' + w.done + '/' + w.steps.length + (wt ? ' · ' + wt : '') + '</span><span class="chev">' + I('down') + '</span></button>' : '') +
        '<ol class="fx-steps steps2">' + w.steps.map(function(x){ var t = x.t, sk = s.id + '|' + x.i, sa = (s.acts || []).filter(function(a){ return a.step === t.text; }), has = t.desc || sa.length;
          var popped = prev[s.id] && prev[s.id][x.i] && prev[s.id][x.i] !== 'done' && t.status === 'done', open = has && ((!board && fxAll) || (sk in openSteps ? openSteps[sk] : t.status === 'active'));
          var st = t.startedAt ? Math.max(0, t.startedAt - s.started) : null, en = t.status === 'done' ? t.doneAt : t.status === 'active' ? last : null;
          var bar = st != null && en ? '<i style="left:' + Math.min(100, st / span * 100).toFixed(2) + '%;width:' + Math.min(100 - st / span * 100, (en - t.startedAt) / span * 100).toFixed(2) + '%"></i>' : '';
          var tm = t.status === 'done' && t.startedAt && t.doneAt && t.doneAt - t.startedAt < 1000 ? '&lt;1s' : stepTime(t);
          var row = '<span class="mk">' + (t.status === 'done' ? I('check') : t.status === 'active' ? '<span class="pip live"></span>' : '') + '</span><span class="no">' + ('0' + (x.i + 1)).slice(-2) + '</span><span class="nm">' + esc(t.text) + '</span><span class="gantt" aria-hidden="true">' + bar + '</span><span class="tm">' + tm + '</span>';
          return '<li class="fxs ' + t.status + (open ? ' open' : '') + (popped ? ' pop' : '') + '" data-i="' + x.i + '">' + (has ? '<button class="fxs-row" type="button" data-fxstep="' + esc(sk) + '" aria-expanded="' + !!open + '">' + row + '<span class="cv">' + I('down') + '</span></button>' : '<div class="fxs-row">' + row + '<span></span></div>') +
            (has ? '<div class="fxs-more">' + (t.desc ? '<p>' + esc(t.desc) + '</p>' : '') + (sa.length ? actsList(board ? sa.slice(0, 8) : sa) : '') + '</div>' : '') + '</li>'; }).join('') + '</ol></div>'; }).join('');
    return h + '</section>';
  }
  function fxMilestones(s){
    var mk = s.id + '|ms', n = s.story.length, list = openMore[mk] ? s.story : s.story.slice(0, 8);
    return '<section class="fx-sec"><div class="fx-h"><h2>Milestones</h2><span class="fx-l">' + n + '</span></div>' + (n ? '<ul class="fx-ms">' + list.map(function(e){
        var det = [e.detail, e.impact && 'Impact: ' + e.impact, e.fix && 'Fix: ' + e.fix, e.file].filter(Boolean).map(esc).join(' · ');
        var body = '<div class="txt">' + evText(e) + '</div>' + (det ? '<div class="det">' + det + '</div>' : '');
        return '<li class="k-' + esc(e.kind) + (openEv[e.id] ? ' open' : '') + '"><span class="w">' + clock(e.ts) + '</span>' + (det ? '<button class="ev2" type="button" data-ev="' + esc(e.id) + '" aria-expanded="' + !!openEv[e.id] + '">' + body + '</button>' : '<div>' + body + '</div>') + '</li>'; }).join('') + '</ul>' : '<p class="fx-empty">The story starts with the first step.</p>') +
      '<div class="fx-foot">' + (n > 8 && !openMore[mk] ? '<button class="btn sm" type="button" data-more="' + esc(mk) + '">Show all ' + n + '</button>' : '') + '<a class="btn sm ghost" href="/story/' + encodeURIComponent(s.id) + '">' + I('file') + 'Open the full story</a></div></section>';

  function renderFocus(){
    var s = data.sessions[0]; if (!s) return;

  // ---------- empty: the one prompt ----------
  function startHTML(){
    // a signed-in member's own board: two steps and they're working (connect once, then just chat)
    if (data && data.me && data.me.role !== 'owner') return '<section class="card start"><div class="art"><img src="/art/empty-desk.png" alt="" width="520" height="300" loading="lazy" data-framed></div><div class="copy">' +
      '<span class="badge accent" style="justify-self:start">' + I('zap') + (/welcome=1/.test(location.search) ? 'Welcome' : 'Your board') + '</span><h2>Your board is ready.</h2>' +
      '<p class="ink2"><b>1.</b> Connect Claude Code once: one line to copy and paste. <b>2.</b> Chat with Claude Code as you always do. Every chat appears here live, with what you asked, what it is doing and each step it ticks off. Only you can see it.</p>' +
      '<div><button class="btn primary" type="button" id="connect1">' + I('link') + 'Connect Claude Code</button></div></div></section>';
    return '<section class="card start"><div class="art"><img src="/art/empty-desk.png" alt="" width="520" height="300" loading="lazy" data-framed></div><div class="copy">' +
      '<span class="badge accent" style="justify-self:start">' + I('zap') + 'One prompt</span><h2>Nothing is running yet.</h2>' +
      '<p class="ink2">Say this to any coding agent on any project. It plans the work in waves, puts every step here with a note on what it does and why, ticks them off as it goes, adds the screens it checks and names every feature it ships — then closes with a report.</p>' +
      '<div class="prompt"><span>' + PROMPT + '</span><button class="btn sm" type="button" id="copy2">' + I('copy') + 'Copy</button></div>' +
      '<p class="meta">Or in plain words: “show my work on Breadledger”. Several agents at once each get their own card on this board.</p></div></section>';
  }
  function wireStart(){ var b = document.getElementById('copy2'); if (b) b.onclick = function(){ B.copy(PROMPT, 'The one prompt'); };
    var c = document.getElementById('connect1'); if (c) c.onclick = function(){ if (B.auth) B.auth.connect(); }; }

  // ---------- layout: side by side (default when several boards are open) or one column, remembered per device ----------
  var layout = 'grid'; try { layout = localStorage.getItem('bl_now_layout') || 'grid'; } catch (e) {}
  document.addEventListener('click', function(ev){ var b = ev.target.closest && ev.target.closest('[data-lay]'); if (!b) return;

  // ---------- events ----------
  root.addEventListener('click', function(ev){
    var t = ev.target.closest('[data-fxstep],[data-fxall],[data-ev],[data-step],[data-wave],[data-jump],[data-more],[data-go],[data-shot],[data-pmode]'); if (!t) return;

    if (t.dataset.shot) { var figs = Array.prototype.slice.call(t.closest('.strip').querySelectorAll('[data-shot]'));
      B.lightbox.open(figs.map(function(f){ return f.dataset.shot; }), figs.map(function(f){ return f.dataset.cap; }), figs.indexOf(t)); }
  });

  // ---------- live ----------
  function render(){ if (!data) return; if (focusId) renderFocus(); else renderBoard(); }
  function setPoll(st){ document.getElementById('pollpip').className = 'pip ' + (st === 'live' ? 'live' : 'off'); document.getElementById('pollstate').textContent = st === 'live' ? 'live' : st === 'retry' ? 'reconnecting…' : 'connecting…'; }
  function showErr(msg){ var el = document.getElementById('err'); if (!msg) { el.hidden = true; return; } el.hidden = false; el.innerHTML = '<div class="note danger" role="alert">' + I('alert') + '<span class="grow">' + esc(msg) + '</span></div>'; }
  var busy = false;

      busy = false;
      if (x.r.status === 401) { data = { owner: false, sessions: [] }; renderKeybar(); root.innerHTML = B.empty('This chat is private', 'Enter your Breadledger key above to open it, or <a href="/now">see everything in progress</a>.', 'lock'); setPoll('live'); showErr(''); return; }
      if (!x.j.ok) { if (x.r.status === 404 && focusId) { root.innerHTML = B.empty('No such session', 'It may have been started on another board. <a href="/now">See everything in progress</a>.', 'inbox'); setPoll('live'); return; } throw new Error(x.j.error || 'error'); }
      skew = x.j.now - Date.now(); data = x.j; setPoll('live'); showErr(''); renderKeybar(); render();

  }

    document.querySelectorAll('[data-since]').forEach(function(el){ var ms = now() - +el.dataset.since; el.textContent = el.hasAttribute('data-short') ? short(ms) : dur(ms); });
    document.querySelectorAll('[data-ago]').forEach(function(el){ el.textContent = B.ago(+el.dataset.ago - skew); });
    if (data && !focusId) { var c = document.querySelector('[data-clock]'); if (c) c.textContent = short(data.sessions.filter(function(s){ return s.state !== 'done'; }).reduce(function(a, s){ return a + now() - s.started; }, 0)); }
  }
  poll(); setInterval(function(){ if (!document.hidden) poll(); }, 2500); setInterval(tick, 1000);
  window.addEventListener('bread:key', function(){ var kb = document.getElementById('keybar'); kb.dataset.k = ''; poll(); });
  document.addEventListener('bread:auth', function(){ var kb = document.getElementById('keybar'); kb.dataset.k = ''; poll(); });   // signed in (or out) → the board follows at once   // a key entered anywhere opens the chats at once
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) poll(); });
})();
