<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Breadledger</title>
<meta name="description" content="That page does not exist.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/bread.css">
<script src="/bread-shell.js"></script>
<style>
  .legal{max-width:720px;display:grid;gap:18px}
  .legal h2{font-size:18px;margin:8px 0 0}
  .legal p,.legal li{font-size:15.5px;line-height:1.6;color:var(--ink-2);margin:0}
  .legal ul{margin:0;padding-left:20px;display:grid;gap:6px}
  .legal .fine{font-size:14px;color:var(--ink-3)}
</style>

<body>
<div class="bl-app" id="app">
  <aside class="bl-side" id="side" aria-label="Sidebar"></aside>
  <div class="bl-main">
    <header class="bl-top" id="top"></header>
    <main class="bl-content" id="page">
      <div class="card" style="max-width:640px">
        <div class="empty"><b>We couldn't find that page</b><p>The link may be old, or the address may have a typo.</p></div>
        <div class="card-b" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding-bottom:28px">
          <a class="btn primary" href="/">Go to the ledger</a><a class="btn" href="/now">Open my board</a>
        </div>
      </div>
    </main>
  </div>
</div>
<script>Bread.mount({ active: '', title: 'Page not found', crumbs: ['Page not found'] });</script>
</body>
</html>
