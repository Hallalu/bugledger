<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Debug any project against 428+ bugs, 67 security items and 117 optimisers from 24 apps. Agents scan, prove coverage, fix, and write an itemised scan story.">
<meta property="og:type" content="website">
<meta property="og:title" content="Bug Ledger — every bug, security hole and optimiser we ever hit, in one append-only catalogue">
<meta property="og:description" content="Debug any project against 428+ bugs, 67 security items and 117 optimisers from 24 apps. Agents scan, prove coverage, fix, and write an itemised scan story.">
<meta property="og:image" content="https://bugledger.coconvo.workers.dev/og.png">
<meta name="twitter:card" content="summary_large_image">
<title>Bug Ledger — every bug fixed</title>
<style>
  :root{
    --bg:#f6f7fb; --panel:#ffffff; --ink:#141726; --muted:#5b6178; --line:#e7e9f2;
    --accent:#6b5cff; --accent2:#00b4a6; --chip:#f0f1f8; --shadow:0 1px 2px rgba(20,23,38,.06),0 8px 24px rgba(20,23,38,.06);
    --done:#12a150; --ok:#e8f7ee;
    --c-crash:#e5484d; --c-data-loss:#d1620a; --c-logic:#6b5cff; --c-ui:#2f6feb; --c-security:#b4227a;
    --c-performance:#0e8a6e; --c-race:#8a5cf6; --c-sync:#0a7ea4; --c-auth:#c0392b; --c-other:#6b7280;
    --c-privacy:#a3391f; --c-claims:#9a6700; --c-accessibility:#1f7a8c; --c-observability:#4b5fc7; --c-testing:#5b7a1f; --c-seo:#7a4fbf;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d0f18; --panel:#151826; --ink:#eef0fa; --muted:#9aa1bd; --line:#242940;
      --chip:#1d2135; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); --ok:#12291d;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--accent)}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px}

  header.hero{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
  .title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .title h1{font-size:30px;letter-spacing:-.02em;margin:0;font-weight:800}
  .title .dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
  .sub{color:var(--muted);max-width:70ch}
  .kpis{display:flex;gap:10px;flex-wrap:wrap}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);min-width:120px}
  .kpi .n{font-size:24px;font-weight:800;letter-spacing:-.02em}
  .kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}

  .progress{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);margin:6px 0 20px}
  .progress .row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
  .bar{height:12px;border-radius:99px;background:var(--chip);overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .35s ease}
  .progress small{color:var(--muted)}

  .controls{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);padding:12px 0;margin-bottom:14px;border-bottom:1px solid var(--line)}
  .controls .line{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input[type=search],select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none}
  input[type=search]{flex:1;min-width:180px}
  input[type=search]:focus,select:focus{border-color:var(--accent)}
  .btn{font:inherit;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:inherit;display:inline-flex;gap:7px;align-items:center}
  .btn:hover{border-color:var(--accent)}
  .btn.solid{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none}
  .toggle{display:inline-flex;gap:7px;align-items:center;color:var(--muted);user-select:none;cursor:pointer;padding:9px 4px}

  details.app{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin:0 0 14px;overflow:hidden}
  details.app > summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:12px;font-weight:700}
  details.app > summary::-webkit-details-marker{display:none}
  summary .chev{transition:transform .2s;color:var(--muted)}
  details.app[open] summary .chev{transform:rotate(90deg)}
  summary .appname{font-size:17px;letter-spacing:-.01em}
  summary .count{margin-left:auto;color:var(--muted);font-weight:600;font-size:13px}
  summary .mini{width:120px;height:8px;border-radius:99px;background:var(--chip);overflow:hidden;flex:0 0 auto}
  summary .mini > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}

  ul.bugs{list-style:none;margin:0;padding:4px 8px 12px}
  li.bug{display:flex;gap:12px;padding:12px 10px;border-top:1px solid var(--line);align-items:flex-start}
  li.bug:first-child{border-top:none}
  li.bug.done .b-title{text-decoration:line-through;color:var(--muted)}
  li.bug.done{opacity:.72}
  .cbx{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:2px solid var(--line);border-radius:7px;flex:0 0 auto;cursor:pointer;position:relative;margin-top:1px;transition:.15s}
  .cbx:hover{border-color:var(--accent)}
  .cbx:checked{background:var(--done);border-color:var(--done)}
  .cbx:checked::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
  .b-main{flex:1;min-width:0}
  .b-title{font-weight:650;letter-spacing:-.01em}
  .b-meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:99px;color:#fff}
  .tag{font-size:11px;color:var(--muted);background:var(--chip);border-radius:99px;padding:2px 8px}
  .b-body{color:var(--muted);font-size:13.5px;display:grid;gap:3px;margin-top:2px}
  .b-body b{color:var(--ink);font-weight:600}
  .empty{color:var(--muted);text-align:center;padding:40px}
  footer{color:var(--muted);font-size:13px;text-align:center;margin-top:30px}
  mark{background:color-mix(in srgb,var(--accent) 35%,transparent);color:inherit;border-radius:3px}
  .topnav{margin-left:auto;display:flex;gap:8px}
  .topnav a{text-decoration:none;font-size:13px;font-weight:650;color:var(--muted);border:1px solid var(--line);
    border-radius:99px;padding:5px 12px;transition:.15s}
  .topnav a:hover{color:var(--ink);border-color:var(--muted)}
  .topnav a:last-child{color:#ff6a5a}
  .hero .title{display:flex;align-items:center;gap:12px}

  /* security sweep */
  details.sweep{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin:0 0 18px;overflow:hidden}
  details.sweep > summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:12px;font-weight:700}
  details.sweep > summary::-webkit-details-marker{display:none}
  details.sweep[open] summary .chev{transform:rotate(90deg)}
  .sweep .sec-head{padding:0 18px 14px;color:var(--muted);font-size:13.5px}
  .sweep .tally{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 4px}
  .sev{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 9px;border-radius:99px;color:#fff}
  .sev.critical{background:#b4227a}.sev.high{background:#e5484d}.sev.medium{background:#d1620a}.sev.low{background:#6b7280}
  .st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
  .st.fixed{color:#12a150;border-color:#12a150}.st.partial{color:#d1620a;border-color:#d1620a}
  .st.open{color:#e5484d;border-color:#e5484d}.st.accepted{color:var(--muted)}
  ul.finds{list-style:none;margin:0;padding:4px 8px 10px}
  li.find{padding:12px 10px;border-top:1px solid var(--line)}
  li.find:first-child{border-top:none}
  .find .f-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
  .find .fid{font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
  .find .f-title{font-weight:650}
  .find .f-body{color:var(--muted);font-size:13.5px;display:grid;gap:3px}
  .find .f-body b{color:var(--ink);font-weight:600}
  .find code,.f-files{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--muted)}
  .optchip{font-size:11px;font-weight:800;text-transform:capitalize;padding:2px 9px;border-radius:99px;
    color:#7c5cff;background:color-mix(in srgb,#7c5cff 13%,transparent);white-space:nowrap}
  .kpi{position:relative;cursor:pointer;transition:transform .12s}
  .kpi:hover{transform:translateY(-2px)}
  .kpi:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .kpi-hint{position:absolute;top:9px;right:11px;width:17px;height:17px;border-radius:50%;border:1.5px solid var(--line);
    color:var(--muted);font-size:10.5px;font-weight:800;display:grid;place-items:center;opacity:.45}
  .kpi:hover .kpi-hint{opacity:1;border-color:var(--muted)}
  #kpimodal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;
    background:color-mix(in srgb,#0b0d15 52%,transparent);backdrop-filter:blur(4px)}
  #kpimodal.show{display:flex;animation:kmfade .2s ease both}
  @keyframes kmfade{from{opacity:0}to{opacity:1}}
  #kpimodal .km-card{position:relative;max-width:440px;width:100%;background:var(--panel);border:1px solid var(--line);
    border-radius:20px;box-shadow:0 30px 80px -20px rgba(20,15,40,.6);padding:24px;animation:kmrise .28s cubic-bezier(.2,.8,.2,1) both}
  @keyframes kmrise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
  .km-x{position:absolute;top:10px;right:14px;border:none;background:none;font-size:26px;line-height:1;color:var(--muted);cursor:pointer}
  .km-h{display:flex;gap:14px;align-items:center;margin-bottom:12px}
  .km-ic{font-size:34px;line-height:1}
  .km-n{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .km-t{color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
  .km-what{font-size:16px;font-weight:650;margin:4px 0 8px}
  .km-detail{color:var(--muted);font-size:14px;margin:0 0 16px}
  .km-go{display:inline-block;text-decoration:none;font-weight:800;color:#fff;background:var(--accent);padding:9px 16px;border-radius:11px}
  .clean{padding:8px 18px 16px;color:var(--muted);font-size:13px}
  .clean b{color:var(--done, #12a150)}
  ul.mini{list-style:none;margin:4px 0;padding:0;display:grid;gap:3px;font-size:13px}
  ul.mini .f-files{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--muted)}
  details.clean-more{margin-top:4px}
  details.clean-more summary{cursor:pointer;color:var(--muted);font-size:12.5px}
  .find .appname{font-weight:700}
  /* ---- screenshots on a finding (before → after) ---- */
  .shots{display:flex;flex-wrap:wrap;gap:10px;margin-top:9px}
  .shot{margin:0;cursor:zoom-in;border:1px solid var(--line);border-radius:11px;overflow:hidden;
    background:var(--chip);width:170px;box-shadow:var(--shadow);transition:transform .12s ease,border-color .12s ease}
  .shot:hover{transform:translateY(-2px);border-color:var(--accent)}
  .shot img{display:block;width:100%;height:112px;object-fit:cover;object-position:top center;background:var(--panel)}
  .shot figcaption{font-size:11px;font-weight:700;color:var(--muted);padding:5px 9px;display:flex;align-items:center;gap:6px}
  .shot figcaption .ba{font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    padding:1px 6px;border-radius:99px;color:#fff}
  .shot .ba.before{background:#e5735a}.shot .ba.after{background:var(--accent2)}
  /* lightbox */
  #shotlb{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:26px;
    background:rgba(12,10,25,.82);backdrop-filter:blur(6px)}
  #shotlb.show{display:flex}
  #shotlb figure{margin:0;max-width:94vw;max-height:92vh;display:flex;flex-direction:column;gap:10px;align-items:center}
  #shotlb img{max-width:94vw;max-height:82vh;object-fit:contain;border-radius:14px;box-shadow:0 24px 70px -20px rgba(0,0,0,.7)}
  #shotlb figcaption{color:#fff;font-weight:700;font-size:14px}
  #shotlb .lbx{position:fixed;top:18px;right:22px;font-size:34px;line-height:1;color:#fff;cursor:pointer;
    background:none;border:none;opacity:.8}#shotlb .lbx:hover{opacity:1}
  #shotlb .lbnav{position:fixed;top:50%;transform:translateY(-50%);font-size:44px;color:#fff;cursor:pointer;
    background:none;border:none;opacity:.6;padding:0 14px;user-select:none}#shotlb .lbnav:hover{opacity:1}
  #shotlb .lbprev{left:8px}#shotlb .lbnext{right:8px}
  /* ---- add-a-finding panel ---- */
  details.addfind{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin:0 0 18px;overflow:hidden}
  details.addfind > summary{list-style:none;cursor:pointer;padding:15px 18px;display:flex;align-items:center;gap:10px;font-weight:750}
  details.addfind > summary::-webkit-details-marker{display:none}
  details.addfind > summary .chev{transition:transform .2s;color:var(--muted)}
  details.addfind[open] > summary .chev{transform:rotate(90deg)}
  details.addfind > summary .sub{font-weight:500;color:var(--muted);font-size:12.5px;margin-left:auto;max-width:none}
  .addform{padding:4px 18px 20px;display:grid;gap:13px}
  .addform .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
  .addform label{display:grid;gap:5px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .addform input,.addform select,.addform textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);
    border-radius:10px;padding:9px 11px;outline:none;font-weight:400;text-transform:none;letter-spacing:normal}
  .addform input:focus,.addform select:focus,.addform textarea:focus{border-color:var(--accent)}
  .addform textarea{resize:vertical;min-height:52px}
  .ba-slots{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  @media(max-width:560px){.ba-slots{grid-template-columns:1fr}}
  .drop{position:relative;border:1.5px dashed var(--line);border-radius:12px;min-height:118px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:5px;text-align:center;padding:12px;cursor:pointer;color:var(--muted);
    transition:.14s;background:var(--bg)}
  .drop:hover,.drop.over{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 7%,var(--bg))}
  .drop.filled{border-style:solid;padding:0;overflow:hidden}
  .drop .dz-ba{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;padding:2px 9px;border-radius:99px}
  .drop .dz-ba.before{background:#e5735a}.drop .dz-ba.after{background:var(--accent2)}
  .drop .dz-hint{font-size:12px;line-height:1.4}
  .drop img{width:100%;height:100%;object-fit:cover;object-position:top center;max-height:220px}
  .drop .dz-clear{position:absolute;top:7px;right:8px;z-index:2;background:rgba(0,0,0,.6);color:#fff;border:none;
    border-radius:99px;width:24px;height:24px;font-size:16px;line-height:1;cursor:pointer}
  .addrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .addmsg{font-size:13px;font-weight:600}.addmsg.ok{color:var(--accent2)}.addmsg.err{color:#e5484d}
  .keywrap{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
  .keywrap input{max-width:230px}
  @media print{
    .controls,.progress,.kpis,.btn{display:none!important}
    details.app{break-inside:avoid;box-shadow:none;border-color:#ccc}
    details.app[open] ul.bugs{display:block}
    body{background:#fff}
  }
  @media (pointer:coarse){input,select,textarea{font-size:16px}}   /* iOS: no focus zoom */
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="title">
      <span class="dot"></span>
      <h1>Bug Ledger</h1>
      <nav class="topnav"><a href="/sanitize">🧹 Sanitizer</a><a href="/timeline">🕘 Activity</a><a href="/live">● Live</a></nav>
    </div>
    <p class="sub">Every bug fixed across the portfolio — mined from the full conversation history and organized into one comprehensive checklist. Tick items as you re-verify them; progress is saved in your browser.</p>
    <div class="kpis" id="kpis"></div>
  </header>

  <div class="progress">
    <div class="row"><strong>Re-verification progress</strong><small id="pct">0%</small></div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="row" style="margin:10px 0 0"><small id="progline">0 of 0 checked</small></div>
  </div>

  <div class="controls">
    <div class="line">
      <input id="q" type="search" placeholder="Search bugs, symptoms, fixes…" autocomplete="off" aria-label="Search bugs, symptoms and fixes">
      <select id="fApp" aria-label="Filter by app"><option value="">All apps</option></select>
      <select id="fCat" aria-label="Filter by type"><option value="">All types</option></select>
      <select id="fSev" title="Severity is derived from impact category">
        <option value="">All severities</option>
        <option value="critical">Critical</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <label class="toggle"><input type="checkbox" id="onlyOpen"> Only unchecked</label>
      <button class="btn" id="expand">Expand all</button>
      <button class="btn" id="collapse">Collapse all</button>
      <button class="btn" id="print">🖨 Print</button>
      <button class="btn" id="reset">Reset ticks</button>
    </div>
  </div>

  <section id="addpanel"></section>
  <section id="checkpanel"></section>
  <section id="submitpanel"></section>
  <section id="secsweep"></section>
  <section id="optpanel"></section>
  <section id="scanpanel"></section>
  <section id="harvestpanel"></section>
  <main id="list"></main>
  <footer id="foot"></footer>
</div>

<div id="kpimodal" onclick="if(event.target===this)this.classList.remove('show')"><div class="km-card"></div></div>
<div id="shotlb" onclick="if(event.target===this)window.BL_closeShot&&window.BL_closeShot()"><button class="lbx" aria-label="Close">×</button><button class="lbnav lbprev" aria-label="Previous">‹</button><figure><img alt=""><figcaption></figcaption></figure><button class="lbnav lbnext" aria-label="Next">›</button></div>
<script>document.addEventListener('keydown',function(e){if(e.key==='Escape'){var m=document.getElementById('kpimodal');if(m)m.classList.remove('show');}});</script>
<script src="data-sec.js"></script>
<script src="data-opt.js"></script>
<script src="data-scan.js"></script>
<script src="data-harvest.js"></script>
<script src="data.js?v=2"></script>
<script>
/* ---- shared screenshot helpers: thumbnails + before/after lightbox ---- */
(function(){
  function esc(s){ return (s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }
  // classify a caption as before/after for the little pill
  function baClass(cap){ var c=(cap||'').toLowerCase();
    if(/\bbefore\b|\bwas\b|current|old|problem|issue/.test(c)) return 'before';
    if(/\bafter\b|\bnow\b|fixed|new|improved|elevated|proposed/.test(c)) return 'after'; return ''; }
  // render a strip of thumbnails for a shots array [{url,caption}]
  window.BL_shotStrip=function(shots){
    if(!Array.isArray(shots)||!shots.length) return '';
    var urls=shots.map(function(s){return s.url;});
    var html=shots.map(function(s,i){
      var ba=baClass(s.caption);
      return '<figure class="shot" data-shot="'+esc(urls.join('|'))+'" data-i="'+i+'" tabindex="0" role="button" aria-label="View screenshot">'+
        '<img loading="lazy" src="'+esc(s.url)+'" alt="'+esc(s.caption||'screenshot')+'">'+
        (s.caption||ba?'<figcaption>'+(ba?'<span class="ba '+ba+'">'+ba+'</span>':'')+esc(s.caption||'')+'</figcaption>':'')+
        '</figure>';
    }).join('');
    return '<div class="shots">'+html+'</div>';
  };
  var lb=document.getElementById('shotlb'), lbImg=lb.querySelector('img'), lbCap=lb.querySelector('figcaption');
  var cur=[], curCaps=[], idx=0;
  function show(){ lbImg.src=cur[idx]||''; lbCap.textContent=curCaps[idx]||''; lb.classList.add('show');
    lb.querySelector('.lbprev').style.display=lb.querySelector('.lbnext').style.display=cur.length>1?'block':'none'; }
  window.BL_openShot=function(urls,caps,i){ cur=urls||[]; curCaps=caps||[]; idx=i||0; show(); };
  window.BL_closeShot=function(){ lb.classList.remove('show'); lbImg.src=''; };
  lb.querySelector('.lbx').onclick=window.BL_closeShot;
  lb.querySelector('.lbprev').onclick=function(e){ e.stopPropagation(); idx=(idx-1+cur.length)%cur.length; show(); };
  lb.querySelector('.lbnext').onclick=function(e){ e.stopPropagation(); idx=(idx+1)%cur.length; show(); };
  document.addEventListener('keydown',function(e){ if(!lb.classList.contains('show'))return;
    if(e.key==='Escape')window.BL_closeShot(); else if(e.key==='ArrowLeft')lb.querySelector('.lbprev').click();
    else if(e.key==='ArrowRight')lb.querySelector('.lbnext').click(); });
  // one delegated click handler opens any thumbnail (thumbs are added dynamically)
  document.addEventListener('click',function(e){ var f=e.target.closest&&e.target.closest('.shot[data-shot]'); if(!f)return;
    var urls=f.getAttribute('data-shot').split('|');
    var caps=Array.prototype.map.call(f.parentNode.querySelectorAll('.shot'),function(x){var c=x.querySelector('figcaption');return c?c.textContent:'';});
    window.BL_openShot(urls,caps,+f.getAttribute('data-i')||0); });
  document.addEventListener('keydown',function(e){ if((e.key==='Enter'||e.key===' ')&&document.activeElement&&document.activeElement.classList&&document.activeElement.classList.contains('shot')){ e.preventDefault(); document.activeElement.click(); } });
})();
</script>
<script>
(function(){
  var BUGS = (window.BUGS||[]).map(function(b,i){ b._id = b.session+'-'+i; return b; });
  var GENERATED = window.GENERATED || '';
  var CATLABEL = {crash:'crash','data-loss':'data loss',logic:'logic',ui:'ui',security:'security',performance:'perf',race:'race',sync:'sync',auth:'auth',
    privacy:'privacy',claims:'claims',accessibility:'a11y',observability:'observability',testing:'testing',seo:'SEO',other:'other'};
  // severity derived from impact category (critical/high/medium/low)
  var CAT2SEV = {'data-loss':'critical',security:'high',crash:'high',auth:'high',sync:'high',privacy:'high',
    race:'medium',logic:'medium',claims:'medium',accessibility:'medium',observability:'medium',
    testing:'low',seo:'low',performance:'low',ui:'low',other:'low'};
  var sevOf = function(b){ return b.severity || CAT2SEV[b.category] || 'low'; };
  var KEY='bugledger.checked.v1';
  var checked = {};
  try{ checked = JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){}

  var $=function(s,r){return (r||document).querySelector(s)};
  var list=$('#list');

  // populate app + cat filters
  var apps={}, cats={};
  BUGS.forEach(function(b){ apps[b.app]=(apps[b.app]||0)+1; cats[b.category]=(cats[b.category]||0)+1; });
  var appOrder=Object.keys(apps).sort(function(a,b){return apps[b]-apps[a]});
  var NONAPP={'cross-cutting':1,'Unknown':1}; var realAppCount=appOrder.filter(function(a){return !NONAPP[a];}).length;
  appOrder.forEach(function(a){ var o=document.createElement('option'); o.value=a; o.textContent=a+' ('+apps[a]+')'; $('#fApp').appendChild(o); });
  Object.keys(cats).sort().forEach(function(c){ var o=document.createElement('option'); o.value=c; o.textContent=CATLABEL[c]+' ('+cats[c]+')'; $('#fCat').appendChild(o); });

  // KPIs
  var kpi=$('#kpis');
  var KPI_INFO={
    'bugs fixed':{icon:'🐛',title:'Bugs fixed',what:'Every distinct bug we’ve fixed across all apps, mined from the full build history.',detail:'Each entry has a symptom → root cause → fix and an app + severity. This is the master catalogue every scan checks a project against.',go:null},
    'apps':{icon:'📦',title:'Apps',what:'How many distinct apps these bugs span.',detail:'Finished., Hallalu CRM, Stitchhooky, Aprizely, Breadcrumb and more — plus “cross-cutting” for issues that apply everywhere.',go:null},
    'security':{icon:'🛡',title:'Security bugs',what:'Bugs in the security category — auth, XSS, SSRF, secrets, injection, isolation, rate-limiting.',detail:'A subset of “bugs fixed”. A /securitysweep checks a project against every one of these (plus the audit findings).',go:null},
    'data / sync':{icon:'💾',title:'Data & sync bugs',what:'Bugs about losing or mis-syncing user data.',detail:'Data-loss (wiped/overwritten content) + sync issues (tombstones, deletions resurrecting, cross-device merges).',go:null},
    'audit findings':{icon:'🔍',title:'Security audit findings',what:'Findings from the full AI security audit of Budget LevelUp / Listing Lab.',detail:'1 critical, 3 high, 4 medium, 7 low, plus verified-clean checks — shown in the 🔒 Security Sweep panel, each with fix + status.',go:'#secsweep'},
    'optimisers':{icon:'✨',title:'Optimisers',what:'Reusable elevations — not bugs, things that made an app better.',detail:'Design polish, UX, performance and workflow patterns worth repeating (e.g. aurora-glass, one-shot animations, onboarding 1–2 fields/screen), grouped by category.',go:'#optpanel'},
    'scanner leads':{icon:'🔦',title:'Scanner leads',what:'Static-analysis hits from scan.mjs across scanned apps.',detail:'Code-smell matches (42 detectors) to verify — leads, not confirmed bugs. Seen in the 🔎 Scanner findings panel.',go:'#scanpanel'},
    'auto-harvested':{icon:'🌱',title:'Auto-harvested',what:'Unverified bugs auto-mined from your conversation transcripts by the hourly harvester.',detail:'A triage queue — promote the good ones into the curated ledger. Shown in the 🌱 Auto-harvested panel.',go:'#harvestpanel'},
    'agent checks':{icon:'✅',title:'Agent checks',what:'Recorded /bugcheck, /deepscan or /securitysweep passes.',detail:'Each time an agent checks a project against the ledger it logs coverage (N/N) + findings here — open the 📊 full report on any of them.',go:'#checks'},
    'agent-submitted':{icon:'🧫',title:'Agent-submitted',what:'New bugs / security issues / optimisers agents discovered and appended to the ledger.',detail:'Append-only proposals — permanent, so every future project is checked for them too. Shown in the 🧫 Agent-submitted panel.',go:'#submitpanel'},
  };
  function openKpi(l,n){
    var i=KPI_INFO[l]; if(!i) return;
    var m=document.getElementById('kpimodal');
    m.querySelector('.km-card').innerHTML=
      '<button class="km-x" aria-label="Close">×</button>'+
      '<div class="km-h"><span class="km-ic">'+i.icon+'</span><div><div class="km-n">'+n+'</div><div class="km-t">'+esc(i.title)+'</div></div></div>'+
      '<p class="km-what">'+esc(i.what)+'</p>'+
      '<p class="km-detail">'+esc(i.detail)+'</p>'+
      (i.go?'<a class="km-go" href="'+i.go+'">Show me →</a>':'');
    m.classList.add('show');
    m.querySelector('.km-x').onclick=function(){m.classList.remove('show');};
    var go=m.querySelector('.km-go'); if(go) go.onclick=function(){m.classList.remove('show');};
  }
  function kpiEl(n,l){ var d=document.createElement('div'); d.className='kpi'; d.tabIndex=0; d.setAttribute('role','button');
    d.innerHTML='<div class="n">'+n+'</div><div class="l">'+l+'</div><div class="kpi-hint">?</div>';
    d.addEventListener('click',function(){openKpi(l,n);});
    d.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openKpi(l,n);}});
    return d; }
  kpi.appendChild(kpiEl(BUGS.length,'bugs fixed'));
  kpi.appendChild(kpiEl(realAppCount,'apps'));
  var sec=BUGS.filter(function(b){return b.category==='security'}).length;
  var dl=BUGS.filter(function(b){return b.category==='data-loss'||b.category==='sync'}).length;
  kpi.appendChild(kpiEl(sec,'security'));
  kpi.appendChild(kpiEl(dl,'data / sync'));

  function esc(s){ return (s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }
  function hl(s,q){ s=esc(s); if(!q) return s; try{ return s.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>'); }catch(e){ return s; } }

  function save(){ localStorage.setItem(KEY, JSON.stringify(checked)); }
  function isDone(b){ return !!checked[b._id]; }

  function render(){
    var q=$('#q').value.trim().toLowerCase();
    var fa=$('#fApp').value, fc=$('#fCat').value, fsv=$('#fSev').value, only=$('#onlyOpen').checked;
    list.innerHTML='';
    var shown=0, totalDone=0;
    BUGS.forEach(function(b){ if(isDone(b)) totalDone++; });

    appOrder.forEach(function(app){
      if(fa && app!==fa) return;
      var items=BUGS.filter(function(b){
        if(b.app!==app) return false;
        if(fc && b.category!==fc) return false;
        if(fsv && sevOf(b)!==fsv) return false;
        if(only && isDone(b)) return false;
        if(q){
          var hay=(b.title+' '+b.symptom+' '+b.root_cause+' '+b.fix+' '+b.category).toLowerCase();
          if(hay.indexOf(q)<0) return false;
        }
        return true;
      });
      if(!items.length) return;
      var done=BUGS.filter(function(b){return b.app===app && isDone(b)}).length;
      var tot=apps[app];
      var d=document.createElement('details'); d.className='app'; d.open = !!(q||fc||fa||fsv||only) || openState[app]!==false;
      d.addEventListener('toggle',function(){ openState[app]=d.open; });
      var pctApp=Math.round(done/tot*100);
      var s=document.createElement('summary');
      s.innerHTML='<span class="chev">▶</span><span class="appname">'+esc(app)+'</span>'+
        '<span class="mini"><i style="width:'+pctApp+'%"></i></span>'+
        '<span class="count">'+done+'/'+tot+'</span>';
      d.appendChild(s);
      var ul=document.createElement('ul'); ul.className='bugs';
      items.forEach(function(b){
        shown++;
        var li=document.createElement('li'); li.className='bug'+(isDone(b)?' done':'');
        var col='var(--c-'+b.category+')';
        var body='';
        if(b.symptom) body+='<div><b>Symptom:</b> '+hl(b.symptom,q)+'</div>';
        if(b.root_cause) body+='<div><b>Cause:</b> '+hl(b.root_cause,q)+'</div>';
        if(b.fix) body+='<div><b>Fix:</b> '+hl(b.fix,q)+'</div>';
        li.innerHTML='<input class="cbx" type="checkbox" aria-label="Mark checked: '+esc(b.title)+'" '+(isDone(b)?'checked':'')+'>'+
          '<div class="b-main"><div class="b-title">'+hl(b.title,q)+'</div>'+
          '<div class="b-meta"><span class="sev '+sevOf(b)+'">'+sevOf(b)+'</span>'+
          '<span class="badge" style="background:'+col+'">'+CATLABEL[b.category]+'</span>'+
          '<span class="tag">#'+esc(b.session)+'</span></div>'+
          '<div class="b-body">'+body+'</div></div>';
        var cb=li.querySelector('.cbx');
        cb.addEventListener('change',function(){
          checked[b._id]=cb.checked; if(!cb.checked) delete checked[b._id];
          save(); li.classList.toggle('done',cb.checked); updateProgress();
          // update the app mini bar + count without full re-render
          var nd=BUGS.filter(function(x){return x.app===app && isDone(x)}).length;
          s.querySelector('.count').textContent=nd+'/'+tot;
          s.querySelector('.mini > i').style.width=Math.round(nd/tot*100)+'%';
        });
        ul.appendChild(li);
      });
      d.appendChild(ul);
      list.appendChild(d);
    });

    if(!shown){ list.innerHTML='<div class="empty">No bugs match your filters.</div>'; }
    updateProgress();
  }

  var openState={};
  function updateProgress(){
    var done=0; BUGS.forEach(function(b){ if(isDone(b)) done++; });
    var pct=BUGS.length?Math.round(done/BUGS.length*100):0;
    $('#barfill').style.width=pct+'%';
    $('#pct').textContent=pct+'%';
    $('#progline').textContent=done+' of '+BUGS.length+' checked';
  }

  function applyPanelSev(){
    var sv=$('#fSev').value;
    document.querySelectorAll('#secsweep li.find, #scanpanel li.find, #harvestpanel li.find, #submitpanel li.find').forEach(function(li){
      li.style.display = (!sv || li.getAttribute('data-sev')===sv) ? '' : 'none';
    });
    // hide a panel's app-subgroup / whole panel when it has no visible rows
    document.querySelectorAll('#scanpanel .scan-appgroup, #harvestpanel .scan-appgroup, #submitpanel .scan-appgroup').forEach(function(g){
      var any=[].some.call(g.querySelectorAll('li.find'),function(li){return li.style.display!=='none'});
      g.style.display=any?'':'none';
    });
    ['#secsweep','#scanpanel','#harvestpanel','#submitpanel'].forEach(function(sel){
      var d=document.querySelector(sel+' details'); if(!d) return;
      var any=[].some.call(d.querySelectorAll('li.find'),function(li){return li.style.display!=='none'});
      d.style.display=any?'':'none';
    });
  }
  $('#q').addEventListener('input',render);
  $('#fApp').addEventListener('change',render);
  $('#fCat').addEventListener('change',render);
  $('#fSev').addEventListener('change',function(){ render(); applyPanelSev(); });
  $('#onlyOpen').addEventListener('change',render);
  $('#expand').addEventListener('click',function(){ document.querySelectorAll('details.app').forEach(function(d){d.open=true; openState[d.querySelector('.appname').textContent]=true;}); });
  $('#collapse').addEventListener('click',function(){ document.querySelectorAll('details.app').forEach(function(d){d.open=false; openState[d.querySelector('.appname').textContent]=false;}); });
  $('#print').addEventListener('click',function(){ document.querySelectorAll('details.app').forEach(function(d){d.open=true;}); window.print(); });
  $('#reset').addEventListener('click',function(){ if(confirm('Clear all ticks?')){ checked={}; save(); render(); } });

  $('#foot').innerHTML='Bug Ledger · '+BUGS.length+' fixes across '+realAppCount+' apps'+(GENERATED?(' · generated '+esc(GENERATED)):'')+' · state saved locally in your browser';
  render();

  // ---- Security Sweep panel ----
  var SEC = window.SECURITY;
  if(SEC && SEC.findings && SEC.findings.length){
    var t = SEC.tally||{};
    var open = SEC.findings.filter(function(f){return f.status==='open'}).length;
    kpi.appendChild(kpiEl(SEC.findings.length,'audit findings'));
    var host=$('#secsweep');
    var d=document.createElement('details'); d.className='sweep'; d.open=false;
    var badges=['critical','high','medium','low'].filter(function(k){return t[k]}).map(function(k){return '<span class="sev '+k+'">'+t[k]+' '+k+'</span>'}).join('');
    var order={critical:0,high:1,medium:2,low:3};
    var finds=SEC.findings.slice().sort(function(a,b){return (order[a.severity]-order[b.severity])||a.id.localeCompare(b.id)});
    var lis=finds.map(function(f){
      var body='';
      if(f.detail) body+='<div>'+esc(f.detail)+'</div>';
      if(f.fix) body+='<div><b>Fix:</b> '+esc(f.fix)+'</div>';
      if(f.files) body+='<div class="f-files">'+esc(f.files)+'</div>';
      return '<li class="find" data-sev="'+esc(f.severity)+'"><div class="f-top"><span class="fid">'+esc(f.id)+'</span>'+
        '<span class="sev '+esc(f.severity)+'">'+esc(f.severity)+'</span>'+
        '<span class="st '+esc(f.status)+'">'+esc(f.status)+'</span>'+
        '<span class="tag">'+esc(f.app||'')+'</span></div>'+
        '<div class="f-title">'+esc(f.title)+'</div>'+
        '<div class="f-body">'+body+'</div></li>';
    }).join('');
    var clean=(SEC.verified_clean||[]).map(function(c){return '✓ '+esc(c)}).join('<br>');
    d.innerHTML='<summary><span class="chev">▶</span><span class="appname">🔒 '+esc(SEC.title||'Security Sweep')+'</span>'+
        '<span class="count">'+open+' open · '+SEC.findings.length+' total</span></summary>'+
      '<div class="sec-head"><div class="tally">'+badges+'</div>'+esc(SEC.method||'')+
        (SEC.date?' &middot; audited '+esc(SEC.date):'')+' &middot; <a href="SECURITY-AUDIT.md">full report</a></div>'+
      '<ul class="finds">'+lis+'</ul>'+
      (clean?'<div class="clean"><b>Verified clean:</b><br>'+clean+'</div>':'');
    host.appendChild(d);
  }

  // ---- Optimisers panel (elevations worth reusing) ----
  var OPT = window.OPTIMISERS;
  if(OPT && OPT.items && OPT.items.length){
    kpi.appendChild(kpiEl(OPT.items.length,'optimisers'));
    var oLabels=OPT.labels||{};
    var oHost=$('#optpanel');
    var od=document.createElement('details'); od.className='sweep'; od.open=false;
    var byCat={}; OPT.items.forEach(function(o){(byCat[o.category]=byCat[o.category]||[]).push(o)});
    var cats=OPT.cats||Object.keys(byCat);
    var groups=cats.filter(function(c){return byCat[c]}).map(function(c){
      var items=byCat[c];
      var lis=items.map(function(o){
        return '<li class="find"><div class="f-top"><span class="optchip">'+esc(oLabels[c]||c)+'</span>'+
          '<span class="f-title">'+esc(o.title)+'</span><span class="tag">'+esc(o.app||'')+'</span></div>'+
          '<div class="f-body">'+(o.detail?'<div>'+esc(o.detail)+'</div>':'')+
          (o.why?'<div><b>Why:</b> '+esc(o.why)+'</div>':'')+
          (o.how?'<div><b>How:</b> '+esc(o.how)+'</div>':'')+'</div></li>';
      }).join('');
      return '<div class="scan-appgroup" style="padding:6px 8px 0"><div style="font-weight:700;padding:8px 10px 2px;text-transform:capitalize">'+esc(oLabels[c]||c)+' · '+items.length+'</div><ul class="finds">'+lis+'</ul></div>';
    }).join('');
    od.innerHTML='<summary><span class="chev">▶</span><span class="appname">✨ Optimisers</span>'+
        '<span class="count">'+OPT.items.length+' · '+cats.length+' categories</span></summary>'+
      '<div class="sec-head"><b>Elevations worth reusing</b> — design polish, UX, performance and workflow patterns mined from the build history (not bugs — things that made an app <i>better</i>). &middot; <a href="OPTIMISERS.md">full list</a></div>'+
      groups;
    oHost.appendChild(od);
  }

  // ---- Scanner Findings panel ----
  var SCAN = window.SCAN;
  if(SCAN && SCAN.findings && SCAN.findings.length){
    kpi.appendChild(kpiEl(SCAN.findings.length,'scanner leads'));
    var svo={critical:0,high:1,medium:2,low:3};
    var host2=$('#scanpanel');
    var d2=document.createElement('details'); d2.className='sweep'; d2.open=false;
    var apps2=SCAN.apps||Object.keys(SCAN.findings.reduce(function(a,f){a[f.app]=1;return a},{}));
    var groups=apps2.map(function(app){
      var items=SCAN.findings.filter(function(f){return f.app===app}).sort(function(a,b){return (svo[a.severity]-svo[b.severity])||String(a.file).localeCompare(b.file)});
      var lis=items.map(function(f){
        return '<li class="find" data-sev="'+esc(f.severity)+'"><div class="f-top"><span class="sev '+esc(f.severity)+'">'+esc(f.severity)+'</span>'+
          '<span class="fid">'+esc(f.detector)+'</span><span class="f-title">'+esc(f.title)+'</span></div>'+
          '<div class="f-body"><div class="f-files">'+esc(f.file)+':'+esc(String(f.line))+'</div>'+
          '<div><code>'+esc((f.excerpt||'').slice(0,140))+'</code></div>'+
          '<div><b>Fix:</b> '+esc(f.advice)+'</div></div></li>';
      }).join('');
      return '<div class="scan-appgroup" style="padding:6px 8px 0"><div style="font-weight:700;padding:8px 10px 2px">'+esc(app)+' · '+items.length+'</div><ul class="finds">'+lis+'</ul></div>';
    }).join('');
    d2.innerHTML='<summary><span class="chev">▶</span><span class="appname">🔎 Scanner findings</span>'+
        '<span class="count">'+SCAN.findings.length+' leads · '+apps2.length+' app'+(apps2.length>1?'s':'')+'</span></summary>'+
      '<div class="sec-head">Static-analysis leads from <code>scan.mjs</code> — code-smell matches to verify, not confirmed bugs. '+
        'Run <code>node scan.mjs &lt;app&gt; --write</code> to refresh. &middot; <a href="SCAN-FINDINGS.md">full list</a></div>'+
      groups;
    host2.appendChild(d2);
  }

  // ---- Auto-harvested panel ----
  var HARV = window.HARVEST;
  if(HARV && HARV.findings && HARV.findings.length){
    kpi.appendChild(kpiEl(HARV.findings.length,'auto-harvested'));
    var hvo={critical:0,high:1,medium:2,low:3};
    var host3=$('#harvestpanel');
    var d3=document.createElement('details'); d3.className='sweep'; d3.open=false;
    var happs=HARV.apps||Object.keys(HARV.findings.reduce(function(a,f){a[f.app]=1;return a},{}));
    var hgroups=happs.map(function(app){
      var items=HARV.findings.filter(function(f){return f.app===app}).sort(function(a,b){return (hvo[a.severity]-hvo[b.severity])});
      var lis=items.map(function(f){
        return '<li class="find" data-sev="'+esc(f.severity)+'"><div class="f-top"><span class="sev '+esc(f.severity)+'">'+esc(f.severity)+'</span>'+
          '<span class="fid">'+esc(f.category)+'</span><span class="tag">'+esc(f.found||'')+' · #'+esc(f.session||'')+'</span></div>'+
          '<div class="f-title" style="font-weight:550">'+esc(f.title)+'</div></li>';
      }).join('');
      return '<div class="scan-appgroup" style="padding:6px 8px 0"><div style="font-weight:700;padding:8px 10px 2px">'+esc(app)+' · '+items.length+'</div><ul class="finds">'+lis+'</ul></div>';
    }).join('');
    d3.innerHTML='<summary><span class="chev">▶</span><span class="appname">🌱 Auto-harvested</span>'+
        '<span class="count">'+HARV.findings.length+' unverified · '+happs.length+' app'+(happs.length>1?'s':'')+'</span></summary>'+
      '<div class="sec-head"><b>Unverified.</b> Auto-mined from conversation transcripts by <code>harvest.mjs</code> (runs hourly). '+
        'Promote good ones into the curated ledger. &middot; <a href="HARVESTED.md">full list</a></div>'+
      hgroups;
    host3.appendChild(d3);
  }

  // ---- Agent Check-log panel (fetched live from /api/checks) ----
  (function(){
    var host=$('#checkpanel'); if(!host) return;
    fetch('/api/checks?limit=100').then(function(r){return r.json()}).then(function(d){
      if(!d || !d.ok || !d.checks || !d.checks.length) return;
      var checks=d.checks;
      kpi.appendChild(kpiEl(checks.length,'agent checks'));
      var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      var fmt=function(ts){ try{ var d=new Date(ts),p=function(n){return ('0'+n).slice(-2)};
        return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()+', '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); }catch(e){ return ''; } };
      var rows=checks.map(function(c){
        var stCls = c.securityStatus==='clean'?'fixed':(c.securityStatus==='issues'?'open':'accepted');
        var foundList=(c.found||[]).map(function(f){return '<li>⚠️ '+esc(f.title)+(f.file?' <span class="f-files">'+esc(f.file)+'</span>':'')+(f.note?' — '+esc(f.note):'')+'</li>'}).join('');
        var secList=(c.securityFindings||[]).map(function(f){return '<li><span class="sev '+esc(f.severity||'low')+'">'+esc(f.severity||'')+'</span> '+esc(f.title)+(f.file?' <span class="f-files">'+esc(f.file)+'</span>':'')+'</li>'}).join('');
        var cleanN=(c.notFound||[]).length;
        var cleanList=(c.notFound||[]).slice(0,60).map(function(t){return '<li>✓ '+esc(t)+'</li>'}).join('');
        var cov=c.coverage;
        var isScan=(c.checkedBy||'').indexOf('scan')>=0;
        var unit=c.scope==='security'?'security':(c.scope==='all'?'catalog':'bugs');
        var covBadge = isScan ? '<span class="st accepted">🔍 detector scan</span>' :
          (cov && cov.total) ? '<span class="st '+(cov.complete?'fixed':'partial')+'">'+
          (c.scope==='security'?'🛡 ':c.scope==='all'?'📚 ':'')+(cov.complete?'✓ full coverage ':'⚠ ')+cov.matched+'/'+cov.total+' '+unit+'</span>' :
          (cov?'<span class="st accepted">no catalog bugs</span>':'');
        var missedBlock = (!isScan && cov && cov.missed && cov.missed.length) ?
          '<details class="clean-more" open><summary style="color:#e5484d">⚠ '+cov.missed.length+' known bug'+(cov.missed.length>1?'s':'')+' NOT addressed</summary><ul class="mini">'+
          cov.missed.map(function(t){return '<li>○ '+esc(t)+'</li>'}).join('')+'</ul></details>' : '';
        // evidence-weighted coverage: of the ground reported "covered", how much was actually
        // inspected (a detector ran, code was read, a test passed) vs merely reasoned/assumed?
        var ev=(cov&&cov.evidence)||null, vPct=(cov&&cov.verifiedPct);
        var evBadge = (cov && cov.total && cov.verified!=null && vPct!=null) ? (function(){
          var cls = vPct>=67?'fixed':(vPct>=25?'partial':'open');
          return '<span class="st '+cls+'" title="how the covered items were verified">🔬 '+cov.verified+'/'+cov.total+' inspected ('+vPct+'%)</span>';
        })() : '';
        var evRow = ev ? (function(){
          var seg=[]; ['detector','code-read','test','reasoned','assumed'].forEach(function(k){ if(ev[k]) seg.push(ev[k]+' '+k); });
          if(!seg.length) return '';
          var verified=(ev.detector||0)+(ev['code-read']||0)+(ev.test||0), claimed=(ev.reasoned||0)+(ev.assumed||0);
          return '<div style="color:var(--muted);font-size:12px">Evidence: '+seg.join(' · ')+
            (claimed&&verified? ' <span style="color:#e5a23d">— '+claimed+' listed but not inspected</span>':'')+'</div>';
        })() : '';
        return '<li class="find"><div class="f-top">'+
            '<span class="appname">'+esc(c.app)+'</span>'+covBadge+evBadge+
            '<span class="st '+stCls+'">security: '+esc(c.securityStatus||'n/a')+'</span>'+
            '<span class="tag">'+esc(fmt(c.ts))+' · '+esc(c.checkedBy||'')+(c.project?' · '+esc(c.project):'')+'</span></div>'+
          '<div class="f-body">'+
            '<div><b>'+ (c.checkedCount||0) +'</b> checked · <b>'+(c.foundCount||0)+'</b> found · <b>'+(c.scanned||0)+'</b> files scanned'+
              (c.sessionId?' &middot; <a href="/story/'+esc(c.sessionId)+'" style="color:#ff6a5a;font-weight:700;text-decoration:none">📖 Story →</a>':'')+
              (c.id?' &middot; <a href="/report?id='+esc(c.id)+(c.sessionId?'&legacy=1':'')+'" style="color:#ff6a5a;font-weight:700;text-decoration:none">📊 '+(c.sessionId?'Coverage':'Full report')+' →</a>':'')+'</div>'+
            evRow+
            missedBlock+
            (foundList?'<div><b>Found:</b><ul class="mini">'+foundList+'</ul></div>':'<div style="color:var(--done,#12a150)">No known bugs found present.</div>')+
            (secList?'<div><b>Security findings:</b><ul class="mini">'+secList+'</ul></div>':'')+
            (c.notes?'<div style="color:var(--muted)">'+esc(c.notes)+'</div>':'')+
            (cleanN?'<details class="clean-more"><summary>'+cleanN+' checked & clean</summary><ul class="mini">'+cleanList+'</ul></details>':'')+
          '</div></li>';
      }).join('');
      var det=document.createElement('details'); det.className='sweep'; det.id='checks';
      det.open = location.hash==='#checks';
      det.innerHTML='<summary><span class="chev">▶</span><span class="appname">✅ Agent check-log</span>'+
          '<span class="count">'+checks.length+' check'+(checks.length>1?'s':'')+'</span></summary>'+
        '<div class="sec-head">Records posted by coding agents that checked a project against this ledger. '+
          'Agents: fetch <code>/AGENT.md</code> and POST to <code>/api/checks</code>. &middot; <a href="AGENT.md">protocol</a></div>'+
        '<ul class="finds">'+rows+'</ul>';
      host.appendChild(det);
      if(location.hash==='#checks') det.scrollIntoView();
    }).catch(function(){});
  })();

  // ---- Agent-submitted new bugs (fetched live from /api/bugs) ----
  (function(){
    var host=$('#submitpanel'); if(!host) return;
    fetch('/api/bugs?limit=200').then(function(r){return r.json()}).then(function(d){
      if(!d || !d.ok || !d.submitted || !d.submitted.length) return;
      var subs=d.submitted;
      kpi.appendChild(kpiEl(subs.length,'agent-submitted'));
      var svo={critical:0,high:1,medium:2,low:3};
      var apps={}; subs.forEach(function(b){(apps[b.app]=apps[b.app]||[]).push(b)});
      var groups=Object.keys(apps).sort(function(a,b){return apps[b].length-apps[a].length}).map(function(app){
        var items=apps[app].sort(function(a,b){return (svo[a.severity]-svo[b.severity])});
        var lis=items.map(function(b){
          return '<li class="find" data-sev="'+esc(b.severity||'medium')+'"><div class="f-top">'+
            '<span class="sev '+esc(b.severity||'medium')+'">'+esc(b.severity||'')+'</span>'+
            '<span class="fid">'+esc(b.kind||'bug')+'/'+esc(b.category||'')+'</span>'+
            '<span class="f-title">'+esc(b.title)+'</span></div>'+
            '<div class="f-body">'+(b.symptom?'<div>'+esc(b.symptom)+'</div>':'')+
            (b.file?'<div class="f-files">'+esc(b.file)+'</div>':'')+
            (b.fix?'<div><b>Fix:</b> '+esc(b.fix)+'</div>':'')+
            (b.project?'<div class="tag">'+esc(b.project)+'</div>':'')+
            (window.BL_shotStrip?window.BL_shotStrip(b.shots):'')+'</div></li>';
        }).join('');
        return '<div class="scan-appgroup" style="padding:6px 8px 0"><div style="font-weight:700;padding:8px 10px 2px">'+esc(app)+' · '+items.length+'</div><ul class="finds">'+lis+'</ul></div>';
      }).join('');
      var det=document.createElement('details'); det.className='sweep';
      det.innerHTML='<summary><span class="chev">▶</span><span class="appname">🧫 Agent-submitted</span>'+
          '<span class="count">'+subs.length+' new · unverified</span></summary>'+
        '<div class="sec-head"><b>New bugs agents found while scanning</b> — proposals to promote into the curated ledger (append-only, never auto-merged).</div>'+
        groups;
      host.appendChild(det);
    }).catch(function(){});
  })();
})();
</script>

  @keyframes lbeat{0%{box-shadow:0 0 0 0 rgba(255,106,90,.55)}70%{box-shadow:0 0 0 9px rgba(255,106,90,0)}100%{box-shadow:0 0 0 0 rgba(255,106,90,0)}}

<script>
  (function(){
    var el=document.getElementById('livebanner');
    function tick(){
      fetch('/api/sessions?active=1&limit=5',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
        var live=(d.sessions||[]).filter(function(s){return s.live;});
        if(live.length){
          var s=live[0];
          el.querySelector('.txt').innerHTML='<b>'+(s.app||'live')+'</b> <span class="cur">'+
            (s.current||'').replace(/[<>&]/g,'')+'</span>'+(live.length>1?' &nbsp;+'+(live.length-1)+' more':'');
          el.classList.add('show');
        } else el.classList.remove('show');
      }).catch(function(){});
    }
    tick(); setInterval(tick, 3000);
  })();
</script>
<script>
/* ---- Add-a-finding panel: log a bug / security issue / optimiser WITH before→after screenshots ---- */
(function(){
  var host=document.getElementById('addpanel'); if(!host) return;
  function esc(s){ return (s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }
  var KEYK='bugledger.key', LASTAPP='bugledger.lastapp';
  var CATS={
    bug:['crash','data-loss','logic','ui','security','performance','race','sync','auth','other'],
    security:['auth','xss','ssrf','secrets','injection','isolation','rate-limit','csrf','other'],
    optimiser:['design-elevation','ux','performance','workflow','architecture','accessibility','copy','conversion','dx','integrity']
  };
  var KLABEL={bug:'🐛 Bug',security:'🛡 Security',optimiser:'✨ Optimiser'};
  var appsSet={}; (window.BUGS||[]).forEach(function(b){ if(b.app) appsSet[b.app]=1; });
  var appList=Object.keys(appsSet).sort();
  var state={ before:null, after:null }; // each: {dataUrl}
  var activeRole='before';

  var det=document.createElement('details'); det.className='addfind'; det.id='addfind';
  det.innerHTML=
    '<summary><span class="chev">▶</span><span>➕ Add a finding</span>'+
      '<span class="sub">bug · security · optimiser — with before → after screenshots</span></summary>'+
    '<form class="addform" autocomplete="off">'+
      '<div class="grid">'+
        '<label>Type<select name="kind">'+Object.keys(KLABEL).map(function(k){return '<option value="'+k+'">'+KLABEL[k]+'</option>';}).join('')+'</select></label>'+
        '<label>App<input name="app" list="addapps" placeholder="e.g. Finished." required></label>'+
        '<label>Category<select name="category"></select></label>'+
        '<label>Severity<select name="severity"><option value="critical">critical</option><option value="high">high</option><option value="medium" selected>medium</option><option value="low">low</option></select></label>'+
      '</div>'+
      '<datalist id="addapps">'+appList.map(function(a){return '<option value="'+esc(a)+'">';}).join('')+'</datalist>'+
      '<label>Title<input name="title" placeholder="Short, specific — e.g. “Search control looks unstyled / low-standard”" required></label>'+
      '<div class="grid">'+
        '<label>Symptom / what’s wrong<textarea name="symptom" placeholder="What the user sees or why it matters"></textarea></label>'+
        '<label>Fix / the elevation<textarea name="fix" placeholder="What fixes it, or the better pattern"></textarea></label>'+
      '</div>'+
      '<label>File · location <span style="font-weight:400;text-transform:none;color:var(--muted)">(optional)</span><input name="file" placeholder="path/to/file.js:120 — or the screen/route"></label>'+
      '<div><label style="margin-bottom:6px">Screenshots — before → after</label>'+
        '<div class="ba-slots">'+
          '<div><div class="drop" data-role="before"><span class="dz-ba before">Before</span><span class="dz-hint">Click, drop, or paste the current state</span><input type="file" accept="image/*" hidden aria-label="Choose a screenshot"></div>'+
            '<input class="cap" data-role="before" value="Before" aria-label="Caption for the before screenshot" style="margin-top:7px;width:100%;font:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;color:inherit"></div>'+
          '<div><div class="drop" data-role="after"><span class="dz-ba after">After</span><span class="dz-hint">Click, drop, or paste the improved state</span><input type="file" accept="image/*" hidden aria-label="Choose a screenshot"></div>'+
            '<input class="cap" data-role="after" value="After" aria-label="Caption for the after screenshot" style="margin-top:7px;width:100%;font:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;color:inherit"></div>'+
        '</div>'+
        '<div style="font-size:11.5px;color:var(--muted);margin-top:6px">A single screenshot is fine too — fill just one. Tip: copy an image and paste (⌘V) into a slot. Max 5MB each; large images are auto-downscaled.</div>'+
      '</div>'+
      '<div class="addrow">'+
        '<button type="submit" class="btn solid">Add to ledger →</button>'+
        '<span class="addmsg"></span>'+
        '<span class="keywrap" style="margin-left:auto">🔑 <input type="password" class="lkey" placeholder="ledger key (once)" title="Stored only in this browser. Needed only if the ledger requires a write key."></span>'+
      '</div>'+
      '<div class="addresult"></div>'+
    '</form>';
  host.appendChild(det);

  var form=det.querySelector('form');
  var kindSel=form.kind, catSel=form.category, appInp=form.app, msg=det.querySelector('.addmsg'), keyInp=det.querySelector('.lkey'), result=det.querySelector('.addresult');
  keyInp.value=localStorage.getItem(KEYK)||'';
  keyInp.addEventListener('change',function(){ localStorage.setItem(KEYK, keyInp.value.trim()); });
  appInp.value=localStorage.getItem(LASTAPP)||'';

  function fillCats(){ var k=kindSel.value; catSel.innerHTML=CATS[k].map(function(c){return '<option value="'+c+'">'+c+'</option>';}).join(''); }
  kindSel.addEventListener('change',fillCats); fillCats();

  function setMsg(t,cls){ msg.textContent=t||''; msg.className='addmsg'+(cls?' '+cls:''); }

  // downscale big images to ≤1600px wide; PNG for fidelity, JPEG fallback if too heavy
  function downscale(dataUrl, cb){
    var img=new Image();
    img.onload=function(){
      var max=1600, w=img.width, h=img.height;
      if(w>max){ h=Math.round(h*max/w); w=max; }
      try{
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        var out=c.toDataURL('image/png');
        if(out.length>3.8*1024*1024) out=c.toDataURL('image/jpeg',0.9);
        cb(out);
      }catch(e){ cb(dataUrl); }
    };
    img.onerror=function(){ cb(dataUrl); };
    img.src=dataUrl;
  }
  function renderSlot(role){
    var dz=det.querySelector('.drop[data-role="'+role+'"]');
    if(state[role]&&state[role].dataUrl){
      dz.classList.add('filled');
      dz.innerHTML='<button type="button" class="dz-clear" title="Remove">×</button><img src="'+state[role].dataUrl+'" alt="'+role+'">';
      dz.querySelector('.dz-clear').addEventListener('click',function(ev){ ev.stopPropagation(); state[role]=null; resetSlot(role); });
    }
  }
  function resetSlot(role){
    var dz=det.querySelector('.drop[data-role="'+role+'"]');
    dz.classList.remove('filled');
    var ba=role==='before'?'Before':'After', hint=role==='before'?'Click, drop, or paste the current state':'Click, drop, or paste the improved state';
    dz.innerHTML='<span class="dz-ba '+role+'">'+ba+'</span><span class="dz-hint">'+hint+'</span><input type="file" accept="image/*" hidden aria-label="Choose a screenshot">';
    wireDrop(dz);
  }
  function readImage(file, role){
    if(!file||!/^image\//.test(file.type)){ setMsg('That’s not an image.','err'); return; }
    var fr=new FileReader();
    fr.onload=function(){ downscale(fr.result,function(out){ state[role]={dataUrl:out}; renderSlot(role); setMsg(''); }); };
    fr.readAsDataURL(file);
  }
  function wireDrop(dz){
    var role=dz.getAttribute('data-role'), inp=dz.querySelector('input[type=file]');
    dz.addEventListener('click',function(){ activeRole=role; if(!dz.classList.contains('filled')) inp.click(); });
    dz.addEventListener('mouseenter',function(){ activeRole=role; });
    inp.addEventListener('change',function(){ if(inp.files&&inp.files[0]) readImage(inp.files[0],role); });
    dz.addEventListener('dragover',function(e){ e.preventDefault(); dz.classList.add('over'); });
    dz.addEventListener('dragleave',function(){ dz.classList.remove('over'); });
    dz.addEventListener('drop',function(e){ e.preventDefault(); dz.classList.remove('over'); activeRole=role;
      var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) readImage(f,role); });
  }
  det.querySelectorAll('.drop').forEach(wireDrop);
  // paste an image straight into the active slot
  det.addEventListener('paste',function(e){
    var items=(e.clipboardData&&e.clipboardData.items)||[];
    for(var i=0;i<items.length;i++){ if(items[i].type&&items[i].type.indexOf('image')===0){
      var role=activeRole||(state.before?'after':'before'); readImage(items[i].getAsFile(),role); e.preventDefault(); return; } }
  });

  form.addEventListener('submit',function(e){
    e.preventDefault();
    var app=appInp.value.trim(), title=form.title.value.trim();
    if(!app){ setMsg('App is required.','err'); appInp.focus(); return; }
    if(!title){ setMsg('Title is required.','err'); form.title.focus(); return; }
    var shots=[];
    ['before','after'].forEach(function(role){
      if(state[role]&&state[role].dataUrl){
        var cap=det.querySelector('.cap[data-role="'+role+'"]').value.trim();
        shots.push({ dataUrl:state[role].dataUrl, caption:cap });
      }
    });
    var payload={ app:app, project:'', kind:kindSel.value, title:title, category:catSel.value,
      severity:form.severity.value, symptom:form.symptom.value.trim(), fix:form.fix.value.trim(),
      file:form.file.value.trim(), submittedBy:'ledger-web', shots:shots };
    var key=keyInp.value.trim(); if(key) localStorage.setItem(KEYK,key); localStorage.setItem(LASTAPP,app);
    var headers={'content-type':'application/json'}; if(key) headers['x-ledger-key']=key;
    var btn=form.querySelector('button[type=submit]'); btn.disabled=true;
    setMsg(shots.length?'Uploading screenshot'+(shots.length>1?'s':'')+' & adding…':'Adding…');
    fetch('/api/bugs',{method:'POST',headers:headers,body:JSON.stringify(payload)})
      .then(function(r){return r.json();})
      .then(function(d){
        btn.disabled=false;
        if(!d||!d.ok){ setMsg((d&&d.error)||'Failed.', 'err'); if(d&&/unauthor/i.test(d.error||'')){ setMsg('Needs a ledger key — paste it in the 🔑 box.','err'); keyInp.focus(); } return; }
        setMsg('Added ✓ — appended to the ledger (append-only).','ok');
        result.innerHTML='<div style="margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)">'+
          '<div style="font-weight:700">'+esc(KLABEL[payload.kind])+' · '+esc(app)+' — '+esc(title)+'</div>'+
          (window.BL_shotStrip?window.BL_shotStrip(d.shots||[]):'')+
          '<div style="font-size:12.5px;color:var(--muted);margin-top:8px">Now in the 🧫 Agent-submitted panel &amp; the <a href="/timeline">🕘 Activity timeline</a>.</div></div>';
        // reset for the next one (keep app + key)
        form.title.value=''; form.symptom.value=''; form.fix.value=''; form.file.value='';
        state.before=null; state.after=null; resetSlot('before'); resetSlot('after');
      })
      .catch(function(err){ btn.disabled=false; setMsg('Network error: '+err,'err'); });
  });
})();
</script>
</body>
