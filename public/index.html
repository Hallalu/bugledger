<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger · Breadledger</title>
<meta name="description" content="Breadledger: every bug, security hole and optimiser ever fixed across the portfolio, in one append-only catalogue. Agents scan a project against all of it, prove coverage, fix what they can and write an itemised scan story.">
<meta property="og:type" content="website">
<meta property="og:title" content="Breadledger — every bug, security hole and optimiser we ever hit, in one append-only catalogue">
<meta property="og:description" content="Agents scan any project against the whole catalogue, prove coverage, fix, and write an itemised scan story.">
<meta property="og:image" content="https://breadledger.coconvo.workers.dev/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/bread.css">
<script src="/bread-shell.js"></script>
<style>
  .cat.ux{--c:#0e7490}
  .views{display:none;overflow:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px}
  .views::-webkit-scrollbar{display:none}
  .views .seg{display:inline-flex;min-width:max-content}
  @media (max-width:900px){.views{display:block}}
  .view-head{display:grid;gap:10px;margin-bottom:12px}
  .view-head .card-b{display:grid;gap:10px}
  .tally{display:flex;gap:6px;flex-wrap:wrap}
  .clean-list{display:grid;gap:6px;font-size:14.5px;color:var(--ink-2)}
  .clean-list span{display:flex;gap:8px;align-items:flex-start}
  .clean-list svg{width:16px;height:16px;color:var(--ok);flex:0 0 auto;margin-top:3px}
  .prog-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .prog-row .progress{flex:1;min-width:160px}
  .prog-row .num{font-size:13.5px;color:var(--ink-3);white-space:nowrap}
  .bl-row .side .det{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);white-space:nowrap}
  .bl-row .side .file{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cov-ok{color:var(--ok-ink)} .cov-warn{color:var(--warn-ink)}
  .peek .badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .peek .filebtn{font-family:var(--mono);font-size:12.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .peek ul.plain{margin:0;padding:0 0 0 18px;display:grid;gap:4px;font-size:14.5px;color:var(--ink-2)}
  .peek ul.plain li::marker{color:var(--ink-3)}
  .peek .linkrow{display:flex;gap:8px;flex-wrap:wrap}
  .peek .excerpt{font-size:12.5px;white-space:pre-wrap;word-break:break-all}
  .evi{display:flex;gap:6px;flex-wrap:wrap}
  .nf-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .nf-grid .span2{grid-column:1/-1}
  @media (max-width:560px){.nf-grid{grid-template-columns:1fr}}
  .nf-slots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:560px){.nf-slots{grid-template-columns:1fr}}
  .nf-slot{display:grid;gap:6px}
  .nf-slot .drop{min-height:136px}
  .nf-slot .drop input[type=file]{display:none}
  .nf-slot .cap{height:30px;font-size:13.5px}
  .live-note{margin-bottom:14px}
  .live-note .btn{margin-left:auto}
  .foot-meta{margin-top:22px;font-size:13px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .foot-meta a{color:var(--ink-2)}
  .help-body p{font-size:14.5px;color:var(--ink-2);line-height:1.55}
  .help-body .big{font-size:28px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  @media print{.stats,.views,.filters,.live-note,.page-h .actions{display:none!important} .group-h{position:static}}
</style>
</head>
<body>
<div class="bl-app" id="app">
  <aside class="bl-side" id="side" aria-label="Sidebar"></aside>
  <div class="bl-main">
    <header class="bl-top" id="top"></header>
    <main class="bl-content" id="page">
      <div class="page-h">
        <div class="grow">
          <h1 id="h1">Ledger</h1>
          <p class="lead" id="lead">Every bug, security hole and optimiser ever fixed across the portfolio, in one append-only catalogue. Tick items as you re-verify them; ticks are saved in this browser.</p>
        </div>
      </div>
      <div class="note info live-note" id="livenote" hidden></div>
      <div class="stats" id="stats" aria-label="Catalogue totals"></div>
      <div class="views" id="views"></div>
      <div id="viewhead"></div>
      <div class="filters" id="filters">
        <div class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input class="input" id="q" type="search" data-search placeholder="Search the ledger" title="Words, &quot;phrases&quot;, -not, and app: cat: sev: is:open prefixes" autocomplete="off" aria-label="Search the ledger"><button class="btn icon mic-in" type="button" data-voice="q" aria-label="Search by voice" title="Search by voice"></button></div>
        <select class="select" id="fApp" aria-label="Filter by app"><option value="">All apps</option></select>
        <select class="select" id="fCat" aria-label="Filter by type"><option value="">All types</option></select>
        <select class="select" id="fSev" aria-label="Filter by severity" title="Severity is the item's own, or derived from its impact category"><option value="">All severities</option><option value="critical">Critical</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select>
        <label class="check" id="onlyOpenWrap"><input type="checkbox" class="cbx" id="onlyOpen"> Only unchecked</label>
        <div class="btn-group"><button class="btn sm" type="button" id="expand">Expand all</button><button class="btn sm" type="button" id="collapse">Collapse all</button></div>
        <span class="count" id="count"></span>
      </div>
      <div class="active-filters" id="activef" hidden></div>
      <div class="list" id="list"></div>
      <div class="foot-meta" id="foot"></div>
    </main>
  </div>
</div>

<script src="data-sec.js"></script>
<script src="data-opt.js"></script>
<script src="data-scan.js"></script>
<script src="data-harvest.js"></script>
<script src="data.js?v=3"></script>
<script>

  var SEVORD = { critical: 0, high: 1, medium: 2, low: 3, info: 4 };
