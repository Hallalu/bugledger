<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story · Breadledger</title>
<meta name="description" content="An itemised, severity-tagged report of one scan: what was found, why it matters, what was done, how the project is better now, and how it compares to last time.">
<meta property="og:type" content="website">
<meta property="og:title" content="Breadledger · Scan story">
<meta property="og:description" content="An itemised, severity-tagged report of one scan: what was found, why it matters, what was done, how the project is better now, and how it compares to last time.">
<meta property="og:image" content="https://bugledger.coconvo.workers.dev/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/bread.css">
<script src="/bread-shell.js"></script>
<style>
  /* Story / report page — page-only styles, tokens only. Candidates for bread.css are marked "promote". */
  #report{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}   /* minmax(0,…): a wide child never widens the column */
  #report>*{min-width:0}
  #report .stats{margin-bottom:0}
  .panel{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
  .panel>*{min-width:0}
  .panel .section-h{margin:0;flex-wrap:wrap}
  .lead{font-size:14.5px;color:var(--ink-2);max-width:72ch}
  .lead b{color:var(--ink);font-weight:600}
  .foot{margin-top:28px;text-align:center;font-size:13px;color:var(--ink-3)}
  .foot a{color:var(--accent-text)}
  .bl-top .crumbs .sep{color:var(--ink-3)}   /* promote to bread.css: the shell's --line-2 separator measures 1.6:1 */

  /* hero */
  .hero{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
  .hero .txt{flex:1;min-width:260px;display:grid;gap:9px;justify-items:start}
  .hero h1{font-size:24px;letter-spacing:-.02em}
  .hero h2{font-size:18px}
  .hero .proj{color:var(--ink-3);font-weight:500}
  .hero .sub{font-size:14.5px;color:var(--ink-2)}
  .hero .when{font-size:13.5px;color:var(--ink-3)}
  .hero .when b{color:var(--ink);font-weight:600}
  .hero-card .stats{margin:18px 0 0}
  .donutwrap{flex:0 0 auto;text-align:center;cursor:help;border-radius:var(--r-2)}
  .donutwrap .dl{font-size:13px;color:var(--ink-3);font-weight:500;margin-top:2px}
  .note.verdict{font-size:15px;font-weight:600;width:100%;align-items:flex-start}
  .note.verdict svg{margin-top:2px}
  .note .stack{min-width:0}
  .summary{display:flex;gap:8px;flex-wrap:wrap}
  .summary .n{font-weight:650;color:var(--ink)}
  .chip[aria-pressed="true"],.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-soft-ink)}
  .chip[aria-pressed="true"] .n,.chip.on .n{color:inherit}
  .chip.ok{color:var(--ok-ink);border-color:var(--ok)}                     /* promote: a positive chip */
  .chip svg,.badge svg{width:13px;height:13px;flex:0 0 auto}
  .badge .sev{width:14px;height:14px;margin-left:-3px}
  .badge[data-tip],.tags .badge{height:24px}                                /* a focusable badge is a 24-px target */
  .sev.info i{background:var(--ink-3)}                                       /* promote: info severity dot */
  .stat.static{cursor:default}
  .stat.static:hover{transform:none;border-color:var(--line)}
  .stat.warn .n{color:var(--danger-ink)} .stat.good .n{color:var(--ok-ink)} .stat.fixed .n{color:var(--info-ink)} .stat.gray .n{color:var(--ink-3)}
  .donut text{font-family:var(--font)}

  /* what this means for you */
  .tier{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start}
  .tier .ico{width:28px;height:28px;border-radius:50%;background:var(--bg-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
  .tier .ico svg{width:14px;height:14px}
  .tier .ico.ok{background:var(--ok-soft);color:var(--ok-ink);border-color:transparent}
  .tier .ico.warn{background:var(--warn-soft);color:var(--warn-ink);border-color:transparent}
  .tier .ico.info{background:var(--info-soft);color:var(--info-ink);border-color:transparent}
  .tier .ico.accent{background:var(--accent-soft);color:var(--accent-soft-ink);border-color:transparent}
  .tier .ico.critical{background:var(--sev-critical-soft);border-color:transparent} .tier .ico.high{background:var(--sev-high-soft);border-color:transparent}
  .tier .ico.medium{background:var(--sev-medium-soft);border-color:transparent} .tier .ico.low{background:var(--sev-low-soft);border-color:transparent}
  .tier .fact .k{text-transform:none;letter-spacing:0;font-size:15px;color:var(--ink);font-weight:600}
  .tier .fact .v{font-size:14.5px;color:var(--ink-2)}
  .tier.critical .fact .k{color:var(--sev-critical-ink)} .tier.high .fact .k{color:var(--sev-high-ink)} .tier.medium .fact .k{color:var(--sev-medium-ink)} .tier.low .fact .k{color:var(--sev-low-ink)}
  .note.progress-line{margin-top:4px}
  .note.progress-line a{color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px}

  /* better since the scan */
  .metrics{display:grid;gap:10px}
  .mrow{display:grid;grid-template-columns:minmax(140px,1.2fr) auto minmax(110px,1fr);gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-2);background:var(--panel-2)}
  .mrow .lab{font-weight:600;min-width:0;overflow-wrap:anywhere}
  .mrow .vals{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
  .mrow .vals>svg{width:14px;height:14px;color:var(--ink-3)}
  .mrow .v{font-weight:650}
  .mrow .v.before{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2);font-weight:500}
  .track{height:10px;border-radius:99px;background:var(--bg-2);border:1px solid var(--line);overflow:hidden;position:relative;min-width:110px}
  .track>i{display:block;height:100%;border-radius:99px;position:absolute;left:0;top:0}
  .track>i.was{background:var(--line-2)} .track>i.now{background:var(--ok)}
  @media (max-width:640px){.mrow{grid-template-columns:1fr}.track{width:100%}}

  /* tabs — sticky under the top bar; old hash names kept */
  .tabbar{position:sticky;top:var(--topbar);z-index:20;min-width:0;max-width:100%;margin:0 -4px;padding:8px 4px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .tabbar .seg{display:inline-flex;max-width:100%;overflow-x:auto;scrollbar-width:none}
  .tabbar .seg::-webkit-scrollbar{display:none}
  .tabbar .seg button{flex:0 0 auto;height:32px}
  .seg .n{color:var(--ink-3);font-weight:500;font-variant-numeric:tabular-nums}
  .seg .on .n{color:var(--ink-2)}
  .table th{position:static}

  /* findings */
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .fgroups{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
  .fgroups .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .fgroups .lab{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-right:2px}
  .finds{list-style:none;margin:0;padding:0;counter-reset:f}
  .find+.find{border-top:1px solid var(--line)}
  .find{box-shadow:inset 3px 0 0 var(--line-2)}
  .find.critical{box-shadow:inset 3px 0 0 var(--sev-critical)} .find.high{box-shadow:inset 3px 0 0 var(--sev-high)}
  .find.medium{box-shadow:inset 3px 0 0 var(--sev-medium)} .find.low{box-shadow:inset 3px 0 0 var(--sev-low)}
  .find.st-false-positive .t{color:var(--ink-2)}
  .find .head{grid-template-columns:auto auto minmax(0,1fr) auto;align-items:start;padding:12px 14px;border-top:0}
  .find .num{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:22px;line-height:1.45;padding-top:1px}
  .find .num::before{content:counter(f) ".";counter-increment:f}
  .find .head>.sev{margin-top:2px}
  .find .tw{min-width:0;display:grid;gap:7px}
  .find .t{white-space:normal;overflow:visible;text-overflow:clip;font-weight:600}
  .find .tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0;max-width:100%}
  .find .file{max-width:100%;font-family:var(--mono);font-size:12.5px;font-weight:500;padding:0 7px;color:var(--ink-2)}
  .find .file .truncate{min-width:0}
  .find .tags .badge.phase{max-width:100%}
  .find .tags .badge.phase .truncate{min-width:0}
  .find .chev{color:var(--ink-3);transition:transform var(--t-fast);display:flex;margin-top:3px}
  .find .chev svg{width:16px;height:16px}
  .find[data-open="false"] .chev{transform:rotate(-90deg)}
  .find .body{padding:0 14px 14px 72px;display:grid;gap:12px}
  .find[data-open="false"] .body{display:none}
  .find .kv{grid-template-columns:130px minmax(0,1fr)}
  .find .kv dd{white-space:pre-wrap}
  .find .kv dd.fixv,.find .kv dd.recv{display:flex;gap:6px;align-items:flex-start}
  .find .kv dd svg{width:15px;height:15px;flex:0 0 auto;margin-top:3px}
  .find .kv dd.fixv{color:var(--info-ink)}
  .find .kv dd.recv svg{color:var(--ink-3)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  @media (max-width:900px){.find .head{grid-template-columns:auto auto minmax(0,1fr) auto}.find .body{padding-left:14px}.find .kv{grid-template-columns:1fr}}

  /* story timeline */
  .tl>.day-h:first-child{margin-top:0}
  .day-h .meta{text-transform:none;letter-spacing:0;font-weight:500}
  .ph-d{font-size:13.5px;color:var(--ink-3);margin:-4px 0 6px}
  .ev .ico.critical{background:var(--sev-critical-soft);border-color:transparent} .ev .ico.high{background:var(--sev-high-soft);border-color:transparent}
  .ev .ico.medium{background:var(--sev-medium-soft);border-color:transparent} .ev .ico.low{background:var(--sev-low-soft);border-color:transparent}
  .ev .ico.info-sev{background:var(--bg-2)}
  .ev .line .badge{height:22px}
  .ev .line code{font-size:12.5px}
  .ev .txt.fixv{display:flex;gap:6px;align-items:flex-start;color:var(--info-ink)}
  .ev .txt.fixv svg{width:15px;height:15px;flex:0 0 auto;margin-top:3px}
  .ev .mv{font-weight:650;color:var(--accent-text)}
  .ev.verdict .line .who{font-size:15px}

  /* lists used by Added, Clean, Present */
  .rows{list-style:none;margin:0;padding:0}
  .row-item{padding:12px 14px;display:grid;gap:6px}
  .row-item+.row-item{border-top:1px solid var(--line)}
  .row-item .line{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;min-width:0}
  .row-item .line b{font-weight:600}
  .row-item .line code{font-size:12.5px;overflow-wrap:anywhere}
  .row-item .txt{font-size:14.5px;color:var(--ink-2);overflow-wrap:anywhere}
  .sub-h{font-size:13px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin:0}
  details.clean-all summary{display:flex;align-items:center;gap:8px;padding:12px 16px;cursor:pointer;font-weight:600;list-style:none;border-radius:var(--r-2)}
  details.clean-all summary::-webkit-details-marker{display:none}
  details.clean-all summary svg{width:16px;height:16px;color:var(--ink-3);transition:transform var(--t-fast)}
  details.clean-all[open] summary svg{transform:rotate(180deg)}
  .mini{list-style:none;margin:0;padding:0 16px 14px;columns:2;column-gap:20px;font-size:13.5px}
  .mini li{color:var(--ink-2);break-inside:avoid;padding:2px 0 2px 18px;position:relative;overflow-wrap:anywhere}
  .mini li::before{content:"✓";position:absolute;left:0;top:2px;color:var(--ok-ink);font-weight:600}
  .mini.new li::before{content:"+";color:var(--warn-ink)}
  .mini.one{columns:1;padding:4px 0 0}
  @media (max-width:600px){.mini{columns:1}}

  /* scan history */
  .hist{list-style:none;margin:0;padding:0}
  .histrow+.histrow{border-top:1px solid var(--line)}
  a.hrow{color:inherit;text-decoration:none}
  a.hrow:hover{text-decoration:none}
  .hrow{grid-template-columns:auto minmax(0,1fr) auto;align-items:start;padding:12px 14px;border-top:0}
  .histrow.cur .hrow{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent);cursor:default}
  .hwhen{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:3px;min-width:96px}
  .hmain{min-width:0;display:grid;gap:5px}
  .hrow .t{white-space:normal;overflow:visible;text-overflow:clip;font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .hsub{font-size:14px;overflow-wrap:anywhere}
  .hsub.ok{color:var(--ok-ink)} .hsub.warn{color:var(--warn-ink)}
  .hbadges{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .hd{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  .hgo{font-size:13.5px;font-weight:600;color:var(--accent-text);white-space:nowrap;padding-top:3px}
  .hgo.muted{color:var(--ink-3)}
  @media (max-width:600px){.hrow{grid-template-columns:minmax(0,1fr) auto}.hwhen{grid-column:1/-1;min-width:0;padding-top:0}}

  /* legend */
  .legend .kv{grid-template-columns:160px minmax(0,1fr)}
  .legend .kv dd .muted{color:var(--ink-3)}
  @media (max-width:900px){.legend .kv{grid-template-columns:1fr}}

  /* legacy coverage record */
  .bars{display:grid;gap:8px}
  .barrow{display:grid;grid-template-columns:130px minmax(0,1fr) 48px;align-items:center;gap:10px;font-size:13.5px}
  .barrow .lab{color:var(--ink-2);text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .barrow .v{text-align:right;color:var(--ink-3)}
  @media (max-width:480px){.barrow{grid-template-columns:100px minmax(0,1fr) 40px}}
  .cmp{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .cmp>svg{width:22px;height:22px;color:var(--ink-3)}
  .cmp .big{font-size:28px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .twocol b{font-weight:600}
  @media (max-width:620px){.twocol{grid-template-columns:1fr}}
  .trend{display:block;width:100%;height:auto;max-width:100%}

  /* tooltip — every colour tag explains itself in words (hover + keyboard focus) */
  [data-tip]{cursor:help}
  .tip{position:fixed;z-index:50;max-width:320px;padding:10px 12px;border-radius:var(--r-2);background:var(--panel);color:var(--ink-2);border:1px solid var(--line);box-shadow:var(--shadow-3);font-size:13.5px;line-height:1.45;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity var(--t-fast),transform var(--t-fast)}
  .tip.show{opacity:1;transform:none}
  .tip b{display:block;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
  .tip .do{display:block;font-weight:600;color:var(--ink);margin-bottom:2px}

  @media (max-width:600px){.hero{flex-direction:column}}
  @media (pointer:coarse){input,select,textarea{font-size:16px}}   /* iOS: no focus zoom */
  @media print{
    .tabbar,.toolbar,.fgroups,.actions,.tip,.foot,.toasts,.chev{display:none!important}
    .panel[hidden]{display:grid!important}
    .find[data-open="false"] .body{display:grid!important}
    .card,.list,.ev,.find{box-shadow:none;break-inside:avoid}
    .panel::before{content:attr(data-title);display:block;font-weight:650;font-size:18px;margin:18px 0 6px}
  }
  ul.plain{margin:4px 0 8px;padding:0 0 0 18px;display:grid;gap:4px} ul.plain li::marker{color:var(--ink-3)}
</style>
</head>
<body>
<div class="bl-app" id="app">
  <aside class="bl-side" id="side" aria-label="Sidebar"></aside>
  <div class="bl-main">
    <header class="bl-top" id="top"></header>
    <main class="bl-content narrow" id="page">
      <div id="report"><div class="card"><div class="empty"><b>Loading…</b></div></div></div>
      <p class="foot">Append-only scan report · a permanent record of what was checked, what was found, what was done, and how the project is better now. · <a href="/AGENT.md">agent protocol</a> · <a href="/admin">admin</a></p>
    </main>
  </div>
</div>
<div class="tip" id="tip" role="tooltip" hidden></div>
<script>
  var $=Bread.$, $$=Bread.$$, esc=Bread.esc, icon=Bread.icon;
  var q=new URLSearchParams(location.search);
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function p2(n){return('0'+n).slice(-2)}
  function fullts(ts){var d=new Date(ts);return DAYS[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()+', '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());}
  function shortts(ts){var d=new Date(ts);return d.getDate()+' '+MON[d.getMonth()]+', '+p2(d.getHours())+':'+p2(d.getMinutes());}
  function hms(ts){var d=new Date(ts);return p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());}
  function dur(ms){var s=Math.max(0,Math.round(ms/1000));if(s<60)return s+'s';var m=Math.floor(s/60);if(m<60)return m+'m '+(s%60)+'s';var h=Math.floor(m/60);return h+'h '+(m%60)+'m';}
  function norm(t){return String(t||'').toLowerCase().replace(/[^a-z0-9]+/g,'');}
  function toast(msg,kind){Bread.toast(msg,kind||'ok');}
  function copy(text,msg){ (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(function(){toast(msg||'Copied')}).catch(function(){
    var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('aria-hidden','true');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(msg||'Copied')}catch(e){toast('Could not copy','err')}ta.remove();}); }

  Bread.mount({ active:'activity', title:'Story', crumbs:['Activity','Story'],
    actions:'<button class="btn" type="button" id="copyMd" hidden aria-label="Copy as Markdown" title="Copy as Markdown">'+icon('copy')+'<span class="lbl">Copy as Markdown</span></button>'+
            '<button class="btn" type="button" id="printBtn" hidden aria-label="Print / PDF" title="Print / PDF">'+icon('print')+'<span class="lbl">Print / PDF</span></button>' });

  // `ic` (emoji) is used only in the copied Markdown; on screen severity is a dot + text + colour, status an icon + text.
  var SEV={critical:{ic:'🟣',lbl:'Critical',do:'Fix now — beyond red',why:'Could expose data, break sign-in or take the app down for real users.'},
           high:{ic:'🔴',lbl:'High',do:'Fix before the next release',why:'A real user hits this in normal use, or it is a security weakness an attacker could use.'},
           medium:{ic:'🟠',lbl:'Medium',do:'Schedule it',why:'Degrades the experience for some users — accessibility, wrong dates, silent failures.'},
           low:{ic:'🟡',lbl:'Low',do:'Polish when convenient',why:'Cosmetic or best-practice; no user is blocked.'},
           info:{ic:'⚪',lbl:'Info',do:'For your awareness',why:'A note, a clean check or context — nothing to fix.'}};
  var SEVORDER=['critical','high','medium','low','info'];
  var ST={fixed:{ic:'🔵',lbl:'Fixed',icon:'check',tone:'info'},applied:{ic:'🔵',lbl:'Applied',icon:'check',tone:'info'},open:{ic:'◌',lbl:'Open',icon:'alert',tone:'danger'},'needs-call':{ic:'⚑',lbl:'Needs your call',icon:'info',tone:'warn'},
          'false-positive':{ic:'⊘',lbl:'False alarm',icon:'x',tone:''},recommended:{ic:'★',lbl:'Recommended',icon:'sparkles',tone:'accent'},wontfix:{ic:'—',lbl:'Won’t fix',icon:'x',tone:''},clean:{ic:'🟢',lbl:'Clean',icon:'checkcircle',tone:'ok'}};
  var EV={detector:'detector ran','code-read':'code read',test:'test passed',reasoned:'reasoned',assumed:'assumed'};
  var EVICO={detector:'scan','code-read':'eye',test:'checkcircle',reasoned:'info',assumed:'alert'};
  var STTIP={fixed:'Blue = done during the scan. The change is made and described — nothing for you to do.',applied:'This upgrade was applied during the scan.',open:'Real and not yet fixed. Use “copy fix prompt” to hand it to an agent.','needs-call':'A decision only you can make — wording, policy or a destructive change. The agent explains and recommends; you decide.','false-positive':'The scanner flagged it; the agent read the code and ruled it out. Kept so you can see the reasoning.',recommended:'An optimiser (a reusable upgrade) this project would benefit from — not a bug.',wontfix:'Judged not worth changing, with the reason given.',clean:'Checked and nothing found.'};
  var EVTIP={detector:'A static check fired — deterministic, but only a lead until someone reads the line.','code-read':'The agent opened the file and confirmed it — the strongest everyday evidence.',test:'Proven by running a test.',reasoned:'Inferred, not inspected — treat as a claim.',assumed:'Assumed without checking — the weakest evidence.'};
  function tipAttr(head,doTxt,why){return ' tabindex="0" data-tip="'+esc(JSON.stringify({h:head,d:doTxt||'',w:why||''}))+'"';}
  function sevDot(s){return '<span class="sev '+esc(s)+'"><i></i></span>';}
  function sevPill(s){s=SEV[s]?s:'info';return '<span class="badge '+(s==='info'?'':s)+'"'+tipAttr(SEV[s].lbl+' severity',SEV[s].do,SEV[s].why)+'>'+sevDot(s)+SEV[s].lbl+'</span>';}
  function stPill(s){var o=ST[s]||ST.open;return '<span class="badge '+o.tone+' st-'+esc(s||'open')+'"'+tipAttr(o.lbl,'',STTIP[s]||STTIP.open)+'>'+icon(o.icon)+o.lbl+'</span>';}
  function evChip(v){return '<span class="badge outline"'+tipAttr('Evidence: '+(EV[v]||v),'',EVTIP[v]||'')+'>'+icon(EVICO[v]||'info')+esc(EV[v]||v)+'</span>';}

  // ---------- loading ----------
  function getJSON(url,fallback,tries){
    tries=tries||0;
    return fetch(url,{cache:'no-store'}).then(function(r){ if(r.status===404) return r.json().catch(function(){return {ok:false}}); if(!r.ok) throw new Error(r.status); return r.json(); })   // a 404 is an answer ("not found"), not a dropped connection
      .catch(function(){ return tries<2 ? new Promise(function(res){setTimeout(function(){res(getJSON(url,fallback,tries+1));},400*(tries+1));}) : fallback; });
  }
  var pathStory=/^\/story\/([^/?#]+)/.exec(location.pathname);
  var SESSION=q.get('session')||(pathStory&&decodeURIComponent(pathStory[1]));
  function setCrumb(t){ var c=$('#top .crumbs span:last-child'); if(c) c.textContent=t; }
  function load(){
    if(SESSION){
      Promise.all([getJSON('/api/story?id='+encodeURIComponent(SESSION),null),getJSON('/api/checks?limit=200',{checks:[]}),getJSON('/checklist.json',{apps:{}}),getJSON('/api/bugs?limit=200',{submitted:[]})])
        .then(function(res){
          if(!res[0]||!res[0].ok){ notFound(!res[0]); return; }
          renderStory(res[0],(res[1]&&res[1].checks)||[],res[2]||{apps:{}},(res[3]&&res[3].submitted)||[]);
        }).catch(function(e){ console.error(e); notFound(true); });
      return;
    }
    Promise.all([getJSON('/api/checks?limit=200',{checks:[]}),getJSON('/checklist.json',{apps:{}}),getJSON('/api/bugs?limit=200',{submitted:[]})]).then(function(res){
      var checks=(res[0]&&res[0].checks)||[], cat=res[1]||{apps:{}}, submitted=(res[2]&&res[2].submitted)||[];
      var id=q.get('id'), app=q.get('app'), project=q.get('project');
      var c = id ? checks.find(function(x){return x.id===id})
        : checks.filter(function(x){return (!app||x.app===app)&&(!project||x.project===project)}).sort(function(a,b){return b.ts-a.ts})[0];
      if(!c){ notFound(!checks.length); return; }
      // a check that belongs to a story → show the story (it contains this check) unless ?legacy=1
      if(c.sessionId && !q.get('legacy')){ SESSION=c.sessionId; history.replaceState(null,'','/story/'+c.sessionId); load(); return; }
      var html='<div class="note warn">'+icon('bug')+'<span>Coverage record only — this sweep was logged before scan stories existed, so there is no narrative for it. <a href="/timeline">See newer sweeps →</a></span></div>';
      html+=renderCheck(c,checks,cat,submitted,{standalone:true});
      document.title='Report · '+c.app+' · Breadledger'; setCrumb('Report');
      $('#report').innerHTML=html;
    });
  }
  function notFound(lost){
    $('#report').innerHTML='<div class="card pad"><div class="note danger">'+icon('alert')+'<div class="stack" style="gap:8px"><b>'+(lost?'Couldn’t load the report':'Report not found')+'</b><span>'+(lost?'The connection dropped while loading.':'This sweep may have been pruned.')+'</span>'+
      '<div class="actions"><button class="btn sm" type="button" id="retry">'+icon('reset')+'Retry</button><a class="btn sm ghost" href="/timeline">'+icon('activity')+'Activity</a></div></div></div></div>';
    var rt=document.getElementById('retry'); if(rt) rt.onclick=function(){ $('#report').innerHTML='<div class="card">'+Bread.empty('Loading…','','file')+'</div>'; load(); };
  }
  load();

  // ---------- story ----------
  var DATA=null, FINDS=[], CTX={checks:[],cat:{apps:{}},submitted:[]}, KEEP={q:''};
  function resolveFindings(events){
    var finds=events.filter(function(e){return e.kind==='found'}).map(function(f){return Object.assign({},f)});
    var byId={},byTitle={};
    finds.forEach(function(f){byId[f.id]=f;byTitle[norm(f.title)]=f.id});
    events.forEach(function(e){ if(e.kind!=='fixed')return; var id=(e.ref&&byId[e.ref])?e.ref:byTitle[norm(e.title)]; var f=id&&byId[id]; if(!f)return;
      f.status=e.status||'fixed'; if(e.fix)f.fix=e.fix; if(e.file&&!f.file)f.file=e.file; f.fixedAt=e.ts; });
    return finds;
  }
  function pct(a,b){ if(!a) return null; return Math.round((a-b)/a*100); }
  function isNum(v){return v!=null&&v!==''&&!isNaN(parseFloat(String(v).replace(/[^0-9.\-]/g,'')));}
  function numOf(v){return parseFloat(String(v).replace(/[^0-9.\-]/g,''));}
  function tierRow(ico,tone,head,text){return '<div class="tier '+tone+'"><span class="ico '+tone+'">'+ico+'</span><div class="fact"><div class="k">'+head+'</div><div class="v">'+text+'</div></div></div>';}

  function renderStory(d,allChecks,cat,allSubmitted){
    DATA=d; CTX={checks:allChecks,cat:cat,submitted:allSubmitted};
    var s=d.session, events=d.events||[], checks=d.checks||[], adds=d.additions||[];
    if(!adds.length) adds=allSubmitted.filter(function(x){return x.app===s.app && x.ts>=s.started-60000 && x.ts<=s.updated+30*60000;});
    var finds=resolveFindings(events);
    finds.sort(function(a,b){return SEVORDER.indexOf(a.severity||'info')-SEVORDER.indexOf(b.severity||'info')||a.ts-b.ts});
    FINDS=finds;
    var real=finds.filter(function(f){return f.status!=='false-positive'});
    var bySev={},byStatus={},byCat={};
    finds.forEach(function(f){var sv=f.severity||'info';bySev[sv]=(bySev[sv]||0)+1;var st=f.status||'open';byStatus[st]=(byStatus[st]||0)+1;if(f.category)byCat[f.category]=(byCat[f.category]||0)+1;});
    var fixedN=(byStatus.fixed||0)+(byStatus.applied||0), needN=byStatus['needs-call']||0, openN=byStatus.open||0, fpN=byStatus['false-positive']||0, recN=byStatus.recommended||0;
    var cleans=events.filter(function(e){return e.kind==='clean'});
    var metrics=(function(){ var by={}; events.filter(function(e){return e.kind==='metric'}).forEach(function(e){by[norm(e.title)]=e}); return Object.keys(by).map(function(k){return by[k]}); })();   // same label posted twice → the latest wins
    var caveats=(function(){ var all=events.filter(function(e){return e.kind==='caveat'}); return all.filter(function(e,i){ var t=fullText(e).replace(/…$/,''); return !all.some(function(o,j){return j>i&&fullText(o).indexOf(t.slice(0,80))===0&&fullText(o).length>t.length}); }); })();   // a trimmed caveat re-posted in full shows once
    var verdictEv=events.slice().reverse().find(function(e){return e.kind==='verdict'});
    var phases=events.filter(function(e){return e.kind==='phase'});
    var done=s.status==='done';
    var headline=checks.slice().sort(function(a,b){var r={full:0,all:1,security:2,optimisers:3};return (r[a.scope]==null?9:r[a.scope])-(r[b.scope]==null?9:r[b.scope])||b.ts-a.ts})[0];
    var scanned=Math.max.apply(null,[0].concat(checks.map(function(c){return c.scanned||0})));
    var itemsChecked=headline&&headline.coverage&&headline.coverage.total>0?headline.coverage.total:null;   // a 0-item catalogue match is "no coverage", not "0 checked"
    var inspected=itemsChecked&&headline.coverage.verified!=null?headline.coverage.verified:null;

    // a session with no story lines at all (it predates scan stories, or the agent never narrated) must not read as "clean"
    var noStory=!events.length;
    // verdict
    var vtxt=noStory?(done?'No story was recorded for this session — it predates scan stories or the agent did not narrate. Coverage records, if any, are under Coverage.':'Waiting for the first story line…'):verdictEv?fullText(verdictEv):(real.length?(fixedN+' fixed'+(needN?', '+needN+' for your call':'')+(openN?', '+openN+' open':'')+(fpN?', '+fpN+' false alarm'+(fpN>1?'s':'')+' verified':'')):(done?'Clean — nothing from the ledger is present in this project':'Scan in progress'));
    var vcls=noStory?'warn':(openN||(bySev.critical&&!fixedN))?'warn':(real.length&&!openN&&!needN?'ok':(real.length?'warn':'ok'));

      ? '<div class="donutwrap" data-tip="'+esc(JSON.stringify({h:'Coverage '+headline.coverage.matched+'/'+headline.coverage.total,d:scopeLabel(headline.scope),w:'How much of the ledger catalogue this scan checked, verified by the server. Full detail under Coverage.'}))+'" tabindex="0">'+donut(headline.coverage.matched,headline.coverage.total,'var(--ok)')+'<div class="dl">coverage · '+esc(scopeLabel(headline.scope))+'</div></div>'
      : (real.length ? '<div class="donutwrap" data-tip="'+esc(JSON.stringify({h:'Resolved '+fixedN+'/'+real.length,d:'real issues fixed during the scan',w:'The share of real issues (false alarms excluded) already fixed. The rest are open or waiting on your call.'}))+'" tabindex="0">'+donut(fixedN,real.length,'var(--info)')+'<div class="dl">resolved</div></div>' : '');
    html+='<div class="card pad hero-card"><div class="hero">'+donutHtml+'<div class="txt">'+
      '<span class="badge accent">'+icon('file')+'Scan story'+(done?'':' · live <span class="pip live"></span>')+'</span>'+
      '<h1>'+esc(s.app)+(s.project&&norm(s.project)!==norm(s.app)?' <span class="proj">· '+esc(s.project)+'</span>':'')+'</h1>'+
      (s.title?'<div class="sub">'+esc(s.title)+'</div>':'')+
      '<div class="when">'+fullts(s.started)+' · <b>'+dur((s.updated||Date.now())-s.started)+'</b>'+(done?'':' so far')+' · by '+esc(s.agent||'agent')+(scanned?' · '+scanned+' files read':'')+(phases.length?' · '+phases.length+' phases':'')+' · '+events.length+' story lines</div>'+
      '<div class="note '+vcls+' verdict">'+icon(vcls==='ok'?'checkcircle':'alert')+'<span>'+esc(vtxt)+'</span></div>'+
      '<div class="summary" role="group" aria-label="Filter findings by severity or status">'+
        SEVORDER.filter(function(k){return bySev[k]}).map(function(k){return '<button class="chip" type="button" data-filter="sev:'+k+'" aria-pressed="false" data-tip="'+esc(JSON.stringify({h:SEV[k].lbl+' · '+bySev[k],d:SEV[k].do,w:SEV[k].why+' Click to show only these.'}))+'">'+sevDot(k)+'<span class="n">'+bySev[k]+'</span> '+SEV[k].lbl.toLowerCase()+'</button>'}).join('')+
        (fixedN?'<button class="chip" type="button" data-filter="st:fixed" aria-pressed="false" data-tip="'+esc(JSON.stringify({h:'Fixed · '+fixedN,d:'Nothing for you to do',w:'Done during the scan; each one says what was changed. Click to show only these.'}))+'">'+icon('check')+'<span class="n">'+fixedN+'</span> fixed</button>':'')+

        (fpN?'<button class="chip" type="button" data-filter="st:false-positive" aria-pressed="false">'+icon('x')+'<span class="n">'+fpN+'</span> false alarm'+(fpN>1?'s':'')+'</button>':'')+
        (cleans.length?'<button class="chip ok" type="button" data-tab="clean">'+icon('checkcircle')+'<span class="n">'+cleans.length+'</span> families clean</button>':'')+
      '</div></div></div>'+
      '<div class="stats">'+
        (itemsChecked!=null?tile(itemsChecked,'items checked',''):tile(finds.length,'findings',''))+
        tile(real.length,'real issues',real.length?'warn':'good')+
        tile(fixedN,'fixed','fixed')+
        (inspected!=null?tile(Math.round(inspected/itemsChecked*100)+'%','inspected by reading','gray'):tile(adds.length,'added to ledger',''))+
      '</div></div>';

    // ---- what this means for you ----
    html+='<div class="card"><div class="card-h">What this means for you</div><div class="card-b stack">';
    if(noStory){
      html+=tierRow(icon('inbox'),'','Nothing was narrated for this session.','The agent ran before scan stories existed, or did not use the story commands, so there is no itemised account to show. Any coverage it posted is under the Coverage tab; newer sweeps narrate themselves automatically.');
    } else if(!real.length){
      html+=tierRow(icon('checkcircle'),'ok','Nothing from the ledger is present in this project'+(done?'':' so far')+'.',(itemsChecked?'All '+itemsChecked+' catalogue items were checked'+(inspected!=null?', '+inspected+' of them by actually reading the code':'')+'.':'Every finding raised was verified as a false alarm or clean.')+(fpN?' '+fpN+' detector hit'+(fpN>1?'s were':' was')+' read and ruled out — no action needed.':''));
    }
    SEVORDER.filter(function(k){return k!=='info'&&real.some(function(f){return (f.severity||'info')===k})}).forEach(function(k){
      var list=real.filter(function(f){return (f.severity||'info')===k});
      var fx=list.filter(function(f){return f.status==='fixed'||f.status==='applied'}).length, nc=list.filter(function(f){return f.status==='needs-call'}).length, op=list.length-fx-nc;
      var sentence=list.length+' '+SEV[k].lbl.toLowerCase()+' issue'+(list.length>1?'s':'')+' — '+SEV[k].why+' ';
      sentence+=fx===list.length?'All '+(list.length>1?'of them are':'')+' fixed already; nothing for you to do.':((fx?fx+' fixed. ':'')+(nc?nc+' need'+(nc>1?'':'s')+' a decision only you can make. ':'')+(op?op+' still open — '+SEV[k].do.toLowerCase()+'.':''));
      html+=tierRow(sevDot(k),k,esc(SEV[k].lbl+' · '+SEV[k].do),esc(sentence));
    });
    if(needN){ var needList=real.filter(function(f){return f.status==='needs-call'}); html+=tierRow(icon('info'),'warn',needN+' decision'+(needN>1?'s':'')+' waiting on you','<ul class="plain decisions">'+needList.slice(0,12).map(function(f){return '<li>'+esc(f.title)+'</li>'}).join('')+(needList.length>12?'<li class="muted">and '+(needList.length-12)+' more under Findings</li>':'')+'</ul><span class="muted">Each one is explained under Findings with a recommendation.</span>'); }
    if(fpN){ html+=tierRow(icon('x'),'',fpN+' detector hit'+(fpN>1?'s':'')+' verified as false alarm'+(fpN>1?'s':''),'The scanner flagged them; the agent read the code and confirmed they are not real. Listed under Findings so you can see the reasoning — nothing to do.'); }

    var tabs=[['findings','Findings',finds.length],['story','Story',events.length],['coverage','Coverage',checks.length],['added','Added',adds.length],['clean','Clean',cleans.length+(headline?(headline.notFound||[]).length:0)],['history','History',histCount?histCount+1:null],['legend','Legend',null]];
    html+='<div class="tabbar"><div class="seg tabs" role="tablist" aria-label="Report sections">'+tabs.map(function(t,i){return '<button role="tab" type="button" class="'+(i===0?'on':'')+'" data-tab="'+t[0]+'" aria-selected="'+(i===0)+'" aria-controls="p-'+t[0]+'">'+esc(t[1])+(t[2]!=null?' <span class="n">'+t[2]+'</span>':'')+'</button>'}).join('')+'</div></div>';

    // ---- findings ----
    html+='<section class="panel" id="p-findings" data-title="Findings" role="tabpanel">';
    if(finds.length){
      html+='<div class="section-h"><h2>Findings, itemised</h2><span class="meta" id="findCount">'+finds.length+'</span></div>'+
        '<div class="toolbar"><div class="search-wrap">'+icon('search')+'<input class="input" type="search" id="findSearch" data-search placeholder="Search findings — title, file, plain-English detail…" aria-label="Search findings" autocomplete="off"></div>'+
        '<button class="btn sm" type="button" id="expandAll">'+icon('down')+'Expand all</button><button class="btn sm" type="button" id="collapseAll">'+icon('up')+'Collapse all</button></div>'+
        '<div class="fgroups" id="filters">'+
          '<div class="grp"><span class="lab">Severity</span>'+SEVORDER.filter(function(k){return bySev[k]}).map(function(k){return '<button class="chip" type="button" data-filter="sev:'+k+'" aria-pressed="false">'+sevDot(k)+SEV[k].lbl+' <span class="n">'+bySev[k]+'</span></button>'}).join('')+'</div>'+
          '<div class="grp"><span class="lab">Status</span>'+Object.keys(byStatus).map(function(k){var o=ST[k]||ST.open;return '<button class="chip" type="button" data-filter="st:'+esc(k)+'" aria-pressed="false">'+icon(o.icon)+o.lbl+' <span class="n">'+byStatus[k]+'</span></button>'}).join('')+'</div>'+
          (Object.keys(byCat).length?'<div class="grp"><span class="lab">Area</span>'+Object.keys(byCat).sort().map(function(k){return '<button class="chip" type="button" data-filter="cat:'+esc(k)+'" aria-pressed="false">'+esc(k)+' <span class="n">'+byCat[k]+'</span></button>'}).join('')+'</div>':'')+
          '<button class="btn sm ghost" type="button" id="clearFilters" hidden>'+icon('x')+'Clear filters</button>'+
        '</div>'+
        '<ol class="list finds" id="findList">'+finds.map(findCard).join('')+'</ol><div class="card" id="findEmpty" hidden>'+Bread.empty('No findings match those filters.','','filter')+'</div>';
    } else {
      html+='<div class="card">'+Bread.empty(noStory?'No story lines':'No issues raised'+(done?'':' yet'),esc(noStory?'Nothing was narrated for this session, so there are no itemised findings to show — see Coverage for what was posted.':done?'The agent walked the whole catalogue and raised nothing for this project.':'The scan is still running — findings appear here the moment the agent raises them.'),noStory?'inbox':'checkcircle')+'</div>';
    }

    // ---- story timeline ----

    html+='<section class="panel" id="p-coverage" data-title="Coverage" role="tabpanel" hidden>';
    if(checks.length){
      html+='<div class="section-h"><h2>Coverage, server-verified</h2><span class="meta">'+checks.length+' record'+(checks.length>1?'s':'')+'</span></div>'+
        '<p class="lead">Each line is a post the ledger checked against its own catalogue — <b>listed</b> is what the agent reported, <b>inspected</b> is how much of it was proven by a detector, a code read or a test rather than reasoned about.</p>'+
        '<div class="table-wrap"><table class="table"><thead><tr><th>Scope</th><th>Listed</th><th>Inspected</th><th>Present</th><th>When</th><th><span class="sr-only">Detail</span></th></tr></thead><tbody>'+
        checks.map(function(c){var cv=c.coverage||{};return '<tr><td><b>'+esc(scopeLabel(c.scope))+'</b></td><td class="num"><span class="badge '+(cv.complete?'ok':'warn')+'">'+icon(cv.complete?'check':'alert')+cv.matched+'/'+cv.total+'</span></td><td class="num">'+(cv.verified!=null?'<span class="badge outline">'+icon('eye')+cv.verified+'/'+cv.total+' ('+cv.verifiedPct+'%)</span>':'—')+'</td><td class="num">'+(c.foundCount||0)+'</td><td class="num">'+hms(c.ts)+'</td><td><a class="btn sm" href="/report?id='+esc(c.id)+'&amp;legacy=1">Detail'+icon('arrow')+'</a></td></tr>'}).join('')+

        adds.map(function(a){return '<li class="row-item"><div class="line">'+kindBadge(a.kind)+(a.severity&&a.kind!=='optimiser'?sevPill(a.severity):'')+'<b>'+esc(a.title)+'</b>'+(a.category?'<span class="cat '+esc(a.category)+'">'+esc(a.category)+'</span>':'')+(a.file?'<code>'+esc(a.file)+'</code>':'')+'</div>'+(a.symptom?'<div class="txt">'+esc(a.symptom)+'</div>':'')+(a.fix?'<div class="txt"><b>Fix:</b> '+esc(a.fix)+'</div>':'')+'</li>'}).join('')+'</ul>';
    } else html+='<div class="card">'+Bread.empty('Nothing new','Everything found was already in the catalogue.','inbox')+'</div>';
    html+='</section>';

    // ---- clean ----

    if(!window.__storyKeys){ window.__storyKeys=true; document.addEventListener('keydown',function(ev){ if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList&&ev.target.classList.contains('head')){ev.preventDefault();ev.target.click();} }); }
    var si=$('#findSearch'); if(si){ si.oninput=applyFilters; if(KEEP.q) si.value=KEEP.q; }
    if(KEEP.q||activeFilters.sev||activeFilters.st||activeFilters.cat) applyFilters();   // a live re-render keeps the reader's filters
    var cm=$('#copyMd'), pb=$('#printBtn');
    if(cm){ cm.hidden=false; cm.onclick=function(){ copy(storyMd(finds,s),'Whole report copied as Markdown'); }; }
    if(pb){ pb.hidden=false; pb.onclick=function(){ window.print(); }; }
    var h=(location.hash||'').slice(1); if(h&&$('#p-'+h)) selectTab(h);
  }
  window.addEventListener('hashchange',function(){ var h=(location.hash||'').slice(1); if(h&&$('#p-'+h)) selectTab(h); });   // #findings … #legend stay addressable after load too
  // ⌘K: jump to a section, or straight to a finding by title / file
  Bread.cmdk.register([['findings','Findings','bug'],['story','How the scan unfolded','activity'],['coverage','Coverage','table'],['added','Added to the ledger','plus'],['clean','Checked & clean','checkcircle'],['history','Scan history','repeat'],['legend','Reading this report','info']].map(function(t){return {group:'This report',label:t[1],icon:t[2],run:function(){selectTab(t[0]);}};}));
  window.BREAD_SEARCH=function(qs){ var ql=qs.toLowerCase(); var out=[];
    FINDS.forEach(function(f,i){ if(out.length>=8) return; if((f.title+' '+(f.file||'')+' '+(f.category||'')).toLowerCase().indexOf(ql)<0) return;
      out.push({group:'Findings in this story',label:f.title,icon:'bug',sub:(f.severity||'info')+' · '+((ST[f.status]||ST.open).lbl),run:function(){ selectTab('findings'); var li=$$('#findList li.find')[i]; if(!li) return; li.hidden=false; li.dataset.open='true'; var hd=li.querySelector('.head'); hd.setAttribute('aria-expanded','true'); li.scrollIntoView({block:'center'}); hd.focus(); }}); });
    return out; };
  function fixPrompt(f,s){
    return 'In the '+s.app+(s.project?' project ('+s.project+')':'')+', fix this finding from the Breadledger scan story '+location.origin+'/story/'+s.id+':\n\n'+
      'Title: '+f.title+'\nSeverity: '+(f.severity||'medium')+(f.category?'\nArea: '+f.category:'')+(f.file?'\nWhere: '+f.file:'')+
      (f.detail?'\nWhat is wrong: '+f.detail:'')+(f.impact?'\nWhy it matters: '+f.impact:'')+(f.fix?'\nRecommended fix: '+f.fix:'')+
      '\n\nMake the smallest correct change, keep existing behaviour and design intact, verify it in the browser, and explain what you changed.';
  }
  function findMd(f,n){
    var sv=SEV[f.severity]?f.severity:'info', st=f.status||'open';
    return n+'. **'+f.title+'** — '+SEV[sv].ic+' '+SEV[sv].lbl+' · '+(ST[st]||ST.open).lbl+(f.category?' · '+f.category:'')+(f.file?' · `'+f.file+'`':'')+'\n'+
      (f.detail?'   - What was wrong: '+f.detail+'\n':'')+(f.impact?'   - Why it matters: '+f.impact+'\n':'')+(f.fix?'   - '+(st==='fixed'||st==='applied'?'What was done':'Recommendation')+': '+f.fix+'\n':'')+(f.verifiedBy?'   - Evidence: '+(EV[f.verifiedBy]||f.verifiedBy)+'\n':'');
  }
  function storyMd(finds,s){
    var d=DATA, ev=d.events||[], real=finds.filter(function(f){return f.status!=='false-positive'});
    var out='# Scan story — '+s.app+(s.project?' · '+s.project:'')+'\n'+fullts(s.started)+' · '+dur((s.updated||Date.now())-s.started)+' · '+esc(s.agent||'agent')+'\n'+location.origin+'/story/'+s.id+'\n\n';
    var v=ev.slice().reverse().find(function(e){return e.kind==='verdict'}); if(v) out+='**Verdict:** '+fullText(v)+'\n\n';
    var m=ev.filter(function(e){return e.kind==='metric'}); if(m.length){ out+='## Better since the scan\n'+m.map(function(x){return '- '+x.title+': '+x.before+' → '+x.after}).join('\n')+'\n\n'; }
    out+='## Findings ('+finds.length+'; '+real.length+' real)\n'+finds.map(findMd).join('')+'\n';
    var c=ev.filter(function(e){return e.kind==='clean'}); if(c.length) out+='## Checked & clean\n'+c.map(function(x){return '- ✅ '+x.title+(x.meta&&x.meta.checked?' ('+x.meta.checked+' checked)':'')}).join('\n')+'\n\n';
    var cv=ev.filter(function(e){return e.kind==='caveat'}); if(cv.length) out+='## Caveats\n'+cv.map(function(x){return '- ⚠ '+fullText(x)}).join('\n')+'\n\n';
    out+='## How the scan unfolded\n'+ev.map(function(e){return '- '+hms(e.ts)+' '+(EVIC[e.kind]||'·')+' '+(e.kind==='found'?'['+(e.severity||'info')+'/'+(e.status||'open')+'] ':'')+(e.title||'')+(e.file?' `'+e.file+'`':'')}).join('\n')+'\n';
    return out;
  }

  // ---------- legacy sweep record (coverage detail) ----------
  var SEVCOLOR={critical:'var(--sev-critical)',high:'var(--sev-high)',medium:'var(--sev-medium)',low:'var(--sev-low)'};
  function donut(matched,total,color){
    var r=52,c=2*Math.PI*r,pc=total?matched/total:1,off=c*(1-pc);
    return '<svg class="donut" width="132" height="132" viewBox="0 0 132 132" role="img" aria-label="'+matched+' of '+total+' covered">'+
      '<circle cx="66" cy="66" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="12"/>'+
      '<circle cx="66" cy="66" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 66 66)" style="transition:stroke-dashoffset .8s var(--ease)"/>'+
      '<text x="66" y="62" text-anchor="middle" font-size="26" font-weight="650" fill="var(--ink)">'+Math.round(pc*100)+'%</text>'+
      '<text x="66" y="84" text-anchor="middle" font-size="13" fill="var(--ink-3)">'+matched+'/'+total+'</text></svg>';
  }
  function bars(entries,colorFor){
    var max=Math.max(1,Math.max.apply(null,entries.map(function(e){return e.v})));
    return '<div class="bars">'+entries.map(function(e){return '<div class="barrow"><span class="lab">'+esc(e.k)+'</span><span class="progress sm"><i style="width:'+Math.round(e.v/max*100)+'%;background:'+colorFor(e.k)+'"></i></span><span class="v num">'+e.v+'</span></div>';}).join('')+'</div>';
  }
  function trend(points,color){
    if(points.length<2) return '';
    var w=560,h=90,pad=8, xs=points.map(function(p){return p.ts}), vs=points.map(function(p){return p.v});
    var minx=Math.min.apply(null,xs),maxx=Math.max.apply(null,xs),maxv=Math.max(1,Math.max.apply(null,vs));
    var X=function(t){return maxx===minx?w/2:pad+(t-minx)/(maxx-minx)*(w-2*pad)}, Y=function(v){return h-pad-(v/maxv)*(h-2*pad)};
    var d=points.map(function(p,i){return (i?'L':'M')+X(p.ts).toFixed(1)+' '+Y(p.v).toFixed(1)}).join(' ');
    return '<svg class="trend" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true"><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+points.map(function(p){return '<circle cx="'+X(p.ts).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3.5" fill="'+color+'"/>'}).join('')+'</svg>';
  }
  function catOfTitle(cat,title){ var n=norm(title); for(var a in cat.apps){ for(var i=0;i<cat.apps[a].length;i++){ if(norm(cat.apps[a][i].title)===n) return cat.apps[a][i].category; } } return 'other'; }
  function renderCheck(c,checks,cat,submitted,opt){
    opt=opt||{};
    var sec=c.scope==='security', optm=c.scope==='optimisers';
    var cov=c.coverage||{matched:(c.notFound||[]).length+(c.found||[]).length,total:0};
    var found=c.found||[], notFound=c.notFound||[], secF=c.securityFindings||[];
    var color= sec?'var(--danger)':optm?'var(--accent)':(c.scope==='all'||c.scope==='full'?'var(--accent)':'var(--ok)');
    var complete=cov.total&&cov.matched===cov.total;
    var newSubs=submitted.filter(function(s){return c.sessionId?s.sessionId===c.sessionId:Math.abs(s.ts-c.ts)<30*60000;});
    var fixedCount=found.filter(function(f){return /fix|fixed|added|removed|patched|resolv|throttl|escap|scoped/i.test(f.note||'')}).length;
    var siblings=checks.filter(function(x){return x.app===c.app && (x.scope||'app')===(c.scope||'app') && x.ts<c.ts}).sort(function(a,b){return b.ts-a.ts});
    var prev=siblings[0];
    var series=checks.filter(function(x){return x.app===c.app && (x.scope||'app')===(c.scope||'app') && x.ts<=c.ts}).sort(function(a,b){return a.ts-b.ts}).map(function(x){return {ts:x.ts,v:x.foundCount||0}});
    var dist=[];
    if(sec){ var bysev={}; secF.forEach(function(f){var s=(f.severity||'low');bysev[s]=(bysev[s]||0)+1}); ['critical','high','medium','low'].forEach(function(s){ if(bysev[s]) dist.push({k:s,v:bysev[s]}); }); }
    else { var bycat={}; found.forEach(function(f){var k=catOfTitle(cat,f.title);bycat[k]=(bycat[k]||0)+1}); dist=Object.keys(bycat).map(function(k){return {k:k,v:bycat[k]}}).sort(function(a,b){return b.v-a.v}); }
    function sevOf(title){var n=norm(title);var m=secF.find(function(f){return norm(f.title)===n});return m?m.severity:null;}
    var kicker= sec?'<span class="badge danger">'+icon('shieldcheck')+'Security Sweep</span>':optm?'<span class="badge accent">'+icon('sparkles')+'Optimiser Sweep</span>':(c.scope==='all'||c.scope==='full'?'<span class="badge accent">'+icon('ledger')+'Full Scan · '+esc(scopeLabel(c.scope))+'</span>':'<span class="badge">'+icon('bug')+'Bug + Security Check</span>');
    var noun= optm?'elevation to add':'issue';
    var verdict = complete
      ? (found.length? '<div class="note '+(optm?'info':'warn')+' verdict">'+icon(optm?'sparkles':'alert')+'<span>'+found.length+' '+noun+(found.length>1?'s':'')+(optm?'':' present')+(fixedCount?(' · '+fixedCount+' fixed'):'')+' · '+cov.matched+'/'+cov.total+' reviewed'+(cov.verified!=null?' · '+cov.verified+' inspected':'')+'</span></div>'
                     : '<div class="note ok verdict">'+icon('checkcircle')+'<span>'+(optm?'Fully elevated — every optimiser already applied':'Clean — 0 issues present')+' · full coverage '+cov.matched+'/'+cov.total+'</span></div>')
      : '<div class="note warn verdict">'+icon('alert')+'<span>Incomplete — '+cov.matched+'/'+cov.total+' reviewed</span></div>';
    var html='';
    html+='<div class="card pad"><div class="hero">'+donut(cov.matched,cov.total,color)+'<div class="txt">'+kicker+
        (opt.embedded?'<h2>'+esc(c.app)+' · '+esc(scopeLabel(c.scope))+'</h2>':'<h1>'+esc(c.app)+(c.project?' <span class="proj">· '+esc(c.project)+'</span>':'')+'</h1>')+
        '<div class="when">'+fullts(c.ts)+' · by '+esc(c.checkedBy||'agent')+' · '+(c.scanned||0)+' files scanned</div>'+verdict+(c.notes?'<p class="sub">'+esc(c.notes)+'</p>':'')+'</div></div></div>';
    html+='<div class="stats">'+tile(cov.total,'items checked')+tile(found.length,'present',found.length?'warn':'good')+tile(fixedCount,'fixed','good')+tile(newSubs.length,'added to ledger','')+tile(notFound.length,'clean','good')+tile((cov.total?Math.round(cov.matched/cov.total*100):100)+'%','coverage')+(cov.verified!=null?tile(cov.verifiedPct+'%','inspected','gray'):'')+'</div>';
    if(cov.evidence){ var ev=cov.evidence; var ent=['detector','code-read','test','reasoned','assumed'].filter(function(k){return ev[k]}).map(function(k){return {k:EV[k]||k,v:ev[k]}}); if(ent.length) html+='<div class="card"><div class="card-h">Evidence behind the coverage</div><div class="card-b">'+bars(ent,function(k){return k==='reasoned'||k==='assumed'?'var(--ink-3)':'var(--ok)'})+'</div></div>'; }
    if(found.length){
      html+='<div class="card"><div class="card-h">Present in this project<span class="meta">'+found.length+'</span></div><ul class="rows">'+
        found.map(function(f){var s=sec?sevOf(f.title):null; var fixed=/fix|fixed|added|removed|patched|resolv|throttl|escap|scoped/i.test(f.note||'');
          return '<li class="row-item"><div class="line">'+(s?sevPill(s):'')+'<b>'+esc(f.title)+'</b>'+(f.file?'<code>'+esc(f.file)+'</code>':'')+(f.verifiedBy?evChip(f.verifiedBy):'')+(fixed?stPill('fixed'):'')+'</div>'+(f.note?'<div class="txt">'+esc(f.note)+'</div>':'')+'</li>';
        }).join('')+'</ul></div>';
    } else html+='<div class="card">'+Bread.empty('No known '+(sec?'security issues':optm?'missing elevations':'bugs')+' present in this project','All '+cov.total+' catalogue items were checked and none reproduced here.','checkcircle')+'</div>';
    if(dist.length) html+='<div class="card"><div class="card-h">'+(sec?'Findings by severity':'Findings by category')+'</div><div class="card-b">'+bars(dist,function(k){return sec?(SEVCOLOR[k]||'var(--sev-low)'):'var(--accent)'})+'</div></div>';
    html+='<div class="card"><div class="card-h">Compared to the last sweep of this scope</div><div class="card-b stack">';
    if(prev){
      var d=found.length-(prev.foundCount||0), dc=d<0?'ok':(d>0?'danger':'outline'), dt=d<0?(icon('down')+(-d)+' fewer'):(d>0?(icon('up')+d+' more'):'no change');
      var prevTitles=new Set((prev.found||[]).map(function(f){return norm(f.title)})), nowTitles=new Set(found.map(function(f){return norm(f.title)}));
      var resolved=(prev.found||[]).filter(function(f){return !nowTitles.has(norm(f.title))}), appeared=found.filter(function(f){return !prevTitles.has(norm(f.title))});
      html+='<div class="cmp"><div><div class="meta">'+shortts(prev.ts)+'</div><div class="big muted">'+(prev.foundCount||0)+'</div><div class="meta">then present</div></div>'+icon('arrow')+'<div><div class="meta">now</div><div class="big">'+found.length+'</div><div class="meta">present</div></div><span class="badge '+dc+'">'+dt+'</span></div>'+
        '<div class="twocol"><div><b>Resolved since last ('+resolved.length+')</b><ul class="mini one">'+(resolved.length?resolved.map(function(f){return '<li>'+esc(f.title)+'</li>'}).join(''):'<li class="muted">none</li>')+'</ul></div><div><b>New since last ('+appeared.length+')</b><ul class="mini one new">'+(appeared.length?appeared.map(function(f){return '<li>'+esc(f.title)+'</li>'}).join(''):'<li class="muted">none</li>')+'</ul></div></div>';
    } else html+='<p class="lead">This is the <b>first sweep</b> for this project + scope. Future sweeps will compare here — resolved vs new — so you can watch it improve.</p>';
    var tr=trend(series,color); if(tr) html+='<div><div class="meta" style="margin-bottom:4px">Present issues over the last '+series.length+' sweeps</div>'+tr+'</div>';
    html+='</div></div>';
    if(opt.standalone){
      var kindOf=function(s){return s.kind==='optimiser'?'optimiser':(s.kind==='security'||s.category==='security'?'security':'bug');};
      html+='<div class="card"><div class="card-h">Added to the ledger from this sweep<span class="meta">'+newSubs.length+'</span></div>'+(newSubs.length?'<ul class="rows">'+newSubs.map(function(s){return '<li class="row-item"><div class="line">'+kindBadge(kindOf(s))+(s.severity&&kindOf(s)!=='optimiser'?sevPill(s.severity):'')+'<b>'+esc(s.title)+'</b>'+(s.file?'<code>'+esc(s.file)+'</code>':'')+'</div>'+(s.symptom?'<div class="txt">'+esc(s.symptom)+'</div>':'')+'</li>'}).join('')+'</ul>':'<div class="card-b"><p class="lead">Nothing new added — everything found was already in the catalogue.</p></div>')+'</div>';
      if(notFound.length) html+='<details class="card clean-all"><summary>'+icon('down')+'<span>'+notFound.length+' items checked &amp; clean</span></summary><ul class="mini">'+notFound.slice(0,600).map(function(t){return '<li>'+esc(String(typeof t==='string'?t:t.title).replace(/ \(static check clean\)$/,''))+'</li>'}).join('')+'</ul></details>';
    }
    return html;
  }
</script>
