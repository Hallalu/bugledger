<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An itemised, severity-tagged report of one scan: what was found, why it matters, what was done, how the project is better now, and how it compares to last time.">
<meta property="og:type" content="website">
<meta property="og:title" content="Bug Ledger · Scan story">
<meta property="og:description" content="An itemised, severity-tagged report of one scan: what was found, why it matters, what was done, how the project is better now, and how it compares to last time.">
<meta property="og:image" content="https://bugledger.coconvo.workers.dev/og.png">
<meta name="twitter:card" content="summary_large_image">
<title>Bug Ledger · Scan Report</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#f5f6fb; --ink:#12141c; --muted:#636879; --card:rgba(255,255,255,.76); --card2:rgba(255,255,255,.55);
    --line:rgba(18,20,28,.09); --coral:#ff6a5a; --good:#12b886; --violet:#8b7bf0; --amber:#e08a00; --red:#e5484d;
    --shadow:0 16px 44px -24px rgba(30,25,60,.32);
    --crit:#b4227a; --high:#e5484d; --med:#e07a00; --low:#b58900; --info:#6b7280; --fixed:#2563eb; --clean:#12b886; --gray:#6b7280;
    --critbg:rgba(180,34,122,.12); --highbg:rgba(229,72,77,.12); --medbg:rgba(224,122,0,.13); --lowbg:rgba(181,137,0,.14); --infobg:rgba(107,114,128,.12); --fixedbg:rgba(37,99,235,.12); --cleanbg:rgba(18,184,134,.13);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0b0d15; --ink:#eef0f7; --muted:#9aa0b4; --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.035);
      --line:rgba(255,255,255,.11); --shadow:0 24px 60px -24px rgba(0,0,0,.7); --med:#f59e42; --low:#e3c000; --fixed:#60a5fa; --clean:#3ddc9a; }
  }
  html,body{margin:0;min-height:100%}
  body{font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:var(--ink);
    background:var(--bg);overflow-x:hidden;position:relative;-webkit-font-smoothing:antialiased}
  .aurora{position:fixed;inset:-20vh -10vw;z-index:-1;filter:blur(72px) saturate(120%);opacity:.7;pointer-events:none}
  .aurora span{position:absolute;border-radius:50%;animation:drift 26s ease-in-out infinite}
  .aurora .a{width:50vw;height:50vw;left:-6vw;top:-8vh;background:radial-gradient(circle at 30% 30%,#ff9a7a,transparent 62%)}
  .aurora .b{width:46vw;height:46vw;right:-8vw;top:-6vh;background:radial-gradient(circle at 60% 40%,#8ab6ff,transparent 62%);animation-delay:-8s}
  .aurora .c{width:46vw;height:46vw;left:14vw;bottom:-16vh;background:radial-gradient(circle at 50% 50%,#7ff0cf,transparent 60%);animation-delay:-14s}
  .aurora .d{width:38vw;height:38vw;right:6vw;bottom:-12vh;background:radial-gradient(circle at 50% 50%,#c9a3ff,transparent 62%);animation-delay:-19s}
  @media (prefers-color-scheme:dark){.aurora{opacity:.45}}
  @keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(3vw,4vh) scale(1.07)}66%{transform:translate(-3vw,-2vh) scale(.96)}}
  @media (prefers-reduced-motion:reduce){.aurora span{animation:none}.card{animation:none}}

  .wrap{max-width:960px;margin:0 auto;padding:26px 20px 90px}
  .crumbs{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:14px;flex-wrap:wrap}
  .crumbs a,.crumbs button{color:inherit;text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:5px 12px;background:transparent;font:inherit;font-size:13px;cursor:pointer}
  .crumbs a:hover,.crumbs button:hover{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 30%,transparent)}
  .crumbs .sp{flex:1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
    backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);padding:22px 24px;margin:0 0 16px;
    animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h1{font-size:26px;letter-spacing:-.02em;margin:6px 0 4px;line-height:1.2}
  h2{font-size:16px;margin:0 0 12px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
  h2 .cnt{font-weight:700;color:var(--muted);font-size:13px}
  h3{font-size:13.5px;margin:14px 0 6px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  p{margin:0 0 8px}
  .muted{color:var(--muted)} .center{text-align:center}
  .kicker{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:99px;display:inline-block}
  .kicker.story{color:var(--coral);background:color-mix(in srgb,var(--coral) 14%,transparent)}
  .kicker.bugs{color:var(--violet);background:color-mix(in srgb,var(--violet) 14%,transparent)}
  .kicker.sec{color:var(--red);background:color-mix(in srgb,var(--red) 13%,transparent)}
  .kicker.opt{color:#7c5cff;background:color-mix(in srgb,#7c5cff 14%,transparent)}
  .sub{color:var(--muted);font-size:14px}
  .sub b{color:var(--ink);font-weight:650}
  .verdict{font-weight:750;font-size:17px;margin:12px 0 0;line-height:1.4}
  .verdict.ok{color:var(--good)} .verdict.warn{color:var(--coral)}

  /* severity + status pills — colour AND icon AND text, never colour alone */
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:3px 9px;border-radius:99px;white-space:nowrap;border:1px solid transparent;line-height:1.4}
  .pill.critical{color:var(--crit);background:var(--critbg)} .pill.high{color:var(--high);background:var(--highbg)}
  .pill.medium{color:var(--med);background:var(--medbg)} .pill.low{color:var(--low);background:var(--lowbg)} .pill.info{color:var(--info);background:var(--infobg)}
  .pill.st-fixed{color:var(--fixed);background:var(--fixedbg)} .pill.st-applied{color:var(--fixed);background:var(--fixedbg)}
  .pill.st-open{color:var(--high);background:var(--highbg)} .pill.st-needs-call{color:var(--med);background:var(--medbg)}
  .pill.st-false-positive{color:var(--gray);background:color-mix(in srgb,var(--gray) 14%,transparent)}
  .pill.st-recommended{color:var(--violet);background:color-mix(in srgb,var(--violet) 14%,transparent)}
  .pill.st-wontfix{color:var(--gray);background:color-mix(in srgb,var(--gray) 14%,transparent)} .pill.st-clean{color:var(--clean);background:var(--cleanbg)}
  .chip.fixedc{color:var(--fixed);border-color:color-mix(in srgb,var(--fixed) 50%,transparent)}
  .tile.fixed .n{color:var(--fixed)}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:transparent;font-family:inherit;cursor:default;line-height:1.4}
  .chip.mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;font-weight:600}
  .chip.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent)}
  .chip.add{color:var(--violet);border-color:color-mix(in srgb,var(--violet) 50%,transparent)}
  button.chip{cursor:pointer}
  button.chip:hover{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 35%,transparent)}
  button.chip[aria-pressed="true"]{color:var(--ink);background:color-mix(in srgb,var(--ink) 9%,transparent);border-color:color-mix(in srgb,var(--ink) 30%,transparent)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .summary button.chip{font-size:13px;padding:6px 12px}
  .summary button.chip .n{font-weight:800;color:var(--ink)}
  .hero{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
  .hero .txt{flex:1;min-width:260px}
  .donutwrap{flex:none;text-align:center;cursor:help}
  .donutwrap .dl{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px}
  .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;min-width:220px}
  .meta .tile{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 13px}
  .tile .n{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
  .tile .l{color:var(--muted);font-size:12px;margin-top:3px}
  .tile.good .n{color:var(--good)} .tile.warn .n{color:var(--coral)} .tile.gray .n{color:var(--muted)}

  /* what it means */
  .means{display:grid;gap:10px}
  .means .tier{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card2)}
  .means .tier .ic{font-size:20px;line-height:1.2;width:28px;text-align:center}
  .means .tier b{display:block;margin-bottom:2px}
  .means .tier p{margin:0;color:var(--muted);font-size:14px}
  .means .tier.critical{border-color:color-mix(in srgb,var(--crit) 45%,transparent)} .means .tier.high{border-color:color-mix(in srgb,var(--high) 45%,transparent)}
  .means .tier.medium{border-color:color-mix(in srgb,var(--med) 45%,transparent)} .means .tier.low{border-color:color-mix(in srgb,var(--low) 45%,transparent)}
  .progressline{margin-top:14px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--good) 9%,transparent);border:1px solid color-mix(in srgb,var(--good) 35%,transparent);font-size:14.5px}
  .progressline.worse{background:color-mix(in srgb,var(--coral) 9%,transparent);border-color:color-mix(in srgb,var(--coral) 35%,transparent)}
  .progressline.first{background:color-mix(in srgb,var(--violet) 9%,transparent);border-color:color-mix(in srgb,var(--violet) 35%,transparent)}
  .progressline b{font-weight:800}

  /* better since the scan */
  .metrics{display:grid;gap:10px}
  .mrow{display:grid;grid-template-columns:minmax(140px,1.2fr) auto auto auto minmax(90px,1fr);gap:12px;align-items:center;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card2)}
  @media (max-width:640px){.mrow{grid-template-columns:1fr auto auto auto}.mrow .track{grid-column:1/-1}}
  .mrow .lab{font-weight:650}
  .mrow .v{font-variant-numeric:tabular-nums;font-weight:800}
  .mrow .v.before{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent);font-weight:600}
  .mrow .arrow{color:var(--muted)}
  .delta{font-weight:800;padding:2px 9px;border-radius:99px;font-size:12.5px;white-space:nowrap}
  .delta.down{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
  .delta.up{color:var(--red);background:color-mix(in srgb,var(--red) 13%,transparent)}
  .delta.flat{color:var(--muted);background:color-mix(in srgb,var(--muted) 12%,transparent)}
  .track{height:10px;border-radius:99px;background:color-mix(in srgb,var(--muted) 16%,transparent);overflow:hidden;position:relative}
  .track>i{display:block;height:100%;border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1);background:linear-gradient(90deg,var(--good),#4fd1a5)}
  .track>i.was{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--muted) 35%,transparent)}

  /* tabs */
  .tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;flex-wrap:wrap;padding:8px;margin:0 0 16px;border-radius:16px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}
  .tabs button{font:inherit;font-size:13.5px;font-weight:700;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:12px;padding:8px 13px;cursor:pointer}
  .tabs button:hover{color:var(--ink)}
  .tabs button[aria-selected="true"]{color:var(--ink);background:var(--card);border-color:var(--line);box-shadow:0 6px 18px -12px rgba(0,0,0,.35)}
  .tabs button .cnt{color:var(--muted);font-weight:700;margin-left:4px}
  .panel[hidden]{display:none}

  /* scan history — the whole lineage of this app's scans */
  ol.hist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
  .histrow .hcard{display:grid;grid-template-columns:minmax(78px,auto) 1fr auto;gap:14px;align-items:center;text-decoration:none;color:inherit;
    border:1px solid var(--line);border-radius:16px;background:var(--card2);padding:12px 15px;transition:border-color .15s,transform .12s}
  a.hcard:hover{border-color:color-mix(in srgb,var(--ink) 24%,transparent);transform:translateY(-1px)}
  .histrow.cur .hcard{border-color:color-mix(in srgb,var(--coral) 45%,transparent);background:color-mix(in srgb,var(--coral) 7%,transparent)}
  .hwhen{font-size:12.5px;font-weight:750;color:var(--muted);font-variant-numeric:tabular-nums}
  .htitle{font-weight:750;font-size:15px;line-height:1.35}
  .hsub{font-size:13.5px;margin-top:3px} .hsub.ok{color:var(--good)} .hsub.warn{color:var(--coral)}
  .hbadges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center}
  .hd{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
  .hb{font-size:11.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 8px}
  .hb.fx{color:var(--fixed);border-color:color-mix(in srgb,var(--fixed) 45%,transparent)}
  .hb.op{color:var(--coral);border-color:color-mix(in srgb,var(--coral) 45%,transparent)}
  .hgo{font-size:12.5px;font-weight:800;color:var(--coral);white-space:nowrap}
  .histrow.cur .hgo{color:var(--muted)}
  .chip.live{color:var(--coral);border-color:color-mix(in srgb,var(--coral) 50%,transparent)}
  .chip.cur{color:var(--coral);border-color:color-mix(in srgb,var(--coral) 50%,transparent)}
  @media (max-width:560px){.histrow .hcard{grid-template-columns:1fr auto}.hwhen{grid-column:1/-1}}

  /* findings */
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .toolbar input{flex:1;min-width:180px;font:inherit;font-size:14px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink)}
  .toolbar input:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .filters .grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-right:10px;margin-right:4px;border-right:1px solid var(--line)}
  .filters .grp:last-child{border:0}
  .filters .lab{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:2px}
  ol.finds{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:f}
  li.find{border:1px solid var(--line);border-radius:16px;background:var(--card2);overflow:hidden;transition:border-color .15s}
  li.find:hover{border-color:color-mix(in srgb,var(--ink) 22%,transparent)}
  li.find.critical{border-left:4px solid var(--crit)} li.find.high{border-left:4px solid var(--high)} li.find.medium{border-left:4px solid var(--med)}
  li.find.low{border-left:4px solid var(--low)} li.find.info{border-left:4px solid var(--info)}
  li.find.st-false-positive{opacity:.78}
  li.find .head{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px 16px 10px;cursor:pointer}
  li.find .num{font-size:15px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.5;min-width:26px}
  li.find .num::before{content:counter(f) ".";counter-increment:f}
  li.find .ttl{font-weight:750;font-size:16px;line-height:1.35;letter-spacing:-.005em}
  li.find .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  li.find .body{padding:0 16px 14px 54px;display:grid;gap:10px}
  @media (max-width:560px){li.find .body{padding-left:16px}}
  li.find[data-open="false"] .body{display:none}
  .kv{display:grid;grid-template-columns:118px 1fr;gap:10px;font-size:14.5px;line-height:1.5}
  @media (max-width:560px){.kv{grid-template-columns:1fr;gap:2px}}
  .kv .k{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding-top:3px}
  .kv .v{white-space:pre-wrap;word-break:break-word}
  .kv.fixv .v{color:var(--fixed)} .kv.fixv .v::before{content:"✓ "}
  .kv.recv .v::before{content:"→ "}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .caret{display:inline-block;transition:transform .2s;color:var(--muted);font-size:12px;margin-left:4px}
  li.find[data-open="false"] .caret{transform:rotate(-90deg)}
  .empty{padding:24px;text-align:center;color:var(--muted)}

  /* story timeline */
  .tl{position:relative;padding-left:30px}
  .tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line);border-radius:2px}
  .ph{position:relative;margin:18px 0 8px}
  .ph:first-child{margin-top:0}
  .ph .dot{position:absolute;left:-27px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--coral);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
  .ph .t{font-weight:800;font-size:15px}
  .ph .when{color:var(--muted);font-size:12.5px;margin-left:8px;font-variant-numeric:tabular-nums}
  .ev{position:relative;padding:7px 0 7px 4px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:14.5px}
  .ev .dot{position:absolute;left:-24px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .ev.found .dot{width:10px;height:10px;left:-25px;top:12px}
  .ev.found.critical .dot{background:var(--crit)} .ev.found.high .dot{background:var(--high)} .ev.found.medium .dot{background:var(--med)} .ev.found.low .dot{background:var(--low)} .ev.found.info .dot{background:var(--info)}
  .ev.fixed .dot{background:var(--fixed)} .ev.clean .dot{background:var(--clean)} .ev.metric .dot{background:var(--violet)} .ev.caveat .dot{background:var(--amber)} .ev.verdict .dot{background:var(--ink)}
  .ev .ic{width:22px;text-align:center;font-size:15px;line-height:1.5}
  .ev .tx b{font-weight:700}
  .ev .tx .d{color:var(--muted);font-size:13.5px;margin-top:2px;white-space:pre-wrap}
  .ev .ts{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;margin-left:8px}
  .ev.say .tx{color:var(--ink)}
  .ev.note .tx{color:var(--muted)}
  .ev.verdict .tx{font-weight:800;font-size:15.5px}
  .ev.metric .tx .mv{font-weight:800;color:var(--violet)}

  /* coverage (legacy sweep sections) */
  .donut{flex:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .grid .tile{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .bars{display:grid;gap:8px}
  .barrow{display:grid;grid-template-columns:140px 1fr 60px;align-items:center;gap:10px;font-size:13px}
  .barrow .lab{color:var(--muted);text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .barrow .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
  .cmp{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  .cmp .big{font-size:30px;font-weight:800}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:620px){.twocol{grid-template-columns:1fr}}
  .mini{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px;font-size:13.5px}
  .mini li{color:var(--muted)} .mini li b{color:var(--ink);font-weight:600}
  ul.plain{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  ul.plain li{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card2)}
  ul.plain li .ft{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  ul.plain li .note{color:var(--muted);font-size:13.5px;margin-top:3px}
  .covtable{width:100%;border-collapse:collapse;font-size:13.5px}
  .covtable th,.covtable td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  .covtable th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .covtable td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
  .legend .it{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card2);font-size:13.5px}
  .legend .it b{display:block}
  .legend .it span{color:var(--muted)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:26px}
  .foot a{color:inherit}
  .spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--coral);animation:sp 1s linear infinite;margin:16vh auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13.5px;font-weight:700;transition:.25s;pointer-events:none;z-index:9}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:14px;background:color-mix(in srgb,var(--coral) 10%,transparent);border:1px solid color-mix(in srgb,var(--coral) 40%,transparent);margin-bottom:16px;font-size:14px}
  .banner a{color:var(--coral);font-weight:800;text-decoration:none}
  /* hover / focus tooltip — every colour tag explains itself in words */
  [data-tip]{cursor:help}
  .tip{position:fixed;z-index:20;max-width:320px;padding:10px 12px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:13px;line-height:1.45;box-shadow:0 14px 34px -14px rgba(0,0,0,.5);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
  .tip.show{opacity:1;transform:none}
  .tip b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
  .tip .do{display:block;font-weight:700;margin-bottom:2px}
  .tip::after{content:"";position:absolute;left:var(--ax,20px);bottom:-6px;border:6px solid transparent;border-top-color:var(--ink);border-bottom:0}
  .tip.below::after{bottom:auto;top:-6px;border-top:0;border-bottom:6px solid var(--ink)}
  @media print{
    .aurora,.crumbs,.tabs,.toolbar,.filters,.actions,.toast,.foot{display:none!important}
    .panel[hidden]{display:block!important}
    li.find[data-open="false"] .body{display:grid!important}
    .card{box-shadow:none;break-inside:avoid;background:#fff;border-color:#ddd;animation:none}
    body{background:#fff;color:#000}
    .panel{page-break-before:auto}
    .panel::before{content:attr(data-title);display:block;font-weight:800;font-size:18px;margin:18px 0 10px}
  }
  @media (pointer:coarse){input,select,textarea{font-size:16px}}   /* iOS: no focus zoom */
</style>
</head>
<body>
<div class="aurora"><span class="a"></span><span class="b"></span><span class="c"></span><span class="d"></span></div>
<div class="wrap">
  <div class="crumbs"><a href="/timeline">← Activity</a><a href="/live">Live</a><a href="/">The ledger</a><span class="sp"></span>
    <button type="button" id="copyMd" hidden>⧉ Copy as Markdown</button><button type="button" id="printBtn" hidden>🖨 Print / PDF</button></div>
  <div id="report"><div class="spin"></div></div>
  <div class="foot">Append-only scan report · a permanent record of what was checked, what was found, what was done, and how the project is better now. · <a href="/AGENT.md">agent protocol</a> · <a href="/admin">admin</a></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip" role="tooltip" hidden></div>
<script>
  var $=function(s,r){return (r||document).querySelector(s)};
  var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
  var q=new URLSearchParams(location.search);
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function p2(n){return('0'+n).slice(-2)}
  function fullts(ts){var d=new Date(ts);return DAYS[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()+', '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());}
  function shortts(ts){var d=new Date(ts);return d.getDate()+' '+MON[d.getMonth()]+', '+p2(d.getHours())+':'+p2(d.getMinutes());}
  function hms(ts){var d=new Date(ts);return p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());}
  function dur(ms){var s=Math.max(0,Math.round(ms/1000));if(s<60)return s+'s';var m=Math.floor(s/60);if(m<60)return m+'m '+(s%60)+'s';var h=Math.floor(m/60);return h+'h '+(m%60)+'m';}
  function norm(t){return String(t||'').toLowerCase().replace(/[^a-z0-9]+/g,'');}
  function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},1600);}
  function copy(text,msg){ (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(function(){toast(msg||'Copied')}).catch(function(){
    var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(msg||'Copied')}catch(e){toast('Could not copy')}ta.remove();}); }

  var SEV={critical:{ic:'🟣',lbl:'Critical',do:'Fix now — beyond red',why:'Could expose data, break sign-in or take the app down for real users.'},
           high:{ic:'🔴',lbl:'High',do:'Fix before the next release',why:'A real user hits this in normal use, or it is a security weakness an attacker could use.'},
           medium:{ic:'🟠',lbl:'Medium',do:'Schedule it',why:'Degrades the experience for some users — accessibility, wrong dates, silent failures.'},
           low:{ic:'🟡',lbl:'Low',do:'Polish when convenient',why:'Cosmetic or best-practice; no user is blocked.'},
           info:{ic:'⚪',lbl:'Info',do:'For your awareness',why:'A note, a clean check or context — nothing to fix.'}};
  var SEVORDER=['critical','high','medium','low','info'];
  var ST={fixed:{ic:'🔵',lbl:'Fixed'},applied:{ic:'🔵',lbl:'Applied'},open:{ic:'◌',lbl:'Open'},'needs-call':{ic:'⚑',lbl:'Needs your call'},
          'false-positive':{ic:'⊘',lbl:'False alarm'},recommended:{ic:'★',lbl:'Recommended'},wontfix:{ic:'—',lbl:'Won’t fix'},clean:{ic:'🟢',lbl:'Clean'}};
  var EV={detector:'detector ran','code-read':'code read',test:'test passed',reasoned:'reasoned',assumed:'assumed'};
  var STTIP={fixed:'Blue = done during the scan. The change is made and described — nothing for you to do.',applied:'This upgrade was applied during the scan.',open:'Real and not yet fixed. Use “copy fix prompt” to hand it to an agent.','needs-call':'A decision only you can make — wording, policy or a destructive change. The agent explains and recommends; you decide.','false-positive':'The scanner flagged it; the agent read the code and ruled it out. Kept so you can see the reasoning.',recommended:'An optimiser (a reusable upgrade) this project would benefit from — not a bug.',wontfix:'Judged not worth changing, with the reason given.',clean:'Checked and nothing found.'};
  var EVTIP={detector:'A static check fired — deterministic, but only a lead until someone reads the line.','code-read':'The agent opened the file and confirmed it — the strongest everyday evidence.',test:'Proven by running a test.',reasoned:'Inferred, not inspected — treat as a claim.',assumed:'Assumed without checking — the weakest evidence.'};
  function tipAttr(head,doTxt,why){return ' tabindex="0" data-tip="'+esc(JSON.stringify({h:head,d:doTxt||'',w:why||''}))+'"';}
  function sevPill(s){s=SEV[s]?s:'info';return '<span class="pill '+s+'"'+tipAttr(SEV[s].ic+' '+SEV[s].lbl+' severity',SEV[s].do,SEV[s].why)+'>'+SEV[s].ic+' '+SEV[s].lbl+'</span>';}
  function stPill(s){var o=ST[s]||ST.open;return '<span class="pill st-'+esc(s||'open')+'"'+tipAttr(o.ic+' '+o.lbl,'',STTIP[s]||STTIP.open)+'>'+o.ic+' '+o.lbl+'</span>';}
  function evChip(v){return '<span class="chip"'+tipAttr('Evidence: '+(EV[v]||v),'',EVTIP[v]||'')+'>'+esc(EV[v]||v)+'</span>';}
  function confChip(c){return '<span class="chip"'+tipAttr(c==='high'?'✔ High confidence':'◦ Needs review','',c==='high'?'Structural and near-certain — the detector is right about this class almost every time.':'A heuristic lead — confirm by reading before acting.')+'>'+(c==='high'?'✔ high confidence':'◦ review')+'</span>';}

  // ---------- loading ----------
  function getJSON(url,fallback,tries){
    tries=tries||0;
    return fetch(url,{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .catch(function(){ return tries<2 ? new Promise(function(res){setTimeout(function(){res(getJSON(url,fallback,tries+1));},400*(tries+1));}) : fallback; });
  }
  var pathStory=/^\/story\/([^/?#]+)/.exec(location.pathname);
  var SESSION=q.get('session')||(pathStory&&decodeURIComponent(pathStory[1]));
  function load(){
    if(SESSION){
      Promise.all([getJSON('/api/story?id='+encodeURIComponent(SESSION),null),getJSON('/api/checks?limit=200',{checks:[]}),getJSON('/checklist.json',{apps:{}}),getJSON('/api/bugs?limit=200',{submitted:[]})])
        .then(function(res){
          if(!res[0]||!res[0].ok){ notFound(!res[0]); return; }
          renderStory(res[0],(res[1]&&res[1].checks)||[],res[2]||{apps:{}},(res[3]&&res[3].submitted)||[]);
        }).catch(function(e){ console.error(e); notFound(true); });
      return;
    }
    Promise.all([getJSON('/api/checks?limit=200',{checks:[]}),getJSON('/checklist.json',{apps:{}}),getJSON('/api/bugs?limit=200',{submitted:[]})]).then(function(res){
      var checks=(res[0]&&res[0].checks)||[], cat=res[1]||{apps:{}}, submitted=(res[2]&&res[2].submitted)||[];
      var id=q.get('id'), app=q.get('app'), project=q.get('project');
      var c = id ? checks.find(function(x){return x.id===id})
        : checks.filter(function(x){return (!app||x.app===app)&&(!project||x.project===project)}).sort(function(a,b){return b.ts-a.ts})[0];
      if(!c){ notFound(!checks.length); return; }
      // a check that belongs to a story → show the story (it contains this check) unless ?legacy=1
      if(c.sessionId && !q.get('legacy')){ SESSION=c.sessionId; history.replaceState(null,'','/story/'+c.sessionId); load(); return; }
      var html='<div class="banner">🐛 Coverage record only — this sweep was logged before scan stories existed, so there is no narrative for it. <a href="/timeline">See newer sweeps →</a></div>';
      html+=renderCheck(c,checks,cat,submitted,{standalone:true});
      document.title='Report · '+c.app;
      $('#report').innerHTML=html;
    });
  }
  function notFound(lost){
    $('#report').innerHTML='<div class="card center"><h1>'+(lost?'Couldn’t load the report':'Report not found')+'</h1>'+
      '<p class="muted">'+(lost?'The connection dropped while loading.':'This sweep may have been pruned.')+
      ' <a href="#" id="retry" style="color:var(--coral)">Retry</a> · <a href="/timeline">Activity</a></p></div>';
    var rt=document.getElementById('retry'); if(rt) rt.onclick=function(e){e.preventDefault();$('#report').innerHTML='<div class="spin"></div>';load();};
  }
  load();

  // ---------- story ----------
  var DATA=null;
  function resolveFindings(events){
    var finds=events.filter(function(e){return e.kind==='found'}).map(function(f){return Object.assign({},f)});
    var byId={},byTitle={};
    finds.forEach(function(f){byId[f.id]=f;byTitle[norm(f.title)]=f.id});
    events.forEach(function(e){ if(e.kind!=='fixed')return; var id=(e.ref&&byId[e.ref])?e.ref:byTitle[norm(e.title)]; var f=id&&byId[id]; if(!f)return;
      f.status=e.status||'fixed'; if(e.fix)f.fix=e.fix; if(e.file&&!f.file)f.file=e.file; f.fixedAt=e.ts; });
    return finds;
  }
  function pct(a,b){ if(!a) return null; return Math.round((a-b)/a*100); }
  function isNum(v){return v!=null&&v!==''&&!isNaN(parseFloat(String(v).replace(/[^0-9.\-]/g,'')));}
  function numOf(v){return parseFloat(String(v).replace(/[^0-9.\-]/g,''));}

  function renderStory(d,allChecks,cat,allSubmitted){
    DATA=d;
    var s=d.session, events=d.events||[], checks=d.checks||[], adds=d.additions||[];
    if(!adds.length) adds=allSubmitted.filter(function(x){return x.app===s.app && x.ts>=s.started-60000 && x.ts<=s.updated+30*60000;});
    var finds=resolveFindings(events);
    finds.sort(function(a,b){return SEVORDER.indexOf(a.severity||'info')-SEVORDER.indexOf(b.severity||'info')||a.ts-b.ts});
    var real=finds.filter(function(f){return f.status!=='false-positive'});
    var bySev={},byStatus={},byCat={};
    finds.forEach(function(f){var sv=f.severity||'info';bySev[sv]=(bySev[sv]||0)+1;var st=f.status||'open';byStatus[st]=(byStatus[st]||0)+1;if(f.category)byCat[f.category]=(byCat[f.category]||0)+1;});
    var fixedN=(byStatus.fixed||0)+(byStatus.applied||0), needN=byStatus['needs-call']||0, openN=byStatus.open||0, fpN=byStatus['false-positive']||0, recN=byStatus.recommended||0;
    var cleans=events.filter(function(e){return e.kind==='clean'});
    var metrics=(function(){ var by={}; events.filter(function(e){return e.kind==='metric'}).forEach(function(e){by[norm(e.title)]=e}); return Object.keys(by).map(function(k){return by[k]}); })();   // same label posted twice → the latest wins
    var caveats=(function(){ var all=events.filter(function(e){return e.kind==='caveat'}); return all.filter(function(e,i){ var t=fullText(e).replace(/…$/,''); return !all.some(function(o,j){return j>i&&fullText(o).indexOf(t.slice(0,80))===0&&fullText(o).length>t.length}); }); })();   // a trimmed caveat re-posted in full shows once
    var verdictEv=events.slice().reverse().find(function(e){return e.kind==='verdict'});
    var phases=events.filter(function(e){return e.kind==='phase'});
    var done=s.status==='done';
    var headline=checks.slice().sort(function(a,b){var r={full:0,all:1,security:2,optimisers:3};return (r[a.scope]==null?9:r[a.scope])-(r[b.scope]==null?9:r[b.scope])||b.ts-a.ts})[0];
    var scanned=Math.max.apply(null,[0].concat(checks.map(function(c){return c.scanned||0})));
    var itemsChecked=headline&&headline.coverage&&headline.coverage.total>0?headline.coverage.total:null;   // a 0-item catalogue match is "no coverage", not "0 checked"
    var inspected=itemsChecked&&headline.coverage.verified!=null?headline.coverage.verified:null;

    // a session with no story lines at all (it predates scan stories, or the agent never narrated) must not read as "clean"
    var noStory=!events.length;
    // verdict
    var vtxt=noStory?(done?'No story was recorded for this session — it predates scan stories or the agent did not narrate. Coverage records, if any, are under Coverage.':'Waiting for the first story line…'):verdictEv?fullText(verdictEv):(real.length?(fixedN+' fixed'+(needN?', '+needN+' for your call':'')+(openN?', '+openN+' open':'')+(fpN?', '+fpN+' false alarm'+(fpN>1?'s':'')+' verified':'')):(done?'Clean — nothing from the ledger is present in this project':'Scan in progress'));
    var vcls=noStory?'warn':(openN||(bySev.critical&&!fixedN))?'warn':(real.length&&!openN&&!needN?'ok':(real.length?'warn':'ok'));

    var html='';
    // ---- hero ----
    var donutHtml = headline&&headline.coverage&&headline.coverage.total>0
      ? '<div class="donutwrap" data-tip="'+esc(JSON.stringify({h:'Coverage '+headline.coverage.matched+'/'+headline.coverage.total,d:scopeLabel(headline.scope),w:'How much of the ledger catalogue this scan checked, verified by the server. Full detail under Coverage.'}))+' tabindex="0">'+donut(headline.coverage.matched,headline.coverage.total,'var(--clean)')+'<div class="dl">coverage · '+esc(scopeLabel(headline.scope))+'</div></div>'
      : (real.length ? '<div class="donutwrap" data-tip="'+esc(JSON.stringify({h:'Resolved '+fixedN+'/'+real.length,d:'real issues fixed during the scan',w:'The share of real issues (false alarms excluded) already fixed. The rest are open or waiting on your call.'}))+' tabindex="0">'+donut(fixedN,real.length,'var(--fixed)')+'<div class="dl">resolved</div></div>' : '');
    html+='<div class="card"><div class="hero">'+donutHtml+'<div class="txt">'+
      '<span class="kicker story">📖 Scan story'+(done?'':' · live')+'</span>'+
      '<h1>'+esc(s.app)+(s.project&&norm(s.project)!==norm(s.app)?' <span class="muted" style="font-weight:600">· '+esc(s.project)+'</span>':'')+'</h1>'+
      '<div class="sub">'+esc(s.title||'')+'</div>'+
      '<div class="sub" style="margin-top:4px">'+fullts(s.started)+' · <b>'+dur((s.updated||Date.now())-s.started)+'</b>'+(done?'':' so far')+' · by '+esc(s.agent||'agent')+(scanned?' · '+scanned+' files read':'')+(phases.length?' · '+phases.length+' phases':'')+' · '+events.length+' story lines</div>'+
      '<div class="verdict '+vcls+'">'+(vcls==='ok'?'✓ ':'⚠ ')+esc(vtxt)+'</div>'+
      '<div class="summary" role="group" aria-label="Filter findings by severity or status">'+
        SEVORDER.filter(function(k){return bySev[k]}).map(function(k){return '<button class="chip" type="button" data-filter="sev:'+k+'" data-tip="'+esc(JSON.stringify({h:SEV[k].ic+' '+SEV[k].lbl+' · '+bySev[k],d:SEV[k].do,w:SEV[k].why+' Click to show only these.'}))+'">'+SEV[k].ic+' <span class="n">'+bySev[k]+'</span> '+SEV[k].lbl.toLowerCase()+'</button>'}).join('')+
        (fixedN?'<button class="chip fixedc" type="button" data-filter="st:fixed" data-tip="'+esc(JSON.stringify({h:'🔵 Fixed · '+fixedN,d:'Nothing for you to do',w:'Done during the scan; each one says what was changed. Click to show only these.'}))+'">🔵 <span class="n">'+fixedN+'</span> fixed</button>':'')+
        (needN?'<button class="chip" type="button" data-filter="st:needs-call">⚑ <span class="n">'+needN+'</span> need your call</button>':'')+
        (openN?'<button class="chip" type="button" data-filter="st:open">◌ <span class="n">'+openN+'</span> open</button>':'')+
        (fpN?'<button class="chip" type="button" data-filter="st:false-positive">⊘ <span class="n">'+fpN+'</span> false alarm'+(fpN>1?'s':'')+'</button>':'')+
        (cleans.length?'<button class="chip ok" type="button" data-tab="clean">🟢 <span class="n">'+cleans.length+'</span> families clean</button>':'')+
      '</div></div>'+
      '<div class="meta">'+
        (itemsChecked!=null?tile(itemsChecked,'items checked',''):tile(finds.length,'findings',''))+
        tile(real.length,'real issues',real.length?'warn':'good')+
        tile(fixedN,'fixed','fixed')+
        (inspected!=null?tile(Math.round(inspected/itemsChecked*100)+'%','inspected by reading','gray'):tile(adds.length,'added to ledger',''))+
      '</div></div></div>';

    // ---- what this means for you ----
    html+='<div class="card"><h2>What this means for you</h2><div class="means">';
    if(noStory){
      html+='<div class="tier"><div class="ic">📭</div><div><b>Nothing was narrated for this session.</b><p>The agent ran before scan stories existed, or did not use the story commands, so there is no itemised account to show. Any coverage it posted is under the Coverage tab; newer sweeps narrate themselves automatically.</p></div></div>';
    } else if(!real.length){
      html+='<div class="tier low"><div class="ic">✅</div><div><b>Nothing from the ledger is present in this project'+(done?'':' so far')+'.</b><p>'+(itemsChecked?'All '+itemsChecked+' catalogue items were checked'+(inspected!=null?', '+inspected+' of them by actually reading the code':'')+'.':'Every finding raised was verified as a false alarm or clean.')+(fpN?' '+fpN+' detector hit'+(fpN>1?'s were':' was')+' read and ruled out — no action needed.':'')+'</p></div></div>';
    }
    SEVORDER.filter(function(k){return k!=='info'&&real.some(function(f){return (f.severity||'info')===k})}).forEach(function(k){
      var list=real.filter(function(f){return (f.severity||'info')===k});
      var fx=list.filter(function(f){return f.status==='fixed'||f.status==='applied'}).length, nc=list.filter(function(f){return f.status==='needs-call'}).length, op=list.length-fx-nc;
      var sentence=list.length+' '+SEV[k].lbl.toLowerCase()+' issue'+(list.length>1?'s':'')+' — '+SEV[k].why+' ';
      sentence+=fx===list.length?'All '+(list.length>1?'of them are':'')+' fixed already; nothing for you to do.':((fx?fx+' fixed. ':'')+(nc?nc+' need'+(nc>1?'':'s')+' a decision only you can make. ':'')+(op?op+' still open — '+SEV[k].do.toLowerCase()+'.':''));
      html+='<div class="tier '+k+'"><div class="ic">'+SEV[k].ic+'</div><div><b>'+SEV[k].lbl+' · '+SEV[k].do+'</b><p>'+esc(sentence)+'</p></div></div>';
    });
    if(needN){ html+='<div class="tier"><div class="ic">⚑</div><div><b>'+needN+' decision'+(needN>1?'s':'')+' waiting on you</b><p>'+esc(real.filter(function(f){return f.status==='needs-call'}).map(function(f){return f.title}).join(' · '))+' — each one is explained under Findings with a recommendation.</p></div></div>'; }
    if(fpN){ html+='<div class="tier"><div class="ic">⊘</div><div><b>'+fpN+' detector hit'+(fpN>1?'s':'')+' verified as false alarm'+(fpN>1?'s':'')+'</b><p>The scanner flagged them; the agent read the code and confirmed they are not real. Listed under Findings so you can see the reasoning — nothing to do.</p></div></div>'; }
    if(recN){ html+='<div class="tier"><div class="ic">★</div><div><b>'+recN+' elevation'+(recN>1?'s':'')+' worth applying</b><p>Not bugs — reusable upgrades from the optimiser catalogue this project would genuinely benefit from.</p></div></div>'; }
    if(caveats.length){ html+='<div class="tier"><div class="ic">⚠</div><div><b>'+caveats.length+' honest caveat'+(caveats.length>1?'s':'')+'</b><p>'+esc(caveats.map(fullText).join(' · '))+'</p></div></div>'; }
    html+='</div>'+(noStory?'':progressLine(d,real,fixedN,openN+needN,metrics))+'</div>';

    // ---- better since the scan ----
    if(metrics.length||fixedN){
      html+='<div class="card"><h2>Better since the scan <span class="cnt">before → after</span></h2><div class="metrics">';
      metrics.forEach(function(m){ html+=metricRow(m.title,m.before,m.after,m.detail,m.meta&&m.meta.better==='up'); });
      if(fixedN) html+=metricRow('Issues present in this project',real.length,real.length-fixedN,fixedN+' fixed during the scan'+(openN+needN?'; '+(openN+needN)+' remain':''));
      html+='</div></div>';

  function tile(n,l,cls){return '<div class="tile '+(cls||'')+'"><div class="n">'+n+'</div><div class="l">'+esc(l)+'</div></div>';}

      var left=Math.max(8,Math.min(window.innerWidth-tw-8, r.left+r.width/2-tw/2));
      var top=r.top-th-10; if(top<8){ top=r.bottom+10; tip.classList.add('below'); }
      tip.style.left=left+'px'; tip.style.top=top+'px'; tip.style.setProperty('--ax',Math.max(12,Math.min(tw-12,r.left+r.width/2-left-6))+'px');
      tip.classList.add('show'); cur=el;
    }
    function hide(){ tip.classList.remove('show'); cur=null; setTimeout(function(){ if(!cur) tip.hidden=true; },150); }
    document.addEventListener('mouseover',function(e){ var t=e.target.closest('[data-tip]'); if(t&&t!==cur) show(t); else if(!t&&cur) hide(); });
    document.addEventListener('mouseout',function(e){ var t=e.target.closest('[data-tip]'); if(t&&!(e.relatedTarget&&t.contains(e.relatedTarget))) hide(); });
    document.addEventListener('focusin',function(e){ var t=e.target.closest('[data-tip]'); if(t) show(t); });
    document.addEventListener('focusout',function(e){ if(e.target.closest&&e.target.closest('[data-tip]')) hide(); });
    document.addEventListener('keydown',function(e){ if(e.key==='Escape') hide(); });
    window.addEventListener('scroll',function(){ if(cur) show(cur); },{passive:true});
  })();

  // ---------- interactivity ----------
  var activeFilters={sev:null,st:null,cat:null};
  function activeTab(){var b=$('.tabs [aria-selected="true"]');return b?b.dataset.tab:'findings';}
  function selectTab(name){
    $$('.tabs [role="tab"]').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.tab===name))});
    $$('.panel').forEach(function(p){p.hidden=(p.id!=='p-'+name)});
    try{history.replaceState(null,'',location.pathname+location.search+'#'+name)}catch(e){}
  }
  function applyFilters(){
    var qv=($('#findSearch')&&$('#findSearch').value||'').toLowerCase().trim(); var shown=0;
    $$('#findList li.find').forEach(function(li){
      var ok=(!activeFilters.sev||li.dataset.sev===activeFilters.sev)&&(!activeFilters.st||li.dataset.st===activeFilters.st)&&(!activeFilters.cat||li.dataset.cat===activeFilters.cat)&&(!qv||li.dataset.hay.indexOf(qv)>=0);
      li.hidden=!ok; if(ok)shown++;
    });
    if($('#findEmpty')) $('#findEmpty').hidden=shown>0;
    if($('#findCount')) $('#findCount').textContent=shown+($$('#findList li.find').length!==shown?' of '+$$('#findList li.find').length:'');
    $$('#filters [data-filter]').forEach(function(b){var kv=b.dataset.filter.split(':');b.setAttribute('aria-pressed',String(activeFilters[kv[0]]===kv.slice(1).join(':')))});
    var any=activeFilters.sev||activeFilters.st||activeFilters.cat||qv; if($('#clearFilters')) $('#clearFilters').hidden=!any;
  }
  function setFilter(spec){ var kv=spec.split(':'), k=kv[0], v=kv.slice(1).join(':'); activeFilters[k]=activeFilters[k]===v?null:v; selectTab('findings'); applyFilters(); }
  function wire(finds,s){
    if(window.__storyClick) document.removeEventListener('click',window.__storyClick);   // one live handler, however often the page re-renders
    window.__storyClick=onClick; document.addEventListener('click',onClick);
    function onClick(ev){
      var t=ev.target.closest('[data-tab],[data-filter],[data-copy],[data-prompt],[data-md],#expandAll,#collapseAll,#clearFilters,li.find .head'); if(!t)return;
      if(t.dataset.tab){ selectTab(t.dataset.tab); return; }
      if(t.dataset.filter){ setFilter(t.dataset.filter); return; }
      if(t.dataset.copy){ copy(t.dataset.copy,'Path copied'); return; }
      if(t.dataset.prompt){ copy(fixPrompt(finds[+t.dataset.prompt],s),'Fix prompt copied — paste it to your agent'); return; }
      if(t.dataset.md){ copy(findMd(finds[+t.dataset.md],+t.dataset.md+1),'Finding copied as Markdown'); return; }
      if(t.id==='expandAll'){ $$('#findList li.find').forEach(function(li){li.dataset.open='true';li.querySelector('.head').setAttribute('aria-expanded','true')}); return; }
      if(t.id==='collapseAll'){ $$('#findList li.find').forEach(function(li){li.dataset.open='false';li.querySelector('.head').setAttribute('aria-expanded','false')}); return; }
      if(t.id==='clearFilters'){ activeFilters={sev:null,st:null,cat:null}; if($('#findSearch'))$('#findSearch').value=''; applyFilters(); return; }
      if(t.classList.contains('head')){ if(ev.target.closest('button'))return; var li=t.parentElement; var o=li.dataset.open!=='false'; li.dataset.open=String(!o); t.setAttribute('aria-expanded',String(!o)); }
    }
    document.onkeydown=function(ev){ if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList&&ev.target.classList.contains('head')){ev.preventDefault();ev.target.click();} };
    var si=$('#findSearch'); if(si) si.oninput=applyFilters;
    $('#copyMd').onclick=function(){ copy(storyMd(finds,s),'Whole report copied as Markdown'); };
    $('#printBtn').onclick=function(){ window.print(); };
    var h=(location.hash||'').slice(1); if(h&&$('#p-'+h)) selectTab(h);
  }
  function fixPrompt(f,s){
    return 'In the '+s.app+(s.project?' project ('+s.project+')':'')+', fix this finding from the Bug Ledger scan story '+location.origin+'/story/'+s.id+':\n\n'+
      'Title: '+f.title+'\nSeverity: '+(f.severity||'medium')+(f.category?'\nArea: '+f.category:'')+(f.file?'\nWhere: '+f.file:'')+
      (f.detail?'\nWhat is wrong: '+f.detail:'')+(f.impact?'\nWhy it matters: '+f.impact:'')+(f.fix?'\nRecommended fix: '+f.fix:'')+
      '\n\nMake the smallest correct change, keep existing behaviour and design intact, verify it in the browser, and explain what you changed.';
  }
  function findMd(f,n){
    var sv=SEV[f.severity]?f.severity:'info', st=f.status||'open';
    return n+'. **'+f.title+'** — '+SEV[sv].ic+' '+SEV[sv].lbl+' · '+(ST[st]||ST.open).lbl+(f.category?' · '+f.category:'')+(f.file?' · `'+f.file+'`':'')+'\n'+
      (f.detail?'   - What was wrong: '+f.detail+'\n':'')+(f.impact?'   - Why it matters: '+f.impact+'\n':'')+(f.fix?'   - '+(st==='fixed'||st==='applied'?'What was done':'Recommendation')+': '+f.fix+'\n':'')+(f.verifiedBy?'   - Evidence: '+(EV[f.verifiedBy]||f.verifiedBy)+'\n':'');
  }
  function storyMd(finds,s){
    var d=DATA, ev=d.events||[], real=finds.filter(function(f){return f.status!=='false-positive'});
    var out='# Scan story — '+s.app+(s.project?' · '+s.project:'')+'\n'+fullts(s.started)+' · '+dur((s.updated||Date.now())-s.started)+' · '+esc(s.agent||'agent')+'\n'+location.origin+'/story/'+s.id+'\n\n';
    var v=ev.slice().reverse().find(function(e){return e.kind==='verdict'}); if(v) out+='**Verdict:** '+fullText(v)+'\n\n';
    var m=ev.filter(function(e){return e.kind==='metric'}); if(m.length){ out+='## Better since the scan\n'+m.map(function(x){return '- '+x.title+': '+x.before+' → '+x.after}).join('\n')+'\n\n'; }
    out+='## Findings ('+finds.length+'; '+real.length+' real)\n'+finds.map(findMd).join('')+'\n';
    var c=ev.filter(function(e){return e.kind==='clean'}); if(c.length) out+='## Checked & clean\n'+c.map(function(x){return '- ✅ '+x.title+(x.meta&&x.meta.checked?' ('+x.meta.checked+' checked)':'')}).join('\n')+'\n\n';
    var cv=ev.filter(function(e){return e.kind==='caveat'}); if(cv.length) out+='## Caveats\n'+cv.map(function(x){return '- ⚠ '+fullText(x)}).join('\n')+'\n\n';
    out+='## How the scan unfolded\n'+ev.map(function(e){return '- '+hms(e.ts)+' '+(EVIC[e.kind]||'·')+' '+(e.kind==='found'?'['+(e.severity||'info')+'/'+(e.status||'open')+'] ':'')+(e.title||'')+(e.file?' `'+e.file+'`':'')}).join('\n')+'\n';
    return out;
  }

  // ---------- legacy sweep record (coverage detail) ----------
  var SEVCOLOR={critical:'var(--crit)',high:'var(--high)',medium:'var(--med)',low:'var(--low)'};
  function donut(matched,total,color){
    var r=52,c=2*Math.PI*r,pc=total?matched/total:1,off=c*(1-pc);
    return '<svg class="donut" width="132" height="132" viewBox="0 0 132 132" role="img" aria-label="'+matched+' of '+total+' covered">'+
      '<circle cx="66" cy="66" r="'+r+'" fill="none" stroke="color-mix(in srgb,var(--muted) 18%,transparent)" stroke-width="13"/>'+
      '<circle cx="66" cy="66" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="13" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 66 66)" style="transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)"/>'+
      '<text x="66" y="62" text-anchor="middle" font-size="26" font-weight="800" fill="var(--ink)">'+Math.round(pc*100)+'%</text>'+
      '<text x="66" y="84" text-anchor="middle" font-size="12" fill="var(--muted)">'+matched+'/'+total+'</text></svg>';
  }
  function bars(entries,colorFor){
    var max=Math.max(1,Math.max.apply(null,entries.map(function(e){return e.v})));
    return '<div class="bars">'+entries.map(function(e){return '<div class="barrow"><span class="lab">'+esc(e.k)+'</span><span class="track"><i style="width:'+Math.round(e.v/max*100)+'%;background:'+colorFor(e.k)+'"></i></span><span class="v">'+e.v+'</span></div>';}).join('')+'</div>';
  }
  function trend(points,color){
    if(points.length<2) return '';
    var w=560,h=90,pad=8, xs=points.map(function(p){return p.ts}), vs=points.map(function(p){return p.v});
    var minx=Math.min.apply(null,xs),maxx=Math.max.apply(null,xs),maxv=Math.max(1,Math.max.apply(null,vs));
    var X=function(t){return maxx===minx?w/2:pad+(t-minx)/(maxx-minx)*(w-2*pad)}, Y=function(v){return h-pad-(v/maxv)*(h-2*pad)};
    var d=points.map(function(p,i){return (i?'L':'M')+X(p.ts).toFixed(1)+' '+Y(p.v).toFixed(1)}).join(' ');
    return '<svg width="100%" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="max-width:100%"><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+points.map(function(p){return '<circle cx="'+X(p.ts).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3.5" fill="'+color+'"/>'}).join('')+'</svg>';
  }
  function catOfTitle(cat,title){ var n=norm(title); for(var a in cat.apps){ for(var i=0;i<cat.apps[a].length;i++){ if(norm(cat.apps[a][i].title)===n) return cat.apps[a][i].category; } } return 'other'; }
  function renderCheck(c,checks,cat,submitted,opt){
    opt=opt||{};
    var sec=c.scope==='security', optm=c.scope==='optimisers';
    var cov=c.coverage||{matched:(c.notFound||[]).length+(c.found||[]).length,total:0};
    var found=c.found||[], notFound=c.notFound||[], secF=c.securityFindings||[];
    var color= sec?'var(--red)':optm?'#7c5cff':(c.scope==='all'||c.scope==='full'?'var(--violet)':'var(--good)');
    var complete=cov.total&&cov.matched===cov.total;
    var newSubs=submitted.filter(function(s){return c.sessionId?s.sessionId===c.sessionId:Math.abs(s.ts-c.ts)<30*60000;});
    var fixedCount=found.filter(function(f){return /fix|fixed|added|removed|patched|resolv|throttl|escap|scoped/i.test(f.note||'')}).length;
    var siblings=checks.filter(function(x){return x.app===c.app && (x.scope||'app')===(c.scope||'app') && x.ts<c.ts}).sort(function(a,b){return b.ts-a.ts});
    var prev=siblings[0];
    var series=checks.filter(function(x){return x.app===c.app && (x.scope||'app')===(c.scope||'app') && x.ts<=c.ts}).sort(function(a,b){return a.ts-b.ts}).map(function(x){return {ts:x.ts,v:x.foundCount||0}});
    var dist=[];
    if(sec){ var bysev={}; secF.forEach(function(f){var s=(f.severity||'low');bysev[s]=(bysev[s]||0)+1}); ['critical','high','medium','low'].forEach(function(s){ if(bysev[s]) dist.push({k:s,v:bysev[s]}); }); }
    else { var bycat={}; found.forEach(function(f){var k=catOfTitle(cat,f.title);bycat[k]=(bycat[k]||0)+1}); dist=Object.keys(bycat).map(function(k){return {k:k,v:bycat[k]}}).sort(function(a,b){return b.v-a.v}); }
    function sevOf(title){var n=norm(title);var m=secF.find(function(f){return norm(f.title)===n});return m?m.severity:null;}
    var kicker= sec?'<span class="kicker sec">🛡 Security Sweep</span>':optm?'<span class="kicker opt">✨ Optimiser Sweep</span>':(c.scope==='all'||c.scope==='full'?'<span class="kicker bugs">📚 Full Scan · '+esc(scopeLabel(c.scope))+'</span>':'<span class="kicker bugs">🐛 Bug + Security Check</span>');
    var noun= optm?'elevation to add':'issue';
    var verdict = complete
      ? (found.length? '<div class="verdict warn">'+(optm?'✨ ':'⚠ ')+found.length+' '+noun+(found.length>1?'s':'')+(optm?'':' present')+(fixedCount?(' · '+fixedCount+' fixed'):'')+' · '+cov.matched+'/'+cov.total+' reviewed'+(cov.verified!=null?' · 🔬 '+cov.verified+' inspected':'')+'</div>'
                     : '<div class="verdict ok">✓ '+(optm?'Fully elevated — every optimiser already applied':'Clean — 0 issues present')+' · full coverage '+cov.matched+'/'+cov.total+'</div>')
      : '<div class="verdict warn">⚠ Incomplete — '+cov.matched+'/'+cov.total+' reviewed</div>';
    var html='';
    var wrapO=opt.embedded?'<div class="card" style="box-shadow:none;animation:none">':'<div class="card">', wrapC='</div>';
    html+=wrapO+'<div class="hero">'+donut(cov.matched,cov.total,color)+'<div class="txt">'+kicker+
        (opt.embedded?'<h2 style="margin-top:8px">'+esc(c.app)+' · '+esc(scopeLabel(c.scope))+'</h2>':'<h1>'+esc(c.app)+(c.project?' <span class="muted" style="font-weight:600">· '+esc(c.project)+'</span>':'')+'</h1>')+
        '<div class="sub">'+fullts(c.ts)+' · by '+esc(c.checkedBy||'agent')+' · '+(c.scanned||0)+' files scanned</div>'+verdict+(c.notes?'<p class="muted" style="margin-top:8px;font-size:14px">'+esc(c.notes)+'</p>':'')+'</div></div>'+wrapC;
    html+=wrapO+'<div class="grid">'+tile(cov.total,'items checked')+tile(found.length,'present',found.length?'warn':'good')+tile(fixedCount,'fixed','good')+tile(newSubs.length,'added to ledger','')+tile(notFound.length,'clean','good')+tile((cov.total?Math.round(cov.matched/cov.total*100):100)+'%','coverage')+(cov.verified!=null?tile(cov.verifiedPct+'%','inspected','gray'):'')+'</div>'+wrapC;
    if(cov.evidence){ var ev=cov.evidence; var ent=['detector','code-read','test','reasoned','assumed'].filter(function(k){return ev[k]}).map(function(k){return {k:EV[k]||k,v:ev[k]}}); if(ent.length) html+=wrapO+'<h2>Evidence behind the coverage</h2>'+bars(ent,function(k){return k==='reasoned'||k==='assumed'?'var(--muted)':'var(--good)'})+wrapC; }
    if(found.length){
      html+=wrapO+'<h2>Present in this project <span class="cnt">'+found.length+'</span></h2><ul class="plain">'+
        found.map(function(f){var s=sec?sevOf(f.title):null; var fixed=/fix|fixed|added|removed|patched|resolv|throttl|escap|scoped/i.test(f.note||'');
          return '<li><div class="ft">'+(s?sevPill(s):'')+'<b>'+esc(f.title)+'</b>'+(f.file?' <span class="chip mono">'+esc(f.file)+'</span>':'')+(f.verifiedBy?evChip(f.verifiedBy):'')+(fixed?' '+stPill('fixed'):'')+'</div>'+(f.note?'<div class="note">'+esc(f.note)+'</div>':'')+'</li>';
        }).join('')+'</ul>'+wrapC;
    } else html+=wrapO+'<div class="center"><h2 style="margin:0;justify-content:center">✓ No known '+(sec?'security issues':optm?'missing elevations':'bugs')+' present in this project</h2><p class="muted" style="margin:6px 0 0">All '+cov.total+' catalogue items were checked and none reproduced here.</p></div>'+wrapC;
    if(dist.length) html+=wrapO+'<h2>'+(sec?'Findings by severity':'Findings by category')+'</h2>'+bars(dist,function(k){return sec?(SEVCOLOR[k]||'var(--low)'):'linear-gradient(90deg,var(--violet),#b3a3ff)'})+wrapC;
    html+=wrapO+'<h2>Compared to the last sweep of this scope</h2>';
    if(prev){
      var d=found.length-(prev.foundCount||0), dc=d<0?'down':(d>0?'up':'flat'), dt=d<0?('↓ '+(-d)+' fewer'):(d>0?('↑ '+d+' more'):'no change');
      var prevTitles=new Set((prev.found||[]).map(function(f){return norm(f.title)})), nowTitles=new Set(found.map(function(f){return norm(f.title)}));
      var resolved=(prev.found||[]).filter(function(f){return !nowTitles.has(norm(f.title))}), appeared=found.filter(function(f){return !prevTitles.has(norm(f.title))});
      html+='<div class="cmp"><div><div class="muted" style="font-size:12px">'+shortts(prev.ts)+'</div><div class="big muted">'+(prev.foundCount||0)+'</div><div class="muted" style="font-size:12px">then present</div></div><div style="font-size:22px;color:var(--muted)">→</div><div><div class="muted" style="font-size:12px">now</div><div class="big">'+found.length+'</div><div class="muted" style="font-size:12px">present</div></div><div class="delta '+dc+'">'+dt+'</div></div>'+
        '<div class="twocol" style="margin-top:12px"><div><b>Resolved since last ('+resolved.length+')</b><ul class="mini">'+(resolved.length?resolved.map(function(f){return '<li>✓ '+esc(f.title)+'</li>'}).join(''):'<li>—</li>')+'</ul></div><div><b>New since last ('+appeared.length+')</b><ul class="mini">'+(appeared.length?appeared.map(function(f){return '<li>⚠ '+esc(f.title)+'</li>'}).join(''):'<li>—</li>')+'</ul></div></div>';
    } else html+='<p class="muted">This is the <b>first sweep</b> for this project + scope. Future sweeps will compare here — resolved vs new — so you can watch it improve.</p>';
    var tr=trend(series,color); if(tr) html+='<div style="margin-top:14px"><div class="muted" style="font-size:12px;margin-bottom:4px">Present issues over the last '+series.length+' sweeps</div>'+tr+'</div>';
    html+=wrapC;
    if(opt.standalone){
      var kindOf=function(s){return s.kind==='optimiser'?'optimiser':(s.kind==='security'||s.category==='security'?'security':'bug');};
      html+=wrapO+'<h2>Added to the ledger from this sweep <span class="cnt">'+newSubs.length+'</span></h2>'+(newSubs.length?'<ul class="plain">'+newSubs.map(function(s){return '<li><div class="ft"><span class="chip add">'+kindOf(s)+'</span>'+(s.severity&&kindOf(s)!=='optimiser'?sevPill(s.severity):'')+'<b>'+esc(s.title)+'</b>'+(s.file?' <span class="chip mono">'+esc(s.file)+'</span>':'')+'</div>'+(s.symptom?'<div class="note">'+esc(s.symptom)+'</div>':'')+'</li>'}).join('')+'</ul>':'<p class="muted" style="margin:0">Nothing new added — everything found was already in the catalogue.</p>')+wrapC;
      if(notFound.length) html+='<details class="card"><summary style="cursor:pointer;font-weight:750">'+notFound.length+' items checked &amp; clean</summary><ul class="mini" style="margin-top:10px;columns:2">'+notFound.slice(0,600).map(function(t){return '<li>✓ '+esc(String(typeof t==='string'?t:t.title).replace(/ \(static check clean\)$/,''))+'</li>'}).join('')+'</ul></details>';
    }
    return html;
  }
</script>
