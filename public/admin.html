<style>

  .spark{display:block;margin-top:6px}

  .caret{display:inline-block;transition:transform .2s;color:var(--muted);font-size:12px;margin-left:4px}

  table.hm td.lab{padding:0 10px;text-align:left;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis;font-weight:600;position:sticky;left:0;background:var(--bg)}
  table.hm td.cell{cursor:pointer;color:var(--ink);font-weight:700}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px;align-items:center}
  .legend span i{display:inline-block;width:14px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}
  .empty{padding:30px;text-align:center;color:var(--muted)}
  .gate{max-width:520px;margin:12vh auto}
  .gate input{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);margin:8px 0}
  .btn{font:inherit;font-weight:700;padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:var(--ink);color:var(--bg);cursor:pointer}

  .an{display:grid;gap:8px}
  .anrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card2);font-size:13.5px}
  .anrow .k{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px}
  .anrow .k.check{color:var(--good);background:rgba(18,184,134,.14)} .anrow .k.story{color:var(--crit);background:rgba(180,34,122,.12)}
  .anrow .hits{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .anrow a{color:var(--coral);font-weight:700;text-decoration:none;white-space:nowrap}
  .tl{width:100%;height:160px}
  .badge{display:inline-flex;align-items:center;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:2px}
  .badge.new{color:#fff;background:var(--coral)} .badge.grew{color:var(--coral);background:color-mix(in srgb,var(--coral) 14%,transparent)}
  .since{border:1px solid color-mix(in srgb,var(--coral) 40%,transparent);background:color-mix(in srgb,var(--coral) 7%,transparent)}
  .since .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  @keyframes beat{0%{box-shadow:0 0 0 0 rgba(18,184,134,.55)}70%{box-shadow:0 0 0 8px rgba(18,184,134,0)}100%{box-shadow:0 0 0 0 rgba(18,184,134,0)}}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);opacity:0;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13.5px;font-weight:700;transition:.25s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}
  @media (pointer:coarse){input,select,textarea{font-size:16px}}   /* iOS: no focus zoom */
</style>

<div class="aurora"><span class="a"></span><span class="b"></span><span class="c"></span></div>
<div class="wrap">
  <header class="top"><div class="brand">Bug Ledger<span class="dot">.</span> <small>Admin</small></div>
    <nav><a href="/">The ledger</a><a href="/timeline">Activity</a><a href="/live">Live</a><span class="watch" id="watch" hidden><i></i><span>watching for new reports</span></span><button type="button" id="refresh">↻ Re-read all reports</button><button type="button" id="exportJson">⇩ JSON</button><button type="button" id="exportCsv">⇩ CSV</button><button type="button" id="signout" title="Forget the admin key on this device">Sign out</button></nav></header>
  <main id="app"><div class="spin"></div></main>
  <div class="foot">Admin view · every instance from the catalogue, the harvester, the scanner, agent submissions, check-logs and scan stories, clustered into bug classes. Read-only. · <a href="/AGENT.md">protocol</a></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
  var $=function(s,r){return (r||document).querySelector(s)}, $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function dts(ts){if(!ts)return '—';var d=new Date(ts);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();}
  function mkey(ts){var d=new Date(ts);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);}
  function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},1500);}
  var SRC=['catalogue','harvested','scanner','submitted','check','story'];
  var SRCLBL={catalogue:'Catalogue (curated)',harvested:'Auto-harvested',scanner:'Scanner',submitted:'Agent-submitted',check:'Check-log',story:'Scan story'};
  var SEVR={critical:0,high:1,medium:2,low:3,info:4};

  // ---------- key gate ----------
  var KEY=null; try{KEY=localStorage.getItem('bl_admin_key')}catch(e){}
  function gate(msg){
    $('#app').innerHTML='<div class="card gate"><h1>Admin</h1><p class="lede">This view reads every tier of the ledger at once. Paste the ledger write key (the <code>token</code> in <code>~/.bugledger.json</code>). It is kept only in this browser.</p>'+(msg?'<p style="color:var(--red);font-weight:700">'+esc(msg)+'</p>':'')+
      '<form id="gate"><input type="password" id="key" autocomplete="off" placeholder="x-ledger-key" aria-label="Ledger key"><div style="display:flex;gap:8px;justify-content:flex-end"><a class="btn ghost" href="/" style="text-decoration:none">Back</a><button class="btn" type="submit">Open admin</button></div></form></div>';
    $('#gate').onsubmit=function(e){e.preventDefault();KEY=$('#key').value.trim();try{localStorage.setItem('bl_admin_key',KEY)}catch(x){} load();};
  }
  $('#refresh').onclick=function(){ toast('Re-reading every report…'); load(); };
  $('#signout').onclick=function(){try{localStorage.removeItem('bl_admin_key')}catch(e){}KEY=null;gate();};
  function load(){
    if(!KEY){gate();return;}
    $('#app').innerHTML='<div class="spin"></div>';
    fetch('/api/admin/recurrence',{headers:{'x-ledger-key':KEY},cache:'no-store'}).then(function(r){if(r.status===401){gate('That key was not accepted.');throw 0;}return r.json();})
      .then(function(d){ if(!d||!d.ok){$('#app').innerHTML='<div class="card empty">Could not load: '+esc(d&&d.error)+'</div>';return;} build(d); watch(); })
      .catch(function(e){ if(e!==0) $('#app').innerHTML='<div class="card empty">Could not load — <a href="#" onclick="load();return false">retry</a></div>'; });
  }
  load();

  // ---------- clustering ----------
  var STOP=new Set('the a an of in on at to for and or with without from by is are was were be been no not into over under after before when while that this these those it its as via vs than then so if do does did has have had can could should would will may might per each every any all some more most less least only just also still yet again once about across against between within out up down off very'.split(' '));
  function stem(w){return w.replace(/(ing|ed|es|s)$/,'').replace(/(tion|sion)$/,'t');}
  function tokens(t){var s=String(t||'').toLowerCase().replace(/[×x]\s*\d+\s*$/,'').replace(/[^a-z0-9 ]+/g,' ').split(/\s+/).filter(function(w){return w.length>=3&&!STOP.has(w)}).map(stem);return Array.from(new Set(s));}
  function canonApps(inst){
    var groups=Object.create(null); inst.forEach(function(i){var k=String(i.app||'?').toLowerCase().replace(/[^a-z0-9]+/g,''); (groups[k]=groups[k]||Object.create(null)); groups[k][i.app]=(groups[k][i.app]||0)+1;});
    var map=Object.create(null); Object.keys(groups).forEach(function(k){ var names=Object.keys(groups[k]); names.sort(function(a,b){ var sa=/\s/.test(a)?2:0, sb=/\s/.test(b)?2:0; var ca=/[A-Z]/.test(a)?1:0, cb=/[A-Z]/.test(b)?1:0; return (sb+cb)-(sa+ca)||groups[k][b]-groups[k][a]; }); names.forEach(function(n){map[n]=names[0]}); });
    return map;
  }
  function cluster(inst){
    var n=inst.length, parent=new Array(n); for(var i=0;i<n;i++)parent[i]=i;
    function find(x){while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x];}return x;}
    function union(a,b){a=find(a);b=find(b);if(a!==b)parent[b]=a;}
    var toks=inst.map(function(i){return tokens(i.title)}), sets=toks.map(function(t){return new Set(t)});
    // 1. same detector id → same class
    var byDet=Object.create(null); inst.forEach(function(i,ix){ if(i.detector){ var k='det:'+i.detector; if(byDet[k]!=null) union(byDet[k],ix); else byDet[k]=ix; } });
    // 2. exact normalised title
    var byNorm=Object.create(null); inst.forEach(function(i,ix){ var k=String(i.title||'').toLowerCase().replace(/[×x]\s*\d+\s*$/,'').replace(/[^a-z0-9]+/g,''); if(!k)return; if(byNorm[k]!=null) union(byNorm[k],ix); else byNorm[k]=ix; });
    // 3. fuzzy: shared rare tokens → Jaccard ≥ .5, or containment ≥ .8 with ≥3 tokens
    var inv=Object.create(null); toks.forEach(function(t,ix){t.forEach(function(w){(inv[w]=inv[w]||[]).push(ix)})});
    Object.keys(inv).forEach(function(w){ var list=inv[w]; if(list.length>80||list.length<2)return;
      for(var a=0;a<list.length;a++)for(var b=a+1;b<list.length;b++){ var i=list[a],j=list[b]; if(find(i)===find(j))continue; var A=sets[i],B=sets[j]; if(A.size<2||B.size<2)continue; var inter=0; A.forEach(function(x){if(B.has(x))inter++}); var uni=A.size+B.size-inter; var jac=inter/uni, cont=inter/Math.min(A.size,B.size); if(jac>=0.5||(cont>=0.8&&Math.min(A.size,B.size)>=3)) union(i,j); } });
    var groups=Object.create(null); inst.forEach(function(i,ix){var r=find(ix);(groups[r]=groups[r]||[]).push(i)});
    return Object.keys(groups).map(function(k){return groups[k]});
  }
  function mode(arr){var m=Object.create(null),best=null,bn=0;arr.forEach(function(x){if(!x)return;m[x]=(m[x]||0)+1;if(m[x]>bn){bn=m[x];best=x}});return best;}
  function build(d){
    var appMap=canonApps(d.instances); d.instances.forEach(function(i){i.appC=appMap[i.app]||i.app||'?'});
    var groups=cluster(d.instances);

    $('#srctiles').innerHTML=SRC.map(function(s){return '<div class="tile"><div class="n" style="color:var(--s-'+s+')">'+(tot[s]||0)+'</div><div class="l">'+esc(SRCLBL[s])+' instances</div><div class="l">'+(only[s]||0)+' classes seen only here</div></div>'}).join('');
  }
  function selectTab(name){$$('.tabs [role="tab"]').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.tab===name))});$$('.panel').forEach(function(p){p.hidden=(p.id!=='p-'+name)});try{history.replaceState(null,'','#'+name)}catch(e){}}
  function goClass(ix,app){ F.min=1; if(app){F.app=app;} $('#min').value='1'; if(app)$('#fapp').value=app; F.q=''; $('#q').value=''; renderClasses(); selectTab('classes'); var el=document.getElementById('c'+ix); if(el){el.dataset.open='true';el.scrollIntoView({behavior:'smooth',block:'start'});} }
  function wire(){
    $('#q').oninput=function(){F.q=this.value;renderClasses()}; $('#min').onchange=function(){F.min=+this.value;renderClasses()}; $('#sort').onchange=function(){F.sort=this.value;renderClasses()};
    $('#cat').onchange=function(){F.cat=this.value||null;renderClasses()}; var ms=$('#markSeen'); if(ms) ms.onclick=markSeen; $('#fapp').onchange=function(){F.app=this.value||null;renderClasses()};
    document.onclick=function(ev){ var t=ev.target.closest('[data-tab],[data-src],[data-go],li.cls .head'); if(!t)return;
      if(t.dataset.tab){selectTab(t.dataset.tab);return;} if(t.dataset.src){F.src=F.src===t.dataset.src?null:t.dataset.src;$$('[data-src]').forEach(function(b){b.setAttribute('aria-pressed',String(F.src===b.dataset.src))});renderClasses();return;}
      if(t.dataset.go){goClass(+t.dataset.go,t.dataset.app);return;}
      if(t.classList.contains('head')){var li=t.parentElement,o=li.dataset.open!=='false';li.dataset.open=String(!o);t.setAttribute('aria-expanded',String(!o));} };
    document.onkeydown=function(ev){if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList&&ev.target.classList.contains('head')){ev.preventDefault();ev.target.click();}};
  }
  function exportRows(){ return window.__DATA.classes.map(function(c){return {title:c.title,category:c.cat,severity:c.sev,detector:c.det,apps:Object.keys(c.apps),appCount:c.nApps,instances:c.n,analyses:c.refs.length,firstSeen:c.first?new Date(c.first).toISOString():null,lastSeen:c.last?new Date(c.last).toISOString():null,sources:c.srcs}}); }
  function download(name,text,type){ var b=new Blob([text],{type:type}); var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast('Downloaded '+name); }
  $('#exportJson').onclick=function(){ if(!window.__DATA)return; download('bugledger-recurrence.json',JSON.stringify({generated:new Date().toISOString(),classes:exportRows()},null,2),'application/json'); };
  $('#exportCsv').onclick=function(){ if(!window.__DATA)return; var rows=exportRows(); var csv=['title,category,severity,detector,appCount,apps,instances,analyses,firstSeen,lastSeen'].concat(rows.map(function(r){return [r.title,r.category,r.severity||'',r.detector||'',r.appCount,r.apps.join('; '),r.instances,r.analyses,r.firstSeen||'',r.lastSeen||''].map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',')})).join('\n'); download('bugledger-recurrence.csv',csv,'text/csv'); };
</script>
</body>
