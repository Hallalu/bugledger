<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin · Breadledger</title>
<meta name="description" content="Breadledger admin — the same bug popping up across different apps and different analyses.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/bread.css">
<script src="/bread-shell.js"></script>
<style>
  /* Source hues: six distinct colours from the design palette, defined once. Dark mode swaps the accent for its
     text shade so the number tiles keep 4.5:1 on the panel. --heat-on is the ink on a solid heat cell. */
  :root{--src-catalogue:var(--accent);--src-harvested:var(--info);--src-scanner:var(--warn);--src-submitted:var(--danger);--src-check:var(--ok);--src-story:var(--sev-critical);--heat-on:var(--accent-on)}
  :root[data-theme="dark"]{--src-catalogue:var(--accent-text);--heat-on:var(--bg)}
  .s-catalogue{background:var(--src-catalogue)}.s-harvested{background:var(--src-harvested)}.s-scanner{background:var(--src-scanner)}.s-submitted{background:var(--src-submitted)}.s-check{background:var(--src-check)}.s-story{background:var(--src-story)}
  .src{display:inline-block;width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .srcn{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}

  /* top-bar tools (moved under the top bar on phones so every action keeps its text) */
  .adm-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .watch{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-3);white-space:nowrap;padding:0 4px}
  #toolsSlot{margin:0 0 14px}
  #toolsSlot:empty{display:none}

  /* key gate */
  .gate{max-width:420px;margin:6vh auto 0}
  .gate .card-b{display:grid;gap:14px}
  .gate p{color:var(--ink-2);font-size:14.5px;line-height:1.55}
  .gate .row{justify-content:flex-end}

  /* shared bits */
  .card-h svg.ico{color:var(--ink-3)}
  .chip svg.ico{width:14px;height:14px}
  .badge svg.ico{width:13px;height:13px}
  a.chip:hover{text-decoration:none}
  .lead{color:var(--ink-3);font-size:14.5px;line-height:1.55;max-width:84ch;margin:0 0 14px}
  .card-b>.lead:last-child,.panel>.lead:last-child{margin-bottom:0}
  .panel>.section-h:first-child{margin-top:4px}
  .panel .stats,.card-b .stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .card-b .stats:last-child{margin-bottom:0}
  .stat.plain{cursor:default}.stat.plain:hover{transform:none;border-color:var(--line)}
  .stat.hot .n{color:var(--danger-ink)}.stat.vio .n{color:var(--accent-text)}
  .stat.s-ink-catalogue .n{color:var(--src-catalogue)}.stat.s-ink-harvested .n{color:var(--src-harvested)}.stat.s-ink-scanner .n{color:var(--src-scanner)}
  .stat.s-ink-submitted .n{color:var(--src-submitted)}.stat.s-ink-check .n{color:var(--src-check)}.stat.s-ink-story .n{color:var(--src-story)}
  .adm-top{margin-top:14px;color:var(--ink-2);font-size:14.5px}
  .adm-top b{color:var(--ink);font-weight:600}
  .adm-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .adm-chips .chip,.hits .chip{max-width:100%}
  .adm-chips .chip .truncate,.hits .chip .truncate{min-width:0}
  .adm-chips .badge{flex:0 0 auto}
  .adm-foot{margin-top:28px;text-align:center}

  /* tabs: sticky under the top bar on desktop; the classes filter bar sits under the tabs */
  .adm-tabbar{position:sticky;top:var(--topbar);z-index:20;padding:8px 0;margin:0 0 12px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .adm-tabbar .seg button .n{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .adm-tabbar .seg button.on .n{color:var(--ink-2)}
  .panel[hidden]{display:none}
  #p-classes .filters{top:calc(var(--topbar) + var(--adm-tabs,50px))}
  .adm-srcs{display:flex;flex-wrap:wrap;gap:6px;width:100%}

  /* class rows */
  ol.adm-classes{list-style:none;margin:0;padding:0}
  .cls+.cls{border-top:1px solid var(--line)}
  .cls{scroll-margin-top:calc(var(--topbar) + var(--adm-tabs,50px) + var(--adm-filters,0px) + 8px)}
  .cls .head{grid-template-columns:auto auto minmax(0,1fr) auto auto;align-items:center;padding:10px 14px;border-top:0}
  .cls .head:focus-visible{outline-offset:-2px}
  .cls .num{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:26px;text-align:right}
  .cls .sev{width:16px;height:16px}
  .cls .tw{min-width:0}
  .cls .t .badge{margin-left:8px;vertical-align:2px}
  .cls .sub .sv{font-weight:550;color:var(--ink-2)}
  .cls .sub .sv.critical{color:var(--sev-critical-ink)}.cls .sub .sv.high{color:var(--sev-high-ink)}.cls .sub .sv.medium{color:var(--sev-medium-ink)}.cls .sub .sv.low{color:var(--sev-low-ink)}
  .sev.info i{background:var(--ink-3)}
  .cls .side{display:grid;grid-template-columns:auto auto;gap:2px 12px;align-items:center;justify-self:end;text-align:right}
  .cls .side .big{font-size:17px;font-weight:650;color:var(--danger-ink);letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;grid-column:2}
  .cls .side .big.one{color:var(--ink-3)}
  .cls .side .s{font-size:13px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums;grid-column:2}
  .cls .side .spark{grid-column:1;grid-row:1/3;display:block}
  .cls .chev{width:18px;height:18px;color:var(--ink-3);transition:transform var(--t-fast)}
  .cls .chev svg{width:18px;height:18px;display:block}
  .cls[data-open="false"] .chev{transform:rotate(-90deg)}
  .cls[data-open="true"] .head .t,.cls[data-open="true"] .head .sub{white-space:normal;overflow:visible;text-overflow:clip}
  .cls[data-open="true"] .head .t{text-wrap:pretty}
  .cls[data-open="false"] .body{display:none}
  .cls .body{padding:12px 16px 16px;border-top:1px solid var(--line);background:var(--bg-2);display:grid;gap:10px}
  .appchips{display:flex;flex-wrap:wrap;gap:6px}
  .appchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent-soft-ink);font-size:13px;font-weight:550;white-space:nowrap}
  .appchip b{font-weight:700;font-variant-numeric:tabular-nums}
  .srcbar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--line)}
  .srcbar i{display:block;height:100%}
  .cls .body .table{font-size:13.5px}
  .cls .body .table th,.heat .table th{top:0}
  .cls .body .table td{min-width:120px}
  .cls .body .table td.rec{min-width:260px}
  .cls .body .table td.when{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-2)}
  .cls .body .table .note-t{font-size:13px;color:var(--ink-3);margin-top:2px}
  .cls .body .table a{font-weight:600;white-space:nowrap}

  /* heatmap */
  .heat .table{width:auto;min-width:100%;font-size:13px}
  .heat th.rot{writing-mode:vertical-rl;transform:rotate(180deg);height:160px;max-width:32px;padding:8px 6px;position:static;text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--panel);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0}
  .heat th.lab,.heat td.lab{position:sticky;left:0;z-index:2;background:var(--panel);text-align:left;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis;font-weight:550;padding:0 12px;font-size:13.5px;border-left:0}
  .heat thead th.lab{z-index:3;top:auto;border-bottom:0}
  .heat tr:hover td.lab{background:var(--panel-2)}
  .heat td{padding:0;border-bottom:1px solid var(--line);border-left:1px solid var(--line);height:30px;min-width:30px;text-align:center;font-variant-numeric:tabular-nums;vertical-align:middle}
  .heat td.c1,.heat tr:hover td.c1,.legend i.c1{background:color-mix(in srgb,var(--danger) 25%,var(--panel))}
  .heat td.c2,.heat tr:hover td.c2,.legend i.c2{background:color-mix(in srgb,var(--danger) 55%,var(--panel))}
  .heat td.c3,.heat tr:hover td.c3,.legend i.c3{background:var(--danger)}
  .heat td.c3{color:var(--heat-on)}
  .heat .hcell{display:block;width:100%;height:30px;min-width:30px;border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:inherit;cursor:pointer;padding:0}
  .heat .hcell:focus-visible{outline-offset:-2px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);align-items:center;margin-top:10px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{display:inline-block;width:14px;height:10px;border-radius:3px}

  /* by analysis */
  .an{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:12px 14px;align-items:start}
  .an+.an{border-top:1px solid var(--line)}
  .an .line{font-size:14.5px;line-height:1.45}
  .an .line b{font-weight:600}
  .hits{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .an .right{display:grid;gap:4px;justify-items:end;text-align:right;white-space:nowrap}
  .an .right a{font-weight:600}

  /* over time */
  #tl{overflow:hidden}
  .tl{display:block;max-width:100%}

  @media (max-width:900px){
    .adm-tabbar{position:static;padding:0}
    .adm-tabbar .seg{display:flex;flex-wrap:wrap}
    .adm-srcs{grid-column:1/-1}
    .cls{scroll-margin-top:calc(var(--topbar) + 8px)}
    .cls .head{grid-template-columns:auto auto minmax(0,1fr) auto;padding:10px 12px;align-items:start}
    .cls .num,.cls .sev,.cls .chev{margin-top:2px}
    .cls .num{grid-column:1;grid-row:1}.cls .sev{grid-column:2;grid-row:1}.cls .tw{grid-column:3;grid-row:1}.cls .chev{grid-column:4;grid-row:1}
    .cls .side{grid-column:3;grid-row:2;justify-self:start;text-align:left;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;max-width:100%}
    .cls .side .big,.cls .side .s{white-space:normal}
    .cls .body{padding:10px 12px 12px}
    .heat th.lab,.heat td.lab{max-width:180px}
    .an{grid-template-columns:auto minmax(0,1fr)}
    .an .right{grid-column:2;justify-items:start;text-align:left;display:flex;gap:10px;align-items:center}
    .gate{margin-top:3vh}
  }
</style>
</head>
<body>
<div class="bl-app" id="app">
  <aside class="bl-side" id="side" aria-label="Sidebar"></aside>
  <div class="bl-main">
    <header class="bl-top" id="top"></header>
    <main class="bl-content wide" id="page">
      <div id="toolsSlot"></div>
      <div id="view"></div>
      <p class="meta adm-foot">Admin view · every instance from the catalogue, the harvester, the scanner, agent submissions, check-logs and scan stories, clustered into bug classes. Read-only. · <a href="/AGENT.md">protocol</a></p>
    </main>
  </div>
</div>
<script>
  var $=Bread.$, $$=Bread.$$, esc=Bread.esc, icon=Bread.icon;
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function dts(ts){return ts?Bread.fmtDate(ts):'—';}
  function mkey(ts){var d=new Date(ts);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);}
  function toast(m,kind){Bread.toast(m,kind);}
  var SRC=['catalogue','harvested','scanner','submitted','check','story'];
  var SRCLBL={catalogue:'Catalogue (curated)',harvested:'Auto-harvested',scanner:'Scanner',submitted:'Agent-submitted',check:'Check-log',story:'Scan story'};
  var SEVR={critical:0,high:1,medium:2,low:3,info:4};

  // ---------- shell ----------
  var TOOLS='<div class="adm-tools" id="tools"><span class="watch" id="watch" hidden><span class="pip live"></span><span>watching for new reports</span></span>'+
    '<button class="btn" type="button" id="refresh" title="Re-read all reports">'+icon('reset')+'Re-read</button>'+
    '<button class="btn" type="button" id="exportJson" title="Download every bug class as JSON">'+icon('download')+'JSON</button>'+
    '<button class="btn" type="button" id="exportCsv" title="Download every bug class as CSV">'+icon('download')+'CSV</button>'+
    '<button class="btn" type="button" id="signout" title="Forget the admin key on this device">'+icon('logout')+'Sign out</button></div>';
  Bread.mount({active:'admin',title:'Admin',crumbs:['Admin'],actions:TOOLS});
  var MQ=window.matchMedia('(max-width:900px)');
  function placeTools(){var t=$('#tools');if(!t)return;var slot=MQ.matches?$('#toolsSlot'):$('#top .actions');if(slot&&t.parentNode!==slot)slot.appendChild(t);}
  try{MQ.addEventListener('change',placeTools)}catch(e){MQ.addListener(placeTools)} placeTools();
  function measure(){var tb=$('.adm-tabbar'),f=$('#p-classes .filters'),r=document.documentElement.style;r.setProperty('--adm-tabs',(tb?tb.offsetHeight:0)+'px');r.setProperty('--adm-filters',(f?f.offsetHeight:0)+'px');}
  window.addEventListener('resize',Bread.debounce(function(){measure();if(window.__DATA&&activeTab()==='timeline')renderTimeline();},150));

  // ---------- key gate ----------
  var KEY=null; try{KEY=localStorage.getItem('bl_admin_key')}catch(e){}
  function gate(msg){
    var w=$('#watch'); if(w) w.hidden=true;
    $('#view').innerHTML='<div class="gate"><form class="card" id="gate" novalidate><div class="card-h">'+icon('lock')+'<h1>Admin</h1></div><div class="card-b">'+
      '<p>This view reads every tier of the ledger at once. Paste the ledger write key (the <code>token</code> in <code>~/.bugledger.json</code>). It is kept only in this browser.</p>'+
      (msg?'<div class="note danger" role="alert">'+icon('alert')+'<span>'+esc(msg)+'</span></div>':'')+
      '<div class="field"><label for="key">Ledger key</label><input class="input" type="password" id="key" autocomplete="off" placeholder="x-ledger-key"></div>'+
      '<div class="row"><a class="btn" href="/">'+icon('left')+'Back</a><button class="btn primary" type="submit">'+icon('lock')+'Open admin</button></div></div></form></div>';
    $('#gate').onsubmit=function(e){e.preventDefault();KEY=$('#key').value.trim();if(!KEY)return;try{localStorage.setItem('bl_admin_key',KEY)}catch(x){} load();};
    setTimeout(function(){var k=$('#key');if(k)k.focus();},30);
  }
  $('#refresh').onclick=function(){ toast('Re-reading every report…'); load(); };
  $('#signout').onclick=function(){try{localStorage.removeItem('bl_admin_key')}catch(e){}KEY=null;gate();};
  function fail(msg){ $('#view').innerHTML='<div class="note danger" role="alert">'+icon('alert')+'<span class="grow">'+esc(msg)+'</span><button class="btn" type="button" id="retry">'+icon('reset')+'Retry</button></div>'; $('#retry').onclick=function(){load()}; }
  function load(){
    if(!KEY){gate();return;}
    $('#view').innerHTML=Bread.empty('Loading…','Reading every tier of the ledger.','ledger');
    fetch('/api/admin/recurrence',{headers:{'x-ledger-key':KEY},cache:'no-store'}).then(function(r){if(r.status===401){gate('That key was not accepted.');throw 0;}return r.json();})
      .then(function(d){ if(!d||!d.ok){fail('Could not load: '+(d&&d.error||'unknown error'));return;} build(d); watch(); })
      .catch(function(e){ if(e!==0) fail('Could not load'); });
  }
  window.addEventListener('bread:key',function(){try{KEY=localStorage.getItem('bl_admin_key')}catch(e){} load();});
  load();

  // ---------- clustering ----------
  var STOP=new Set('the a an of in on at to for and or with without from by is are was were be been no not into over under after before when while that this these those it its as via vs than then so if do does did has have had can could should would will may might per each every any all some more most less least only just also still yet again once about across against between within out up down off very'.split(' '));
  function stem(w){return w.replace(/(ing|ed|es|s)$/,'').replace(/(tion|sion)$/,'t');}
  function tokens(t){var s=String(t||'').toLowerCase().replace(/[×x]\s*\d+\s*$/,'').replace(/[^a-z0-9 ]+/g,' ').split(/\s+/).filter(function(w){return w.length>=3&&!STOP.has(w)}).map(stem);return Array.from(new Set(s));}
  function canonApps(inst){
    var groups=Object.create(null); inst.forEach(function(i){var k=String(i.app||'?').toLowerCase().replace(/[^a-z0-9]+/g,''); (groups[k]=groups[k]||Object.create(null)); groups[k][i.app]=(groups[k][i.app]||0)+1;});
    var map=Object.create(null); Object.keys(groups).forEach(function(k){ var names=Object.keys(groups[k]); names.sort(function(a,b){ var sa=/\s/.test(a)?2:0, sb=/\s/.test(b)?2:0; var ca=/[A-Z]/.test(a)?1:0, cb=/[A-Z]/.test(b)?1:0; return (sb+cb)-(sa+ca)||groups[k][b]-groups[k][a]; }); names.forEach(function(n){map[n]=names[0]}); });
    return map;
  }
  function cluster(inst){
    var n=inst.length, parent=new Array(n); for(var i=0;i<n;i++)parent[i]=i;
    function find(x){while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x];}return x;}
    function union(a,b){a=find(a);b=find(b);if(a!==b)parent[b]=a;}
    var toks=inst.map(function(i){return tokens(i.title)}), sets=toks.map(function(t){return new Set(t)});
    // 1. same detector id → same class
    var byDet=Object.create(null); inst.forEach(function(i,ix){ if(i.detector){ var k='det:'+i.detector; if(byDet[k]!=null) union(byDet[k],ix); else byDet[k]=ix; } });
    // 2. exact normalised title
    var byNorm=Object.create(null); inst.forEach(function(i,ix){ var k=String(i.title||'').toLowerCase().replace(/[×x]\s*\d+\s*$/,'').replace(/[^a-z0-9]+/g,''); if(!k)return; if(byNorm[k]!=null) union(byNorm[k],ix); else byNorm[k]=ix; });
    // 3. fuzzy: shared rare tokens → Jaccard ≥ .5, or containment ≥ .8 with ≥3 tokens
    var inv=Object.create(null); toks.forEach(function(t,ix){t.forEach(function(w){(inv[w]=inv[w]||[]).push(ix)})});
    Object.keys(inv).forEach(function(w){ var list=inv[w]; if(list.length>80||list.length<2)return;
      for(var a=0;a<list.length;a++)for(var b=a+1;b<list.length;b++){ var i=list[a],j=list[b]; if(find(i)===find(j))continue; var A=sets[i],B=sets[j]; if(A.size<2||B.size<2)continue; var inter=0; A.forEach(function(x){if(B.has(x))inter++}); var uni=A.size+B.size-inter; var jac=inter/uni, cont=inter/Math.min(A.size,B.size); if(jac>=0.5||(cont>=0.8&&Math.min(A.size,B.size)>=3)) union(i,j); } });
    var groups=Object.create(null); inst.forEach(function(i,ix){var r=find(ix);(groups[r]=groups[r]||[]).push(i)});
    return Object.keys(groups).map(function(k){return groups[k]});
  }
  function mode(arr){var m=Object.create(null),best=null,bn=0;arr.forEach(function(x){if(!x)return;m[x]=(m[x]||0)+1;if(m[x]>bn){bn=m[x];best=x}});return best;}
  function build(d){
    var appMap=canonApps(d.instances); d.instances.forEach(function(i){i.appC=appMap[i.app]||i.app||'?'});
    var groups=cluster(d.instances);
    var classes=groups.map(function(g){
      var apps=Object.create(null),srcs=Object.create(null),cats=[],sevs=[],refs=Object.create(null),first=null,last=null,titles=Object.create(null);
      g.forEach(function(i){apps[i.appC]=(apps[i.appC]||0)+1;srcs[i.source]=(srcs[i.source]||0)+1;if(i.category)cats.push(i.category);if(i.severity)sevs.push(i.severity);if(i.ref)refs[i.ref]=1;if(i.ts){if(!first||i.ts<first)first=i.ts;if(!last||i.ts>last)last=i.ts;}
        var t=String(i.title||'').replace(/\s*[×x]\s*\d+\s*$/,''); titles[t]=(titles[t]||0)+(i.source==='catalogue'?3:1);});
      var title=Object.keys(titles).sort(function(a,b){return titles[b]-titles[a]||a.length-b.length})[0]||'(untitled)';
      var sev=sevs.sort(function(a,b){return (SEVR[a]==null?9:SEVR[a])-(SEVR[b]==null?9:SEVR[b])})[0]||null;
      var det=mode(g.map(function(i){return i.detector}));
      return {title:title,inst:g,apps:apps,nApps:Object.keys(apps).length,srcs:srcs,cat:mode(cats)||'other',sev:sev,det:det,refs:Object.keys(refs),first:first,last:last,n:g.length};
    });
    classes.sort(function(a,b){return b.nApps-a.nApps||b.refs.length-a.refs.length||b.n-a.n});
    window.__DATA={d:d,classes:classes,appMap:appMap};
    diffSinceSeen();
    render();
  }
  // ---- "thereafter": compare every read against what you last marked as seen ----
  var SNAP=null; try{SNAP=JSON.parse(localStorage.getItem('bl_admin_snap')||'null')}catch(e){}
  function ckey(t){return String(t||'').toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,80);}
  function snapshotOf(D){ var sig=Object.create(null); D.classes.forEach(function(c){sig[ckey(c.title)]={n:c.n,a:c.nApps}}); return {ts:Date.now(),sig:sig,an:D.d.analyses.map(function(x){return x.id}),inst:D.d.counts.instances}; }
  function diffSinceSeen(){
    var D=window.__DATA; D.since={newAnalyses:[],newClasses:[],grew:[],first:!SNAP};
    if(!SNAP)return;
    var seenAn=new Set(SNAP.an||[]);
    D.since.newAnalyses=D.d.analyses.filter(function(x){return !seenAn.has(x.id)});

    keys.forEach(function(k,i){var y=padT+inner, x=padL+i*bw; SRC.forEach(function(s){var v=by[k][s]||0;if(!v)return;var bh=v/max*inner;y-=bh;svg+='<rect x="'+(x+4).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+Math.max(2,bw-8).toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="var(--src-'+s+')"><title>'+k+' · '+SRCLBL[s]+': '+v+'</title></rect>';});
      var m=+k.slice(5)-1, lbl=bw>=72?MON[m]+' '+k.slice(0,4):MON[m]+' ’'+k.slice(2,4);
      svg+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle" font-size="12.5" fill="var(--ink-3)">'+lbl+'</text>';});
    box.innerHTML=svg+'</svg>';
  }
  function renderSources(){
    var D=window.__DATA, only=Object.create(null), tot=Object.create(null); D.classes.forEach(function(c){var ks=Object.keys(c.srcs); ks.forEach(function(s){tot[s]=(tot[s]||0)+c.srcs[s]}); if(ks.length===1)only[ks[0]]=(only[ks[0]]||0)+1;});
    $('#srctiles').innerHTML=SRC.map(function(s){return tile(tot[s]||0,SRCLBL[s]+' instances','s-ink-'+s,Bread.fmtN(only[s]||0)+' classes seen only here')}).join('');
  }
  function selectTab(name){$$('.adm-tabbar [role="tab"]').forEach(function(b){var on=b.dataset.tab===name;b.setAttribute('aria-selected',String(on));b.classList.toggle('on',on)});$$('.panel').forEach(function(p){p.hidden=(p.id!=='p-'+name)});try{history.replaceState(null,'','#'+name)}catch(e){} if(name==='timeline')renderTimeline(); measure();}
  function goClass(ix,app){ F.min=1; if(app){F.app=app;} $('#min').value='1'; if(app)$('#fapp').value=app; F.q=''; $('#q').value=''; renderClasses(); selectTab('classes'); var el=document.getElementById('c'+ix); if(el){el.dataset.open='true';$('.head',el).setAttribute('aria-expanded','true');ensureBody(el);el.scrollIntoView({behavior:'smooth',block:'start'});} }
  function setSrcChips(){ $$('[data-src]').forEach(function(b){var on=F.src===b.dataset.src;b.setAttribute('aria-pressed',String(on));b.classList.toggle('on',on)}); }
  function wire(){
    $('#q').oninput=Bread.debounce(function(){F.q=this.value;renderClasses()},150); $('#min').onchange=function(){F.min=+this.value;renderClasses()}; $('#sort').onchange=function(){F.sort=this.value;renderClasses()};
    $('#cat').onchange=function(){F.cat=this.value||null;renderClasses()}; var ms=$('#markSeen'); if(ms) ms.onclick=markSeen; $('#fapp').onchange=function(){F.app=this.value||null;renderClasses()};
    $('#clearF').onclick=function(){F.q='';F.min=1;F.src=null;F.cat=null;F.app=null;F.sort='apps';$('#q').value='';$('#min').value='1';$('#sort').value='apps';$('#cat').value='';$('#fapp').value='';setSrcChips();renderClasses();};
    document.onclick=function(ev){ var t=ev.target.closest('[data-tab],[data-src],[data-go],li.cls .head'); if(!t)return;
      if(t.dataset.tab){selectTab(t.dataset.tab);return;} if(t.dataset.src){F.src=F.src===t.dataset.src?null:t.dataset.src;setSrcChips();renderClasses();return;}
      if(t.dataset.go){goClass(+t.dataset.go,t.dataset.app);return;}
      if(t.classList.contains('head')){var li=t.parentElement,o=li.dataset.open!=='false';li.dataset.open=String(!o);t.setAttribute('aria-expanded',String(!o));if(!o)ensureBody(li);} };
    document.onkeydown=function(ev){if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList&&ev.target.classList.contains('head')){ev.preventDefault();ev.target.click();}};
  }
  function exportRows(){ return window.__DATA.classes.map(function(c){return {title:c.title,category:c.cat,severity:c.sev,detector:c.det,apps:Object.keys(c.apps),appCount:c.nApps,instances:c.n,analyses:c.refs.length,firstSeen:c.first?new Date(c.first).toISOString():null,lastSeen:c.last?new Date(c.last).toISOString():null,sources:c.srcs}}); }
  function download(name,text,type){ var b=new Blob([text],{type:type}); var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast('Downloaded '+name,'ok'); }
  function exportJson(){ if(!window.__DATA){toast('Nothing loaded yet','err');return;} download('bugledger-recurrence.json',JSON.stringify({generated:new Date().toISOString(),classes:exportRows()},null,2),'application/json'); }
  function exportCsv(){ if(!window.__DATA){toast('Nothing loaded yet','err');return;} var rows=exportRows(); var csv=['title,category,severity,detector,appCount,apps,instances,analyses,firstSeen,lastSeen'].concat(rows.map(function(r){return [r.title,r.category,r.severity||'',r.detector||'',r.appCount,r.apps.join('; '),r.instances,r.analyses,r.firstSeen||'',r.lastSeen||''].map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',')})).join('\n'); download('bugledger-recurrence.csv',csv,'text/csv'); }
  $('#exportJson').onclick=exportJson; $('#exportCsv').onclick=exportCsv;

  // ⌘K: admin actions, tabs and a search over the bug classes
  Bread.cmdk.register([
    {group:'Admin',label:'Re-read all reports',icon:'reset',run:function(){toast('Re-reading every report…');load();}},
    {group:'Admin',label:'Download JSON',icon:'download',run:exportJson},{group:'Admin',label:'Download CSV',icon:'download',run:exportCsv},
    {group:'Admin',label:'Mark all as seen',icon:'check',run:function(){if(window.__DATA)markSeen();}},
    {group:'Admin tabs',label:'Bug classes',icon:'bug',run:function(){selectTab('classes')}},{group:'Admin tabs',label:'App × bug heatmap',icon:'grid',run:function(){selectTab('heat')}},
    {group:'Admin tabs',label:'By analysis',icon:'file',run:function(){selectTab('analyses')}},{group:'Admin tabs',label:'Over time',icon:'activity',run:function(){selectTab('timeline')}},{group:'Admin tabs',label:'By source',icon:'inbox',run:function(){selectTab('sources')}}
  ]);
  window.BREAD_SEARCH=function(q){ if(!window.__DATA)return []; q=String(q||'').toLowerCase(); return window.__DATA.classes.filter(function(c){return c.title.toLowerCase().indexOf(q)>=0}).slice(0,12).map(function(c){return {group:'Bug classes',label:c.title,icon:'bug',sub:c.nApps+' app'+(c.nApps>1?'s':'')+' · '+c.n+' inst.',run:function(){goClass(window.__DATA.classes.indexOf(c))}}}); };
</script>
