<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Prompt Journal — every prompt sent to a coding agent, word for word, time-stamped, filed by project, with the photos that go with it. Private to the ledger owner.">
<title>Bug Ledger · Prompt Journal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%8D%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#f5f6fb; --ink:#12141c; --ink2:#3f4457; --muted:#5d6275; --card:rgba(255,255,255,.78); --panel:#fff;
    --line:rgba(18,20,28,.09); --coral:#ff6a5a; --coral2:#ff9270; --good:#12b886; --violet:#6f5cf0; --sky:#3b82f6;
    --shadow:0 18px 50px -24px rgba(30,25,60,.35); --mark:#fff2a8;
    --serif:ui-serif,"New York",Georgia,"Times New Roman",serif; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0b0d15; --ink:#eef0f7; --ink2:#c9cde0; --muted:#a0a6ba; --card:rgba(255,255,255,.055); --panel:#151826;
      --line:rgba(255,255,255,.11); --shadow:0 24px 60px -24px rgba(0,0,0,.7); --mark:#6b5a12; color-scheme:dark; }
  }
  html,body{margin:0;min-height:100%}
  body{font:15.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:var(--ink);background:var(--bg);
    overflow-x:hidden;position:relative;-webkit-font-smoothing:antialiased}
  .aurora{position:fixed;inset:-20vh -10vw;z-index:-1;filter:blur(72px) saturate(120%);opacity:.75;pointer-events:none}
  .aurora span{position:absolute;border-radius:50%;animation:drift 26s ease-in-out infinite}
  .aurora .a{width:50vw;height:50vw;left:-6vw;top:-8vh;background:radial-gradient(circle at 30% 30%,#ffb08a,transparent 62%)}
  .aurora .b{width:46vw;height:46vw;right:-8vw;top:-6vh;background:radial-gradient(circle at 60% 40%,#a9c4ff,transparent 62%);animation-delay:-7s}
  .aurora .c{width:46vw;height:46vw;left:14vw;bottom:-16vh;background:radial-gradient(circle at 50% 50%,#9ff0d8,transparent 60%);animation-delay:-13s}
  .aurora .d{width:38vw;height:38vw;right:6vw;bottom:-12vh;background:radial-gradient(circle at 50% 50%,#d2b9ff,transparent 62%);animation-delay:-18s}
  @media (prefers-color-scheme:dark){.aurora{opacity:.45}}
  @keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(3vw,4vh) scale(1.07)}66%{transform:translate(-3vw,-2vh) scale(.96)}}
  @media (prefers-reduced-motion:reduce){.aurora span,.rise{animation:none!important}}

  .wrap{max-width:1120px;margin:0 auto;padding:26px 20px 90px}
  header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 18px}
  .brand{font-weight:800;letter-spacing:-.02em;font-size:20px;text-decoration:none;color:inherit}
  .brand .dot{color:var(--coral)}
  .topnav{margin-left:auto;display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%}.topnav::-webkit-scrollbar{display:none}
  .topnav a,.topnav button{text-decoration:none;font:inherit;font-size:13px;font-weight:650;color:var(--muted);border:1px solid var(--line);background:transparent;
    border-radius:99px;padding:6px 12px;cursor:pointer;transition:.15s}
  .topnav a:hover,.topnav button:hover{color:var(--ink);border-color:var(--muted)}

  .hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:end;margin-bottom:18px}
  .hero h1{font:600 clamp(30px,4.6vw,46px)/1.08 var(--serif);letter-spacing:-.02em;margin:0 0 10px;text-wrap:balance}
  .hero h1 em{font-style:italic;background:linear-gradient(120deg,var(--coral),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .lede{color:var(--muted);margin:0;max-width:58ch;font-size:15.5px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);backdrop-filter:blur(14px) saturate(140%);
    text-align:left;font:inherit;color:inherit;cursor:pointer;transition:transform .12s}
  .kpi:hover{transform:translateY(-2px)}
  .kpi .n{font:600 26px/1.05 var(--serif);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .kpi .l{color:var(--muted);font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-top:3px}
  .kpi.on{border-color:var(--coral);box-shadow:0 0 0 1px var(--coral),var(--shadow)}

  .controls{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);
    padding:12px 0 10px;margin-bottom:14px;border-bottom:1px solid var(--line)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row + .row{margin-top:10px}
  .search{flex:1;min-width:220px;position:relative}
  .search input{width:100%;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 40px 10px 40px;outline:none}
  .search input:focus{border-color:var(--coral)}
  .search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
  .search kbd{position:absolute;right:11px;top:50%;transform:translateY(-50%);font:600 12.5px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
  select,.btn,.pick{font:inherit;font-size:14px;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 12px;outline:none;cursor:pointer}
  select:focus-visible,.btn:focus-visible,.chip:focus-visible,.kpi:focus-visible,.vt button:focus-visible,.ph:focus-visible,.copy:focus-visible,.more:focus-visible,input:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
  .btn:hover,select:hover{border-color:var(--muted)}
  .btn.solid{background:linear-gradient(135deg,var(--coral),var(--coral2));color:#fff;border:none;font-weight:750}
  .vt{display:inline-flex;padding:4px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
  .vt button{font:inherit;font-size:14px;font-weight:650;color:var(--muted);background:none;border:0;border-radius:9px;padding:6px 14px;cursor:pointer}
  .vt button.on{background:var(--ink);color:var(--bg)}
  .toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);cursor:pointer;user-select:none;padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .toggle input{accent-color:var(--coral);width:16px;height:16px;margin:0}
  .dates{display:none;gap:8px;align-items:center}
  .dates.show{display:inline-flex}
  .dates input{font:inherit;font-size:14px;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 10px}
  .count{color:var(--muted);font-size:13.5px;margin-left:auto;white-space:nowrap}
  .menu{position:relative}
  .menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;display:none;min-width:220px;z-index:40}
  .menu.open .pop{display:grid;gap:2px}
  .pop button,.pop label{font:inherit;font-size:14px;text-align:left;background:none;border:0;color:inherit;padding:8px 10px;border-radius:9px;cursor:pointer;display:flex;gap:9px;align-items:center}
  .pop button:hover,.pop label:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
  .pop label input{accent-color:var(--coral)}
  .pop .sep{height:1px;background:var(--line);margin:4px 2px}

  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 13px 0 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    font:600 13.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;cursor:pointer;white-space:nowrap;transition:.15s;--c:var(--muted)}
  .chip i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
  .chip em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
  .chip:hover{border-color:color-mix(in srgb,var(--c) 60%,var(--line))}
  .chip.on{background:color-mix(in srgb,var(--c) 16%,var(--panel));border-color:color-mix(in srgb,var(--c) 70%,transparent)}
  .chip.on em{color:var(--ink)}

  .day{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px;color:var(--ink)}
  .day h2{font:600 19px/1.2 var(--serif);margin:0;letter-spacing:-.01em;text-wrap:balance}
  .day span{color:var(--muted);font-size:13.5px}
  .day:first-child{margin-top:4px}

  .pc{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);backdrop-filter:blur(16px) saturate(140%);
    padding:16px 18px 14px;margin:0 0 12px;position:relative;transition:box-shadow .2s,border-color .2s}
  .pc.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .pc.hit{border-color:var(--coral);box-shadow:0 0 0 2px color-mix(in srgb,var(--coral) 40%,transparent),var(--shadow)}
  .pc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .proj{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:750;padding:4px 11px 4px 9px;border-radius:99px;color:var(--pt);background:var(--pb);cursor:pointer;border:0;font-family:inherit}
  .proj i{width:8px;height:8px;border-radius:50%;background:var(--pd)}
  .tag{font-size:12.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 9px;background:transparent}
  .tag.mid{color:#8a4f00;border-color:color-mix(in srgb,#f0a020 60%,transparent);background:color-mix(in srgb,#f0a020 12%,transparent)}
  .tag.cmd{color:#4b3bb8;border-color:color-mix(in srgb,var(--violet) 60%,transparent)}
  .tag.photo{color:#0d6f54;border-color:color-mix(in srgb,var(--good) 60%,transparent)}
  .tag.redact{color:#a12f20;border-color:color-mix(in srgb,#e5484d 60%,transparent);background:color-mix(in srgb,#e5484d 9%,transparent)}
  @media (prefers-color-scheme:dark){.tag.mid{color:#ffcf7a}.tag.cmd{color:#c2b6ff}.tag.photo{color:#7fe3c3}.tag.redact{color:#ffa39a}}
  .when{color:var(--ink2);font-size:13.5px;font-variant-numeric:tabular-nums;font-weight:650}
  .when small{color:var(--muted);font-weight:500;margin-left:5px;font-size:13px}
  .seq{color:var(--muted);font-size:13px}
  .spacer{flex:1}
  .copy,.more{font:inherit;font-size:13px;font-weight:700;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:9px;padding:5px 10px;cursor:pointer}
  .copy:hover,.more:hover{color:var(--ink);border-color:var(--muted)}
  .copy.ok{color:var(--good);border-color:var(--good)}
  .q{margin:0;font:400 16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);
    max-height:14.4em;overflow:hidden;position:relative;padding-left:16px;border-left:3px solid color-mix(in srgb,var(--pd,var(--coral)) 60%,transparent)}
  .q.open{max-height:none}
  .q.clamped:not(.open)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3.2em;background:linear-gradient(transparent,var(--panel))}
  @media (prefers-color-scheme:dark){.q.clamped:not(.open)::after{background:linear-gradient(transparent,#151826)}}
  .q mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
  .more-row{margin:6px 0 0 19px}
  .photos{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 0 19px}
  .ph{display:block;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);width:168px;text-decoration:none;color:inherit;cursor:zoom-in;
    transition:transform .12s ease,border-color .12s ease;box-shadow:0 6px 18px -12px rgba(0,0,0,.5)}
  .ph:hover{transform:translateY(-2px);border-color:var(--coral)}
  .ph img{display:block;width:100%;height:112px;object-fit:cover;object-position:top center;background:var(--bg)}
  .ph figcaption{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted);padding:5px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ph .k{font-size:12.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:0 6px;border-radius:99px;color:#fff;background:#4a4f63;flex:none}
  .ph .k.before{background:#b7472e}.ph .k.after{background:#0b7a57}.ph .k.pasted{background:#1d4ed8}.ph .k.shot{background:#5342c7}
  .pc-foot{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:12px 0 0 19px;color:var(--muted);font-size:13px}
  .pc-foot code{font:12.5px var(--mono);color:var(--muted)}
  .pc-foot a{color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--muted)}
  .pc-foot a:hover{color:var(--ink)}

  .sheetwrap{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(14px) saturate(140%);overflow:hidden}
  .tw{overflow-x:auto;overscroll-behavior-x:contain}
  table.sheet{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;min-width:760px}
  .sheet th{position:sticky;top:0;z-index:2;background:var(--panel);text-align:left;font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
  .sheet th:hover{color:var(--ink)}
  .sheet th .arr{font-size:12.5px;margin-left:4px;opacity:.7}
  .sheet td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  .sheet tr:last-child td{border-bottom:0}
  .sheet tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--ink) 2.5%,transparent)}
  .sheet tbody tr:hover td{background:color-mix(in srgb,var(--coral) 7%,transparent)}
  .sheet tbody tr.hit td{background:color-mix(in srgb,var(--coral) 14%,transparent)}
  .sheet .c-n{color:var(--muted);font-variant-numeric:tabular-nums;width:48px;font-family:var(--mono);font-size:12.5px}
  .sheet .c-date{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink2);width:118px}
  .sheet .c-time{white-space:nowrap;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px;width:96px}
  .sheet .c-proj,.sheet .c-arr,.sheet .c-sess{white-space:nowrap}
  .sheet .c-p{min-width:360px}
  .sheet .c-p pre{margin:0;font:inherit;font-size:14.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-height:6em;overflow:hidden;cursor:pointer}
  .sheet tr.open .c-p pre{max-height:none}
  .sheet .c-ph{width:150px}
  .sheet .c-ph .strip{display:flex;gap:5px;flex-wrap:wrap}
  .sheet .c-ph img{width:44px;height:44px;object-fit:cover;border-radius:8px;display:block;box-shadow:0 0 0 1px var(--line);cursor:zoom-in}
  .sheet .c-num{text-align:right;font-variant-numeric:tabular-nums;width:72px;color:var(--ink2)}
  .sheet .c-sess code,.sheet .c-id code{font:12.5px var(--mono);color:var(--muted)}
  .sheet .c-sess button{font:12.5px var(--mono);color:var(--muted);background:none;border:0;border-bottom:1px dotted var(--muted);cursor:pointer;padding:0}
  .sheet th[data-hide],.sheet td[data-hide]{display:none}

  .empty{text-align:center;padding:10vh 20px;color:var(--muted)}
  .empty h2{font:600 26px/1.2 var(--serif);color:var(--ink);margin:0 0 8px;text-wrap:balance}
  .empty pre{display:inline-block;text-align:left;font:13.5px/1.6 var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:14px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
  .loadmore{display:flex;justify-content:center;margin:18px 0 0}
  .foot{text-align:center;color:var(--muted);font-size:13px;margin-top:30px}
  .foot a{color:inherit}

  .gate{max-width:440px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);backdrop-filter:blur(16px) saturate(140%);padding:26px}
  .gate h1{font:600 30px/1.1 var(--serif);margin:0 0 6px;letter-spacing:-.02em;text-wrap:balance}
  .gate p{color:var(--muted);margin:0 0 16px;font-size:14.5px}
  .gate form{display:grid;gap:10px}
  .gate input{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;width:100%}
  .gate input:focus{border-color:var(--coral)}
  .gate .err{color:#e5484d;font-size:13.5px;font-weight:650;min-height:1.2em}

  #lb{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:26px;background:rgba(10,8,22,.86);backdrop-filter:blur(6px)}
  #lb.show{display:flex}
  #lb figure{margin:0;max-width:94vw;max-height:92vh;display:flex;flex-direction:column;gap:10px;align-items:center}
  #lb img{max-width:94vw;max-height:80vh;object-fit:contain;border-radius:14px;box-shadow:0 24px 70px -20px rgba(0,0,0,.7);background:#fff}
  #lb figcaption{color:#fff;font-weight:650;font-size:14.5px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
  #lb figcaption a{color:#fff;opacity:.85}
  #lb .x{position:fixed;top:16px;right:20px;font-size:34px;line-height:1;color:#fff;cursor:pointer;background:none;border:none;opacity:.85}
  #lb .nav{position:fixed;top:50%;transform:translateY(-50%);font-size:44px;color:#fff;cursor:pointer;background:none;border:none;opacity:.65;padding:0 14px}
  #lb .nav:hover,#lb .x:hover{opacity:1}
  #lb .prev{left:8px}#lb .next{right:8px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);font-weight:650;font-size:14px;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:200}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  @media (max-width:820px){
    .hero{grid-template-columns:minmax(0,1fr)}
    .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
    .count{margin-left:0;width:100%}
  }
  @media (max-width:560px){
    .wrap{padding:18px 16px 70px}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
    .pc{padding:14px 14px 12px;border-radius:16px}
    .q{font-size:15.5px;padding-left:12px}
    .photos,.pc-foot,.more-row{margin-left:0}
    .ph{width:calc(50% - 5px)}
    .topnav{margin-left:0;width:100%}.topnav a,.topnav button{flex:none}
  }
</style>
</head>
<body>
<div class="aurora"><span class="a"></span><span class="b"></span><span class="c"></span><span class="d"></span></div>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/">Bug Ledger<span class="dot">.</span> Prompt Journal</a>
    <nav class="topnav" aria-label="Ledger pages"><a href="/">Ledger</a><a href="/timeline">Activity</a><a href="/live">Live</a><a href="/admin">Admin</a><button type="button" id="signout" hidden>Sign out</button></nav>
  </header>
  <main id="app" aria-live="polite"></main>
  <div class="foot">Private, append-only record of every prompt · <a href="/AGENT.md#prompt-journal">how agents add to it</a> · <a href="/">back to the ledger</a></div>
</div>
<div id="lb" role="dialog" aria-modal="true" aria-label="Photo" onclick="if(event.target===this)LB.close()"><button class="x" aria-label="Close" onclick="LB.close()">×</button><button class="nav prev" aria-label="Previous" onclick="LB.step(-1)">‹</button><figure><img alt=""><figcaption></figcaption></figure><button class="nav next" aria-label="Next" onclick="LB.step(1)">›</button></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
  'use strict';
  var $=function(s,r){return (r||document).querySelector(s)}, $$=function(s,r){return [].slice.call((r||document).querySelectorAll(s))};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var app=$('#app'), KEY=null; try{KEY=localStorage.getItem('bl_admin_key')}catch(e){}
  var DATA={prompts:[],projects:[],summary:null,total:0,more:false,nextBefore:null};
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  /* ---- filtering ---- */

    if(F.range==='30d')return [s.getTime()-29*864e5,Infinity];
    if(F.range==='custom'){var a=F.from?new Date(F.from+'T00:00:00').getTime():-Infinity,b=F.to?new Date(F.to+'T23:59:59.999').getTime():Infinity;return [a,b]}

      if(p.ts<rb[0]||p.ts>rb[1])return false;
      if(F.photos&&!(p.photos&&p.photos.length))return false;
      if(F.arrival&&p.arrival!==F.arrival)return false;
      if(q&&p.text.toLowerCase().indexOf(q)<0&&keyOf(p).toLowerCase().indexOf(q)<0)return false;

    });

  function kpi(k,n,l){return '<button class="kpi'+(k==='photos'&&F.photos||k==='today'&&F.range==='today'?' on':'')+'" type="button" data-k="'+k+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></button>'}

    $$('.sheet th').forEach(function(th){th.onclick=function(){var k=th.dataset.k;if(SORTK===k)SORTD=-SORTD;else{SORTK=k;SORTD=1}render(false)}});
    $$('.menu').forEach(function(m){var b=$('button',m);b.onclick=function(e){e.stopPropagation();var o=!m.classList.contains('open');$$('.menu').forEach(function(x){x.classList.remove('open');$('button',x).setAttribute('aria-expanded','false')});m.classList.toggle('open',o);b.setAttribute('aria-expanded',String(o))}});
    $$('[data-x]').forEach(function(b){b.onclick=function(){exportAs(b.dataset.x)}});
    $$('[data-col]').forEach(function(c){c.onchange=function(){var off=(F.cols||'').split(',').filter(Boolean);var i=off.indexOf(c.dataset.col);if(c.checked&&i>=0)off.splice(i,1);if(!c.checked&&i<0)off.push(c.dataset.col);F.cols=off.join(',');render(false)}});
    var more=$('#more'); if(more)more.onclick=function(){loadMore(more)};
  }
  document.addEventListener('click',function(){$$('.menu.open').forEach(function(m){m.classList.remove('open');$('button',m).setAttribute('aria-expanded','false')})});
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&!/input|textarea|select/i.test(document.activeElement.tagName)){e.preventDefault();var q=$('#q');if(q)q.focus()}
    if(e.key==='Escape'){if($('#lb').classList.contains('show'))LB.close();else if(document.activeElement&&document.activeElement.id==='q'&&F.q){F.q='';render(false)}}
    if($('#lb').classList.contains('show')){if(e.key==='ArrowLeft')LB.step(-1);if(e.key==='ArrowRight')LB.step(1)}
  });
  function byId(id){for(var i=0;i<DATA.prompts.length;i++)if(DATA.prompts[i].id===id)return DATA.prompts[i];return null}
  function jumpTo(){var el=document.getElementById((F.view==='sheet'?'r-':'p-')+F.id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})}
  function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t);var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();return Promise.resolve()}
  var tt; function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},1800)}

  /* ---- export: the rows currently shown, every field, the text untouched ---- */
  function rowsFor(list){return list.map(function(p,i){return {n:i+1,date:dayKey(p.ts),time:hms(p.ts),iso:new Date(p.ts).toISOString(),project:keyOf(p),folder:p.project||'',app:p.app||'',prompt:p.text,chars:p.chars,words:p.words,arrival:p.arrival||'',source:p.source||'',agent:p.agent||'',session:p.sessionId||'',seq:p.seq||'',photos:(p.photos||[]).length,photo_links:(p.photos||[]).map(function(x){return x.url}).join(' '),secrets_removed:p.redactions||0,sha256:p.sha,id:p.id}})}
  function csvCell(v){var s=String(v==null?'':v);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
  function download(name,text,type){var b=new Blob([text],{type:type});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
  function exportAs(kind){
    var rows=rowsFor(filtered()),keys=rows.length?Object.keys(rows[0]):[],stamp=dayKey(Date.now());
    if(kind==='csv'){download('prompt-journal-'+stamp+'.csv','﻿'+[keys.join(',')].concat(rows.map(function(r){return keys.map(function(k){return csvCell(r[k])}).join(',')})).join('\r\n'),'text/csv;charset=utf-8');toast(rows.length+' rows downloaded')}
    else if(kind==='tsv'){copyText([keys.join('\t')].concat(rows.map(function(r){return keys.map(function(k){return String(r[k]==null?'':r[k]).replace(/\t/g,'    ').replace(/\r?\n/g,' ⏎ ')}).join('\t')})).join('\n')).then(function(){toast('Copied '+rows.length+' rows — paste into a sheet')})}
    else if(kind==='md'){copyText(rows.map(function(r){return '### '+r.date+' '+r.time+' · '+r.project+(r.photos?' · '+r.photos+' photo(s)':'')+'\n\n'+r.prompt.split('\n').map(function(l){return '> '+l}).join('\n')+'\n'}).join('\n')).then(function(){toast('Copied as Markdown')})}
    else if(kind==='json'){download('prompt-journal-'+stamp+'.json',JSON.stringify(filtered(),null,1),'application/json')}
  }

  /* ---- lightbox ---- */
  var LB=window.LB={i:0,open:function(i){this.i=i;this.show();$('#lb').classList.add('show');$('#lb .x').focus()},close:function(){$('#lb').classList.remove('show')},step:function(d){this.i=(this.i+d+ALLPH.length)%ALLPH.length;this.show()},
    show:function(){var it=ALLPH[this.i];if(!it)return;var img=$('#lb img');img.src=it.ph.url;img.alt=it.ph.caption||it.ph.kind||'photo';
      $('#lb figcaption').innerHTML='<span class="k '+esc(it.ph.kind||'shot')+'" style="font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:12.5px">'+esc(it.ph.kind||'shot')+'</span><span>'+esc(it.ph.caption||'')+'</span><span style="opacity:.75">'+esc(keyOf(it.p))+' · '+esc(dmy(it.p.ts))+' '+hms(it.p.ts)+'</span><span style="opacity:.75">'+(this.i+1)+' / '+ALLPH.length+'</span><a href="'+esc(it.ph.url)+'" target="_blank" rel="noopener">open full size ↗</a>'}};

  load(true);
})();
</script>
</body>
</html>
