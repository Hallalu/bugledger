<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bug Ledger · Live</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9F%A2%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#f5f6fb; --ink:#12141c; --muted:#636879; --card:rgba(255,255,255,.72);
    --line:rgba(18,20,28,.08); --coral:#ff6a5a; --coral2:#ff9270; --good:#12b886;
    --shadow:0 18px 50px -22px rgba(30,25,60,.35);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0b0d15; --ink:#eef0f7; --muted:#9aa0b4; --card:rgba(255,255,255,.055);
      --line:rgba(255,255,255,.10); --shadow:0 24px 60px -24px rgba(0,0,0,.7); }
  }
  html,body{margin:0;min-height:100%}
  body{
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    color:var(--ink); background:var(--bg); overflow-x:hidden; position:relative;
    -webkit-font-smoothing:antialiased;
  }
  /* aurora */
  .aurora{position:fixed;inset:-20vh -10vw;z-index:-1;filter:blur(70px) saturate(120%);opacity:.85;pointer-events:none}
  .aurora span{position:absolute;border-radius:50%;mix-blend-mode:normal;animation:drift 22s ease-in-out infinite}
  .aurora .a{width:52vw;height:52vw;left:-6vw;top:-8vh;background:radial-gradient(circle at 30% 30%,#ff9a7a,transparent 62%);animation-delay:0s}
  .aurora .b{width:46vw;height:46vw;right:-6vw;top:-4vh;background:radial-gradient(circle at 60% 40%,#8ab6ff,transparent 62%);animation-delay:-6s}
  .aurora .c{width:48vw;height:48vw;left:16vw;bottom:-16vh;background:radial-gradient(circle at 50% 50%,#7ff0cf,transparent 60%);animation-delay:-11s}
  .aurora .d{width:40vw;height:40vw;right:8vw;bottom:-12vh;background:radial-gradient(circle at 50% 50%,#c9a3ff,transparent 62%);animation-delay:-16s}
  @media (prefers-color-scheme:dark){.aurora{opacity:.5}}
  @keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(3vw,4vh) scale(1.08)}66%{transform:translate(-3vw,-2vh) scale(.96)}}
  @media (prefers-reduced-motion:reduce){.aurora span{animation:none}}

  .wrap{max-width:920px;margin:0 auto;padding:30px 20px 80px}
  header.top{display:flex;align-items:center;gap:12px;margin:6px 0 22px}
  .brand{font-weight:800;letter-spacing:-.02em;font-size:20px}
  .brand .dot{color:var(--coral)}
  .top .sub{color:var(--muted);font-size:13.5px;margin-left:auto;display:flex;align-items:center;gap:7px}
  .beat{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(18,184,134,.6);animation:beat 1.6s ease-out infinite}
  @keyframes beat{0%{box-shadow:0 0 0 0 rgba(18,184,134,.55)}70%{box-shadow:0 0 0 9px rgba(18,184,134,0)}100%{box-shadow:0 0 0 0 rgba(18,184,134,0)}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
    backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
    padding:22px 22px 20px;margin:0 0 18px}
  .card.enter{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}   /* one-shot entrance only */
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .chead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .status{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
    padding:4px 10px;border-radius:99px}
  .status.live{color:var(--coral);background:color-mix(in srgb,var(--coral) 14%,transparent)}
  .status.live .pip{width:8px;height:8px;border-radius:50%;background:var(--coral);animation:beat2 1.4s ease-out infinite}
  @keyframes beat2{0%{box-shadow:0 0 0 0 rgba(255,106,90,.6)}70%{box-shadow:0 0 0 8px rgba(255,106,90,0)}100%{box-shadow:0 0 0 0 rgba(255,106,90,0)}}
  .status.done{color:var(--good);background:color-mix(in srgb,var(--good) 15%,transparent)}
  .status.idle{color:var(--muted);background:color-mix(in srgb,var(--muted) 14%,transparent)}
  .meta{margin-left:auto;color:var(--muted);font-size:13px;text-align:right}
  .meta b{color:var(--ink);font-weight:650}
  .title{font-weight:700;font-size:15px;color:var(--muted);margin:2px 0 12px}
  .current{font-weight:750;font-size:23px;letter-spacing:-.01em;line-height:1.25;margin:2px 0 16px;transition:opacity .3s}
  .current .car{display:inline-block;width:9px;height:1.05em;vertical-align:-2px;margin-left:3px;border-radius:2px;background:var(--coral);animation:blink 1.1s step-end infinite}
  @keyframes blink{50%{opacity:0}}

  .bar{height:9px;border-radius:99px;background:color-mix(in srgb,var(--muted) 18%,transparent);overflow:hidden;margin:0 0 4px}
  .bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--coral),var(--coral2));
    transition:width .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px -2px var(--coral)}
  .barlbl{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;margin-bottom:14px}

  ul.tasks{list-style:none;margin:0;padding:0;display:grid;gap:2px}
  li.task{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;transition:background .3s}
  li.task .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800}
  li.task.pending .ic{border:2px solid color-mix(in srgb,var(--muted) 45%,transparent);color:transparent}
  li.task.pending .tx{color:var(--muted)}
  li.task.active{background:color-mix(in srgb,var(--coral) 9%,transparent)}
  li.task.active .ic{color:#fff;background:linear-gradient(135deg,var(--coral),var(--coral2));box-shadow:0 0 0 4px color-mix(in srgb,var(--coral) 16%,transparent)}
  li.task.active .ic .spin{width:11px;height:11px;border-radius:50%;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;animation:spin .8s linear infinite}
  li.task.active .tx{font-weight:650}
  li.task.done .ic{color:#fff;background:var(--good)}
  li.task.done .tx{color:var(--muted)}
  li.task.done .tx::after{content:"";display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
  li.task.pop .ic{animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
  @keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
  .note{margin-top:12px;color:var(--muted);font-size:13.5px;font-style:italic;border-left:2px solid var(--line);padding-left:10px}

  .empty{text-align:center;padding:16vh 20px;color:var(--muted)}
  .empty h1{font-size:26px;color:var(--ink);font-weight:800;margin:0 0 8px;letter-spacing:-.02em}
  .empty code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 7px}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:26px}
  .foot a{color:inherit}
</style>
</head>
<body>
<div class="aurora"><span class="a"></span><span class="b"></span><span class="c"></span><span class="d"></span></div>
<div class="wrap">
  <header class="top">
    <div class="brand">Bug Ledger<span class="dot">.</span> Live</div>
    <div class="sub"><span class="beat"></span><span id="pollstate">watching…</span></div>
  </header>
  <main id="board"></main>
  <div class="foot">Live worklog · <a href="/timeline">activity timeline</a> · <a href="/">back to the ledger</a></div>
</div>
<script>
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  function ago(ms){ var s=Math.max(0,Math.floor(ms/1000)); if(s<60) return s+'s'; var m=Math.floor(s/60); if(m<60) return m+'m '+(s%60)+'s'; var h=Math.floor(m/60); return h+'h '+(m%60)+'m'; }
  function iconHTML(status){
    if(status==='done') return '✓';
    if(status==='active') return '<span class="spin"></span>';
    return '•';
  }
  var board = document.getElementById('board');
  var cards = {};      // id -> {el, refs, started, prevTasks:[status], prevCurrent, offset}
  var skew = 0;        // serverNow - clientNow, so elapsed clocks stay honest between polls

  function makeCard(s){
    var el = document.createElement('section'); el.className='card enter'; el.dataset.id=s.id;
    setTimeout(function(){ el.classList.remove('enter'); }, 600);   // strip so moves don't replay it
    el.innerHTML =
      '<div class="chead"><span class="status"></span><div class="meta"></div></div>'+
      '<div class="title"></div>'+
      '<div class="current"></div>'+
      '<div class="bar"><i></i></div>'+
      '<div class="barlbl"><span class="dn"></span><span class="pct"></span></div>'+
      '<ul class="tasks"></ul>'+
      '<div class="note" hidden></div>';
    var refs = { status:el.querySelector('.status'), meta:el.querySelector('.meta'), title:el.querySelector('.title'),
      current:el.querySelector('.current'), bar:el.querySelector('.bar>i'), dn:el.querySelector('.dn'),
      pct:el.querySelector('.pct'), tasks:el.querySelector('.tasks'), note:el.querySelector('.note') };
    return { el:el, refs:refs, prevTasks:[], prevCurrent:null, started:s.started };
  }

  function renderTasks(c, tasks){
    var ul = c.refs.tasks;
    if(ul.children.length !== tasks.length){        // structure changed → rebuild rows
      ul.innerHTML = tasks.map(function(t){ return '<li class="task '+t.status+'"><span class="ic">'+iconHTML(t.status)+'</span><span class="tx">'+esc(t.text)+'</span></li>'; }).join('');
    } else {
      tasks.forEach(function(t,i){
        var li = ul.children[i], was = c.prevTasks[i];
        if(li.className.indexOf(t.status)<0 || was!==t.status){
          li.className = 'task '+t.status + ((was && was!=='done' && t.status==='done') ? ' pop' : '');
          li.querySelector('.ic').innerHTML = iconHTML(t.status);
          if(li.className.indexOf('pop')>=0) setTimeout((function(x){return function(){x.classList.remove('pop');};})(li), 600);
        }
        var tx=li.querySelector('.tx'); if(tx.textContent!==t.text) tx.textContent=t.text;
      });
    }
    c.prevTasks = tasks.map(function(t){return t.status;});
  }

  function update(c, s, now){
    var live=s.live, done=s.status==='done';
    c.refs.status.className = 'status '+(done?'done':live?'live':'idle');
    c.refs.status.innerHTML = done?'✓ done':live?'<span class="pip"></span>live':'idle';
    c.started = s.started;
    c.refs.meta.innerHTML = '<b>'+esc(s.app||'')+'</b>'+(s.project?' · '+esc(s.project):'')+'<br>'+
      (done?'finished ':'started ')+ago(now-(s.started||now))+' ago';
    if(c.refs.title.textContent!==(s.title||'')) c.refs.title.textContent=s.title||'';
    c.refs.title.hidden = !s.title;
    var cur=(s.current||'…');
    if(c.prevCurrent!==cur){                          // fade the bold line only when it changes
      c.refs.current.style.opacity=0;
      setTimeout(function(){ c.refs.current.innerHTML=esc(cur)+(live?'<span class="car"></span>':''); c.refs.current.style.opacity=1; }, 140);
      c.prevCurrent=cur;
    } else if(!c.refs.current.querySelector('.car') && live){ c.refs.current.innerHTML=esc(cur)+'<span class="car"></span>'; }
    var pg=s.progress;
    if(pg && pg.total){                              // full-scan counter (e.g. 100 / 315 bugs)
      var ppct=Math.round(pg.done/pg.total*100);
      c.refs.bar.style.width=ppct+'%';
      c.refs.dn.textContent=pg.done+' / '+pg.total+' '+(pg.label||'')+' checked';
      c.refs.pct.textContent=ppct+'%';
    } else {
      var total=s.total||(s.tasks||[]).length, dn=s.done||0, pct=total?Math.round(dn/total*100):0;
      c.refs.bar.style.width=pct+'%';
      c.refs.dn.textContent=dn+' / '+total+' done'; c.refs.pct.textContent=pct+'%';
    }
    renderTasks(c, s.tasks||[]);
    if(s.note){ c.refs.note.hidden=false; c.refs.note.textContent=s.note; } else c.refs.note.hidden=true;
  }

  function render(data){
    var sessions=(data&&data.sessions)||[];
    sessions.sort(function(a,b){ return (b.live?1:0)-(a.live?1:0) || b.updated-a.updated; });
    var empty=document.getElementById('emptyState');
    if(!sessions.length){
      Object.keys(cards).forEach(function(id){ cards[id].el.remove(); delete cards[id]; });
      if(!empty){ board.innerHTML='<div class="empty" id="emptyState"><h1>No live work right now</h1>'+
        '<p>When an agent runs <code>worklog.mjs</code> (or <code>/showwork</code>) you\'ll watch its tasks tick off here in real time.</p></div>'; }
      document.getElementById('pollstate').textContent='watching…'; return;
    }
    if(empty) empty.remove();
    if(data.now) skew = data.now - Date.now();
    var now=Date.now()+skew, seen={};
    sessions.forEach(function(s){
      seen[s.id]=1;
      var c=cards[s.id];
      if(!c){ c=makeCard(s); cards[s.id]=c; board.appendChild(c.el); }
      update(c, s, now);
    });
    Object.keys(cards).forEach(function(id){ if(!seen[id]){ cards[id].el.remove(); delete cards[id]; } });
    // keep DOM order = sorted order — but only touch the DOM if the order actually changed
    var want = sessions.map(function(s){ return cards[s.id].el; });
    var cur = Array.prototype.slice.call(board.children);
    var same = want.length===cur.length && want.every(function(n,i){ return n===cur[i]; });
    if(!same) want.forEach(function(n){ board.appendChild(n); });
    document.getElementById('pollstate').textContent = sessions.some(function(s){return s.live;})?'live':'watching…';
  }

  function poll(){
    fetch('/api/sessions?active=1&limit=12',{cache:'no-store'})
      .then(function(r){return r.json();}).then(render)
      .catch(function(){ document.getElementById('pollstate').textContent='reconnecting…'; });
  }
  poll(); setInterval(poll, 1500);
</script>
</body>
</html>
